<style>
/* Layout: phone = one column + bottom tab bar; tablet/PC = left rail + wider card grid. Accent = bumper-plate red. */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --sunk:#E3E6EB; --ink:#15181E; --muted:#5F6878; --line:#D6DAE1;
  --accent:#D9412A; --accent-ink:#FFFFFF; --accent-soft:#FBE4DF; --ok:#1E7F55; --ok-soft:#DDF1E7; --rest:#2C7DA0; --rest-soft:#DCEEF5;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  --r:14px; --tap:48px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111318; --surface:#1A1D24; --sunk:#242833; --ink:#ECEEF2; --muted:#9BA3B3; --line:#2D323D;
  --accent:#FF6448; --accent-ink:#1A0B07; --accent-soft:#3A1F1A; --ok:#4CC28C; --ok-soft:#173226; --rest:#5DB7DE; --rest-soft:#16303B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111318; --surface:#1A1D24; --sunk:#242833; --ink:#ECEEF2; --muted:#9BA3B3; --line:#2D323D;
  --accent:#FF6448; --accent-ink:#1A0B07; --accent-soft:#3A1F1A; --ok:#4CC28C; --ok-soft:#173226; --rest:#5DB7DE; --rest-soft:#16303B; color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.app{min-height:100%}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(96px + var(--sab))}
.wrap{max-width:min(1100px,100%);margin:0 auto;display:flex;flex-direction:column;gap:16px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + var(--sab)) max(8px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;justify-content:center;border:0;background:none;color:var(--muted);font-size:12px;border-radius:10px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent);font-weight:700}
.brand{display:none}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:210px 1fr}
  nav.tabs{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;border-top:0;border-right:1px solid var(--line);padding:24px 14px}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;font-size:15px}
  .tab.on{background:var(--accent-soft)}
  .brand{display:block;font-family:var(--f-display);font-size:22px;padding:0 14px 18px}
  main{padding-block:32px}
}

h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:17px;margin:0;font-weight:700}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.sub{color:var(--muted);font-size:14px;margin:0}
.head{display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.done{border-color:var(--ok)}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.grid.two{grid-template-columns:1fr 1fr}.grid.two>:only-child{grid-column:1/-1}}

.btn{min-height:var(--tap);padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.soft{background:var(--sunk);border-color:transparent}
.btn.small{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn.danger{color:var(--accent)}
.badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);font-weight:500;white-space:nowrap;line-height:1.5}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.swatch{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none}

.rcard h2{font-family:var(--f-display);font-weight:400;font-size:22px}
.rcard .names{color:var(--muted);font-size:14px}

/* sticky session bar */
.sbar{position:fixed;top:0;left:0;right:0;z-index:15;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 6px 16px -12px rgba(0,0,0,.4);
  padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.sbar .in{max-width:min(1100px,100%);margin:0 auto;display:flex;flex-direction:column;gap:6px}
.sbar .top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.sbar .cnt{font-family:var(--f-num);font-size:15px;font-weight:600;white-space:nowrap}
.sbar-space{height:60px}
.inp.n{font-family:var(--f-num);font-size:17px;font-weight:600;text-align:center;padding:0 6px}
.sbar .clock{font-family:var(--f-num);font-size:22px;font-weight:600;line-height:1}
.sbar .ivmini{font-size:13px;font-weight:700;color:var(--accent)}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}

.ex-title{font-weight:700;font-size:17px}
.lv{font-size:13px;color:var(--accent);font-weight:500}
.target{font-size:13px;color:var(--muted)}
.sethead,.setrow{display:grid;gap:8px;align-items:center}
.sethead{font-size:12px;color:var(--muted);text-align:center}
.stepper{display:grid;grid-template-columns:40px 1fr 40px;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:var(--tap);background:var(--surface)}
.stepper button{border:0;background:var(--sunk);font-size:20px;line-height:1}
.stepper input{border:0;background:transparent;text-align:center;width:100%;min-width:0;font-family:var(--f-num);font-size:17px;font-weight:600}
.check{width:44px;height:var(--tap);border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-num);font-weight:600;color:var(--muted)}
.check.done{background:var(--ok);border-color:var(--ok);color:#fff}
.setrow.done .stepper{opacity:.55}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.field input,.inp{min-height:var(--tap);border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;width:100%;min-width:0}
.field input.n{font-family:var(--f-num);font-size:17px;font-weight:600;text-align:center}
select.inp{padding-right:8px}
.unit{font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{max-width:100%;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;line-height:1.2;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
textarea.inp{padding:12px;min-height:80px;resize:vertical}
.sticky-foot{position:sticky;bottom:calc(76px + var(--sab));z-index:5}
@media (min-width:900px){.sticky-foot{bottom:16px}}

/* interval timer */
.ivplan{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.ivplan .p{padding:4px 10px;border-radius:8px;background:var(--sunk)}
.ivplan .p.w{background:var(--accent-soft);color:var(--accent);font-weight:700}
.ivplan .p.r{background:var(--rest-soft);color:var(--rest);font-weight:700}
.timer{border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--sunk);text-align:center}
.timer.work{background:var(--accent-soft)} .timer.work .ph{color:var(--accent)}
.timer.rest{background:var(--rest-soft)} .timer.rest .ph{color:var(--rest)}
.timer .ph{font-family:var(--f-display);font-size:30px;line-height:1.1}
.timer .left{font-family:var(--f-num);font-size:56px;font-weight:600;line-height:1}
.timer .note{font-size:15px;font-weight:700}
.timer .nx{font-size:13px;color:var(--muted)}
.timer .progress{width:100%}
.btn.picked{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.sec-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding:10px 0 2px;border:0;background:none;width:100%;text-align:left;min-height:44px}
.sec-head .sub{font-weight:500}
.rrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rmain{display:flex;align-items:center;gap:10px;min-height:48px;border:0;background:none;text-align:left;padding:0;min-width:0}
.rmain .t{min-width:0}.rmain strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmain .sub{font-size:12px}
.rnames{grid-column:1/-1;font-size:13px;color:var(--muted);padding:0 0 6px 22px}
.btn.go{min-height:44px;padding:0 14px}
.btn.tog{min-height:44px;padding:0 10px;min-width:56px}
.blockhead{border:0;background:none;text-align:left;display:flex;align-items:center;gap:8px;min-height:44px;padding:0;flex-wrap:wrap}
.part{display:grid;grid-template-columns:44px 1fr auto auto;gap:8px;align-items:center}
.part .nm{min-width:0}
.part.done .nm{color:var(--muted);text-decoration:line-through}
.pthumb{width:100%;height:auto;border-radius:10px;background:var(--sunk);display:block}
#posec{display:block;margin:0 auto;border-radius:12px;touch-action:none;background:var(--sunk)}
.tip{font-size:13px;line-height:1.45;margin-top:4px}
.ptrow{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.bpart{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.bpart:last-of-type{border-bottom:0}
.seg.mini{grid-template-columns:1fr 1fr;width:104px;flex:none}.seg.mini button{min-height:34px}
.arow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.heat{display:grid;grid-template-columns:repeat(7,10px);gap:2px}
.heat i{width:10px;height:10px;border-radius:2px;background:var(--sunk)}
.heat i.on{background:var(--ok)}
.heat i.td{box-shadow:inset 0 0 0 1.5px var(--muted)}
.warn{color:var(--accent);font-weight:700}
.badge.tagb{background:var(--rest-soft);color:var(--rest);vertical-align:middle;margin-left:2px}
.hrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th,.cmp td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp th{font-size:12px;color:var(--muted);font-weight:500}
.better{color:var(--ok);font-weight:700}.worse{color:var(--accent);font-weight:700}
.note-text{white-space:pre-wrap;font-size:14px;margin:0}
.scale{display:grid;grid-template-columns:40px 1fr 40px;gap:6px;align-items:center}
.scale button{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);font-size:18px}
.scale input{text-align:center}
.sides{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.side{min-height:32px;padding:0 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-family:var(--f-num)}
.side.on{background:var(--ok);border-color:var(--ok);color:#fff}
.side.part-of{border-style:dashed}
.ritem{display:grid;grid-template-columns:40px 1fr auto auto;gap:6px;align-items:center;min-height:52px;border:1px solid var(--line);border-radius:12px;padding:4px 6px;background:var(--surface)}
.ritem.dragging{opacity:.85;box-shadow:0 8px 20px -8px rgba(0,0,0,.45);border-color:var(--accent)}
.ritem.fixed{background:var(--sunk);color:var(--muted);grid-template-columns:40px 1fr}
.grab{touch-action:none;cursor:grab;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted);user-select:none;-webkit-user-select:none}
.rlist{display:flex;flex-direction:column;gap:6px}
.badge.tag-w{background:var(--ok-soft);color:var(--ok)} .badge.tag-c{background:var(--rest-soft);color:var(--rest)}

/* ladder (levels) */
.ladder{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:32px 1fr;gap:12px}
.step .node{display:flex;flex-direction:column;align-items:center}
.step .node b{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:14px;border:2px solid var(--line);background:var(--surface);color:var(--muted)}
.step .node i{flex:1;width:2px;background:var(--line);min-height:12px}
.step.reached .node b{border-color:var(--ok);background:var(--ok);color:#fff}
.step.cur .node b{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.step:last-child .node i{display:none}
.step .body{padding-bottom:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.hist{font-size:12px;color:var(--muted)}

/* library list */
.exrow{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 4px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.exrow:last-child{border-bottom:0}
.exrow .ch{color:var(--muted);font-size:18px}
.catlabel{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;padding-top:6px}

/* history */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:12px;color:var(--muted);padding:4px 0}
.day{position:relative;aspect-ratio:1;max-width:100%;border:0;border-radius:10px;background:transparent;font-family:var(--f-num);font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.day .dots{display:flex;gap:3px;height:7px}
.day .dots i{width:7px;height:7px;border-radius:50%}
.day.ph::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;border:1.5px solid var(--muted)}
.day.today{box-shadow:inset 0 0 0 1.5px var(--line)}
.day.sel{background:var(--sunk);box-shadow:inset 0 0 0 2px var(--ink)}
.legend{display:flex;gap:6px 14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.loglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.loglist li{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
.loglist li:last-child{border-bottom:0}
.loglist .v{color:var(--muted);text-align:right;font-family:var(--f-num);font-size:13px}
.loglist .lvn{display:block;font-size:12px;color:var(--muted)}
.thumb{width:100%;max-width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;background:var(--sunk)}
.banner{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.banner .sub{color:inherit;opacity:.75}
.banner .btn{border-color:transparent}

/* report */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-family:var(--f-num);font-size:24px;font-weight:600;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:88px 1fr 28px;gap:8px;align-items:center;font-size:13px}
.bar .t{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar .n{font-family:var(--f-num);text-align:right;color:var(--muted)}
.blog{background:var(--surface);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);max-width:420px;width:100%;margin:0 auto}
.blog .date{font-family:var(--f-display);font-size:30px;line-height:1.1}
.blog .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.capture{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + var(--sab)) max(16px,env(safe-area-inset-left,0px))}
.capture .blog{margin:auto}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + var(--sab)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.backdrop{align-items:center}.sheet{border-radius:20px}}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;border:1px solid var(--line);border-radius:12px;padding:8px 14px;background:var(--surface);text-align:left;width:100%}
.opt .box{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bigstep{display:grid;gap:10px}
.bigstep .stepper{grid-template-columns:1fr;grid-template-rows:42px 48px 42px;border-radius:14px}
.bigstep .lbl{font-size:12px;color:var(--muted);text-align:center;margin-bottom:4px}
.diff{font-family:var(--f-num);font-weight:600}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px var(--surface)}
.colors button.on{border-color:var(--ink)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--sab));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:12px;padding:12px 14px;margin:0}
.empty{text-align:center;color:var(--muted);padding:20px 0;font-size:14px}
@media (prefers-reduced-motion:no-preference){.sheet.anim{animation:up .22s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}

<div id="app" class="app"></div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ===== 기본 정의 ===== */
// [이름, 단위, 증감폭, 기록 표시용 앞말]
const FIELDS={reps:['횟수','회',1,''],kg:['무게','kg',2.5,''],sec:['시간','초',5,''],min:['시간','분',1,''],
  speed:['속도','km/h',.5,''],incline:['경사도','%',1,'경사 '],level:['강도','단계',1,'강도 '],rpm:['RPM','rpm',5,''],
  assist:['보조','kg',2.5,'보조 '],dist:['거리','km',.1,''],kcal:['칼로리','kcal',10,''],hr:['심박','bpm',1,'']};
const PRIMARY=['reps','sec','min'];
const COLORS=['#E0533D','#E9A23B','#3FA36B','#2F8FB3','#5B6CE0','#A05BD6','#D65B97','#7A8494'];
const WD='일월화수목금토';
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const num=v=>v===''||v==null?'':Number(v);
const mmss=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+pad(m):m)+':'+pad(s%60)};
const DEF={reps:12,kg:0,sec:30,min:20,assist:20};

/* ===== 저장소: 저널과 같은 구글 시트 (저널에서 넣은 연결 정보를 그대로 씀, 같은 github.io 주소라 공유됨) =====
   루틴 → workout_routines 탭 / 기록·수업 노트·몸 상태·진행 중 운동 → workouts 탭 / 종목·묶음·카테고리·부위·태그·체중 → meta 탭(wk_ 로 시작)
   바뀐 줄만 올림, 다른 기기 변경은 열 때·돌아올 때·2분마다 가져옴. 연결이 없으면 이 기기 브라우저에만 저장 */
const EMPTY=()=>({cats:[],ex:[],blocks:[],areas:[],tags:[],notes:[],checks:[],routines:[],body:{kg:''},logs:[],session:null});
let D=EMPTY();
let MODE='loading';            // 'db'(구글 시트) | 'local'(이 기기) | 'loading'
let db=null,assets=null,downloads=null,booted=false,pendingRender=false;
const LKEY='owoonwan-local-v1';
const W={config:''};
let flushT=null,flushing=false,dirty=false,retryT=null;
let CONN=(()=>{try{const c=JSON.parse(localStorage.getItem('jnl_conn')||'null');if(!c||!c.url||!c.token)return null;const e=localStorage.getItem('wk_env');return {...c,env:e==='prod'?'prod':'test'}}catch(e){return null}})();
let SAVED={},lastSync=null,syncErr=null,pulling=false,errToast=false;
const ckey=()=>'wk_cache_'+(CONN?CONN.env:'local');
const CFG_KEYS=[['ex','wk_ex'],['blocks','wk_block'],['cats','wk_cat'],['areas','wk_area'],['tags','wk_tag']];
function toRows(){const r={},put=(col,id,v)=>{r[col+'|'+id]=JSON.stringify(v)};
  const cfg=UI.edit?JSON.parse(UI.edit.orig):cfgOf();   // 편집 중에는 편집 시작 시점 내용(나갈 때 저장)
  (cfg.routines||[]).forEach((x,i)=>put('workout_routines',x.id,{...x,_o:i}));
  CFG_KEYS.forEach(([k,pre])=>(cfg[k]||[]).forEach((x,i)=>put('meta',pre+':'+x.id,{...x,_o:i})));
  put('meta','wk_body',cfg.body||{kg:''});
  D.logs.forEach(x=>put('workouts','log:'+x.id,x));(D.notes||[]).forEach(x=>put('workouts','note:'+x.id,x));(D.checks||[]).forEach(x=>put('workouts','check:'+x.id,x));
  put('workouts','session',{active:!!D.session,data:D.session||null});
  return r}
function fromRows(r,keepCfg){const g={};Object.entries(r).forEach(([k,str])=>{const i=k.indexOf('|');let v;try{v=JSON.parse(str)}catch(e){return}(g[k.slice(0,i)]=g[k.slice(0,i)]||[]).push([k.slice(i+1),v])});
  const ord=a=>a.sort((x,y)=>(x._o??0)-(y._o??0)).map(({_o,...x})=>x);
  if(!keepCfg){D.routines=ord((g.workout_routines||[]).map(([,v])=>v));const meta=g.meta||[];
    CFG_KEYS.forEach(([k,pre])=>{D[k]=ord(meta.filter(([id])=>id.startsWith(pre+':')).map(([,v])=>v))});
    const b=meta.find(([id])=>id==='wk_body');D.body=b?b[1]:{kg:''}}
  const w=g.workouts||[],pick=pre=>w.filter(([id])=>id.startsWith(pre)).map(([,v])=>v);
  D.logs=pick('log:');D.notes=pick('note:');D.checks=pick('check:');const ss=w.find(([id])=>id==='session');D.session=ss&&ss[1].active&&ss[1].data?ss[1].data:null}
function writeCache(rows){try{localStorage.setItem(ckey(),JSON.stringify({rows:rows||toRows(),saved:SAVED,lastSync}))}catch(e){}}
async function api(method,payload,ms=45000){if(!CONN)throw new Error('연결 안 됨');const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),ms);
  try{const body={token:CONN.token,env:CONN.env,...payload};
    const res=method==='GET'?await fetch(CONN.url+'?'+new URLSearchParams({...body,_t:Date.now()}),{signal:ctl.signal,cache:'no-store'}):await fetch(CONN.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:ctl.signal});
    const j=await res.json();if(!j.ok)throw new Error(j.error||'요청 실패');return j}finally{clearTimeout(tm)}}
const beginEdit=(root,id)=>{if(!UI.edit)UI.edit={root,id:id||null,orig:JSON.stringify(cfgOf())}};
function applyCfg(x){D.cats=x.cats||[];D.ex=x.ex||[];D.blocks=x.blocks||[];D.areas=x.areas||[];D.tags=x.tags||[];D.routines=x.routines||[];D.body=x.body||{kg:''}}
const editDirty=()=>!!UI.edit&&JSON.stringify(cfgOf())!==UI.edit.orig;
function endEdit(keep){if(!UI.edit)return;const E=UI.edit;UI.edit=null;if(!keep)applyCfg(JSON.parse(E.orig));save()}
function leave(go){if(editDirty()){UI.leaveTo=go;UI.sheet={kind:'leave'};return}endEdit(true);go()}
const cfgOf=()=>({cats:D.cats,ex:D.ex,blocks:D.blocks,areas:D.areas,tags:D.tags,routines:D.routines,body:D.body});
// 변경은 0.7초 모아서 한 번에 저장
function save(){dirty=true;clearTimeout(flushT);flushT=setTimeout(flush,700);return true}
async function flush(){
  if(flushing){clearTimeout(flushT);flushT=setTimeout(flush,400);return}
  flushing=true;dirty=false;
  try{
    if(MODE!=='db'){localStorage.setItem(LKEY,JSON.stringify(UI.edit?{...D,...JSON.parse(UI.edit.orig)}:D));return}
    const rows=toRows();writeCache(rows);const at=new Date().toISOString(),B={};
    Object.keys(rows).forEach(k=>{if(rows[k]!==SAVED[k]){const i=k.indexOf('|');(B[k.slice(0,i)]=B[k.slice(0,i)]||[]).push({k,id:k.slice(i+1),updatedAt:at,deleted:false,data:JSON.parse(rows[k])})}});
    Object.keys(SAVED).forEach(k=>{if(!(k in rows)){const i=k.indexOf('|');(B[k.slice(0,i)]=B[k.slice(0,i)]||[]).push({k,id:k.slice(i+1),updatedAt:at,deleted:true,data:{}})}});
    for(const col of Object.keys(B))for(let i=0;i<B[col].length;i+=200){const part=B[col].slice(i,i+200);
      await api('POST',{action:'upsert',col,records:part.map(({k,...x})=>x)});part.forEach(x=>{if(x.deleted)delete SAVED[x.k];else SAVED[x.k]=rows[x.k]})}
    syncErr=null;errToast=false;lastSync=at;writeCache(rows);
  }catch(e){
    dirty=true;syncErr=e;
    if(!errToast){errToast=true;toast(navigator.onLine===false?'오프라인이에요. 연결되면 자동으로 저장할게요.':'저장이 잠시 늦어지고 있어요. 자동으로 다시 시도합니다.')}
    clearTimeout(retryT);retryT=setTimeout(flush,15000);
  }finally{flushing=false}
}
async function pull(){
  if(MODE!=='db'||pulling||flushing||dirty)return;pulling=true;
  try{const j=await api('GET',{action:'listAll'}),rows=toRows(),editing=!!UI.edit;let ch=false;
    ['workout_routines','workouts','meta'].forEach(col=>((j.cols||{})[col]||[]).forEach(r=>{
      if(col==='meta'&&!String(r.id).startsWith('wk_'))return;if(editing&&col!=='workouts')return;
      const k=col+'|'+r.id,inL=k in rows;
      if(inL&&rows[k]!==SAVED[k])return;                       // 이 기기에서 아직 안 올린 변경 → 내 쪽 유지
      if(!inL&&SAVED[k]!==undefined&&!r.deleted)return;          // 이 기기에서 지운 뒤 아직 안 올림
      if(r.deleted){if(inL){delete rows[k];ch=true}delete SAVED[k];return}
      const str=JSON.stringify(r.data);if(rows[k]!==str){rows[k]=str;ch=true}SAVED[k]=str}));
    if(ch){fromRows(rows,editing);migrateBlocks()}
    syncErr=null;lastSync=new Date().toISOString();writeCache(rows);if(ch&&booted)rerender();
  }catch(e){syncErr=e}finally{pulling=false}
}
window.addEventListener('pagehide',()=>{if(dirty)flush()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(dirty)flush()}else pull()});
window.addEventListener('online',()=>{if(dirty)flush();pull()});
// 다른 기기에서 바뀐 내용이 들어오면 다시 그림(입력 중이면 입력이 끝난 뒤)
function rerender(){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.closest('#app')){pendingRender=true;return}render()}
document.addEventListener('focusout',()=>{if(!pendingRender)return;setTimeout(()=>{const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;pendingRender=false;render()},50)});
async function boot(){
  render();
  if(!CONN){MODE='local';try{const x=JSON.parse(localStorage.getItem(LKEY));if(x&&x.cats)D=Object.assign(EMPTY(),x);migrateBlocks()}catch(e){}booted=true;render();return}
  MODE='db';
  try{const c=JSON.parse(localStorage.getItem(ckey())||'null');if(c&&c.rows){fromRows(c.rows);SAVED=c.saved||{};lastSync=c.lastSync||null;migrateBlocks();booted=true;render()}else SAVED=toRows()}catch(e){SAVED=toRows()}
  await pull();
  if(!booted&&syncErr)toast('구글 시트에 연결하지 못했어요. 이 기기에 남은 내용으로 보여 드려요.');
  booted=true;if(migrateBlocks())save();render();
  setInterval(()=>{if(!document.hidden)pull()},120000);
}
const now=new Date();
const UI={view:'today',month:[now.getFullYear(),now.getMonth()],selDate:null,editR:null,editEx:null,sheet:null,cardLog:null,capture:false,
  open:{},pick:[],rOpen:{},rq:'',editB:null,q:'',cat:'all',addCat:false,catName:'',addQ:'',busy:''};
// 편집 중(루틴·묶음·종목)에는 저장소에 바로 쓰지 않고, 나갈 때 저장 여부를 물어봄
// 편집 시작 시점의 저장소 내용(base)을 기억. 편집 중 다른 기기에서 바뀌면(remote) 나갈 때 최신 내용 위에 '편집한 것만' 얹음
const getEx=(id,st=D)=>st.ex.find(e=>e.id===id)||{name:'(삭제된 종목)',levels:[{id:'x',name:'',kind:'sets',fields:['reps']}]};
const getLv=(ex,lid)=>ex.levels.find(l=>l.id===lid)||ex.levels[0];
const lvIdx=(ex,lid)=>Math.max(0,ex.levels.findIndex(l=>l.id===lid));
const getR=id=>D.routines.find(r=>r.id===id);
const catName=id=>(D.cats.find(c=>c.id===id)||{name:'미분류'}).name;

function toEntry(it,st=D){
  if(it.blockId){const b=getBlock(it.blockId)||{name:'(삭제된 묶음)',items:[],tag:'none'};
    return {uid:it.uid,kind:'block',blockId:it.blockId,name:b.name,tag:b.tag||'none',parts:b.items.map(p=>({pid:p.id,name:p.name,areas:[...(p.areas||[])],unit:p.unit||'sec',sec:+p.sec||0,reps:+p.reps||0,done:false,
      ...(p.lr?{sides:(b.lrFirst==='R'?['R','L']:['L','R']).map(x=>({s:x,v:rVal(p,x),done:false}))}:{})})),bt:null}}
  const ex=getEx(it.exId,st),lv=getLv(ex,it.levelId);
  const base={uid:it.uid,exId:it.exId,levelId:lv.id,name:ex.name,levelName:ex.levels.length>1?`${lvIdx(ex,lv.id)+1}단계 · ${lv.name}`:'',fields:[...lv.fields],wunit:lv.wunit||'kg'};
  if(it.mode==='interval')return {...base,mode:'interval',iv:{...it.iv},run:null,done:false};
  const n=it.sets||1;
  return {...base,target:{sets:n,vals:{...(it.vals||{})}},sets:Array.from({length:n},()=>({vals:{...(it.vals||{})},done:false}))};
}



/* ===== 표시용 요약 ===== */
// 무게 단위: 종목(단계)마다 kg 또는 lb. lb는 kg으로 자동 환산해 실부하·볼륨 계산
const isW=f=>f==='kg'||f==='assist';
// 버티기 전 준비시간(종목별, 기본 5초)
const prepOf=ex=>ex.prep??5;
const unitOf=(f,wu)=>isW(f)&&wu==='lb'?'lb':(FIELDS[f]?FIELDS[f][1]:'');
const toKg=(v,wu)=>wu==='lb'?Math.round((+v||0)*0.45359237*10)/10:(+v||0);
const fv=(f,v,wu)=>v===''||v==null?'':`${FIELDS[f]?FIELDS[f][3]:''}${v}${unitOf(f,wu)}`;
const vals=(fields,o)=>fields.map(f=>fv(f,o&&o[f])).filter(Boolean).join(' · ')||'값 없음';
const ivTotal=iv=>(+iv.warm||0)+((+iv.work||0)+(+iv.rest||0))*(+iv.sets||0)+(+iv.cool||0);
const fmtMin=m=>{const s=Math.round((+m||0)*60);return s%60?`${Math.floor(s/60)}분 ${s%60}초`:`${s/60}분`};
const ivDesc=iv=>`인터벌 ${iv.work}분/${iv.rest}분 × ${iv.sets}세트 · 총 ${fmtMin(ivTotal(iv))}`;
// 설정 화면용: 총 시간과 계산식, 지금 시작하면 끝나는 시각
function ivBreak(iv){const w=+iv.warm||0,a=+iv.work||0,b=+iv.rest||0,n=+iv.sets||0,c=+iv.cool||0;const tot=ivTotal(iv);
  const parts=[w?`워밍업 ${fmtMin(w)}`:'',n?`(빠르게 ${fmtMin(a)} + 느리게 ${fmtMin(b)}) × ${n}세트 = ${fmtMin((a+b)*n)}`:'',c?`쿨다운 ${fmtMin(c)}`:''].filter(Boolean);
  const end=new Date(Date.now()+tot*60000);
  return `<strong>총 ${fmtMin(tot)}</strong>`}
// 세트 묶기: 같은 무게끼리, 같은 횟수끼리 묶어서 "40kg · 12회 × 3세트" 또는 "40kg · 12회×2, 10회×1 (총 3세트)"
// 보조 무게: 실부하 = 체중 − 보조
const realLoad=(bw,a,wu)=>Math.round(((+bw||0)-toKg(a,wu))*10)/10;
function loadLabel(f,v,bw,wu){const s=fv(f,v,wu);if(!s)return s;
  if(f==='assist'&&bw)return `${s}(실 ${realLoad(bw,v,wu)}kg)`;
  if(f==='kg'&&wu==='lb')return `${s}(${toKg(v,wu)}kg)`;return s}
function groupSets(fields,list,bw,wu){
  if(!list.length)return '미완료';
  const p=fields.find(f=>PRIMARY.includes(f))||fields[0];const loads=fields.filter(f=>f!==p);
  const groups=[];
  list.forEach(v=>{const lk=loads.map(f=>loadLabel(f,v[f],bw,wu)).filter(Boolean).join(' · ');
    let g=groups.find(x=>x.lk===lk);if(!g)groups.push(g={lk,c:[]});
    let c=g.c.find(x=>x.v===v[p]);if(!c)g.c.push(c={v:v[p],n:0});c.n++;});
  if(groups.length===1&&groups[0].c.length===1){const g=groups[0],c=g.c[0];return `${g.lk?g.lk+' · ':''}${fv(p,c.v)}${c.n>1?` × ${c.n}세트`:''}`}
  return groups.map(g=>`${g.lk?g.lk+' · ':''}${g.c.map(c=>`${fv(p,c.v)}×${c.n}`).join(', ')}`).join(' / ')+` (총 ${list.length}세트)`;
}
/* ===== 묶음(워밍업·스트레칭·폼롤러): 이름+시간 항목 묶음, 루틴엔 한 줄로 ===== */
const TAGS={warmup:['워밍업','tag-w'],none:['위치 직접',''],cooldown:['정리운동','tag-c']};
// 묶음 항목마다 고유 번호(이름을 바꿔도 기록이 이어지도록)와 단위(초/회)
const AREA_DEFAULT=['목','어깨','가슴','등','허리','팔','손목','엉덩이','고관절','허벅지 앞','햄스트링','허벅지 안쪽','IT밴드','종아리','정강이','발목','발바닥'];
const areaName=id=>((D.areas||[]).find(a=>a.id===id)||{}).name||'';
function areaIdFor(name){name=String(name||'').trim();if(!name)return null;D.areas=D.areas||[];let a=D.areas.find(x=>x.name===name);if(!a){a={id:uid(),name};D.areas.push(a)}else if(a.hidden)delete a.hidden;return a.id}
function migrateBlocks(){let ch=false;
  if(!D.areas||!D.areas.length){D.areas=AREA_DEFAULT.map(n=>({id:uid(),name:n}));ch=true}
  if(!D.tags||!D.tags.length){D.tags=[{id:uid(),name:'재활PT',metrics:[]}];ch=true}

function phases(iv){const a=[];
  if(+iv.warm)a.push({n:'워밍업',s:iv.warm*60,t:'warm'});
  for(let k=1;k<=+iv.sets;k++){a.push({n:'빠르게',s:iv.work*60,t:'work',k,note:iv.workNote});if(+iv.rest)a.push({n:'느리게',s:iv.rest*60,t:'rest',k,note:iv.restNote})}
  if(+iv.cool)a.push({n:'쿨다운',s:iv.cool*60,t:'cool'});return a}
function ivState(e){
  const ph=phases(e.iv),r=e.run;const el=((r.pausedAt||Date.now())-r.start-r.paused)/1000;
  let acc=0;const total=ph.reduce((a,p)=>a+p.s,0);
  for(let i=0;i<ph.length;i++){if(el<acc+ph[i].s)return {i,p:ph[i],left:acc+ph[i].s-el,next:ph[i+1],total,el,sets:+e.iv.sets};acc+=ph[i].s}
  return {done:true,total,el};
}
let ac;function beep(f=880,d=.15,delay=0){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+delay;o.frequency.value=f;o.type='sine';
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.5,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function phaseSound(t){try{navigator.vibrate&&navigator.vibrate(t==='work'?[200,80,200]:300)}catch(e){}
  if(t==='work'){beep(1320,.18);beep(1320,.18,.25);beep(1320,.35,.5)}else if(t==='rest'){beep(660,.6)}else if(t==='end'){beep(990,.2);beep(1180,.2,.25);beep(1480,.5,.5)}else beep(880,.4)}
let wake=null;async function keepAwake(on){try{if(on&&!wake&&navigator.wakeLock)wake=await navigator.wakeLock.request('screen');if(!on&&wake){wake.release();wake=null}}catch(e){}}
const tickMem={};let lastBarH=60,lastSheet=null;
function tick(){
  const s=D.session;if(!s)return;
  const el=document.getElementById('sb-time');if(el)el.textContent=mmss((Date.now()-s.start)/1000);
  let mini='';
  const setTxt=(id,v)=>{const x=document.getElementById(id);if(x)x.textContent=v};
  // 묶음 부위 타이머: 누를 때만 시작, 끝나면 그 부위 자동 체크(다음 부위는 자동으로 안 넘어감)
  s.items.forEach((e,i)=>{const t=e.bt;if(!t)return;const left=t.work-(Date.now()-t.start)/1000;const p=e.parts[t.k];
    const lab=p?p.name+(t.j>=0&&p.sides?' '+SIDE[p.sides[t.j].s]:''):'';
    if(left<=0){if(p){if(t.j>=0&&p.sides){p.sides[t.j].done=true;syncDone(p)}else p.done=true}e.bt=null;phaseSound('end');keepAwake(false);save();render();
      const nx=nextStep(e);toast(nx?`${lab} 끝. 자세 잡고 ${e.parts[nx.k].name}${nx.j>=0?' '+SIDE[e.parts[nx.k].sides[nx.j].s]:''} 시작을 누르세요`:`${e.name} 완료`);return}
    const m=tickMem['b'+i]||(tickMem['b'+i]={sec:-1});const sc=Math.ceil(left);if(sc!==m.sec&&sc<=3&&sc>=1)beep(880,.12);m.sec=sc;
    setTxt(`bt-left-${i}`,mmss(left));const b=document.getElementById(`bt-bar-${i}`);if(b)b.style.width=((1-left/t.work)*100)+'%';
    mini=`${e.name} · ${lab} ${mmss(left)}`;
  });
  // 세트별 버티기 타이머: 준비 n초 → (예고음) → 본운동 n초 → 종료음
  s.items.forEach((e,i)=>{const h=e.ht;if(!h||h.finished)return;
    const el=(Date.now()-h.start)/1000,tot=h.prep+h.work;let ph,left;
    if(el<h.prep){ph='prep';left=h.prep-el}else if(el<tot){ph='work';left=tot-el}
    else{h.finished=true;phaseSound('end');keepAwake(false);save();render();toast(`${h.j+1}세트 끝! 체크해 주세요`);return}
    const m=tickMem['h'+i]||(tickMem['h'+i]={ph:'',sec:-1});
    if(m.ph!==ph){if(ph==='work'&&m.ph)phaseSound('work');m.ph=ph}
    const sec=Math.ceil(left);if(sec!==m.sec&&sec<=3&&sec>=1)beep(880,.12);m.sec=sec;
    setTxt(`ht-ph-${i}`,ph==='prep'?'준비':'버티기');setTxt(`ht-left-${i}`,mmss(left));
    setTxt(`ht-nx-${i}`,ph==='prep'?`곧 ${h.work}초 본운동 시작`:`${h.j+1}세트 진행 중`);
    const b=document.getElementById(`ht-bar-${i}`);if(b)b.style.width=(el/tot*100)+'%';
    const box=document.getElementById(`ht-box-${i}`);if(box)box.className='timer '+(ph==='prep'?'rest':'work');
    mini=`${e.name} ${h.j+1}세트 · ${ph==='prep'?'준비':'버티기'} ${mmss(left)}`;
  });
  s.items.forEach((e,i)=>{if(e.mode!=='interval'||!e.run)return;const st=ivState(e);
    if(st.done){if(!e.done){e.done=true;e.run.finished=true;phaseSound('end');keepAwake(false);save();render();toast(`${e.name} 인터벌 완료`)}return}
    const m=tickMem[i]||(tickMem[i]={idx:-1,sec:-1});
    if(m.idx!==st.i){if(m.idx!==-1)phaseSound(st.p.t);m.idx=st.i}
    const sec=Math.ceil(st.left);if(sec!==m.sec&&sec<=3&&sec>=1&&!e.run.pausedAt){beep(880,.12)}m.sec=sec;
    const set=(id,v)=>{const x=document.getElementById(id);if(x)x.textContent=v};
    set(`iv-ph-${i}`,st.p.n+(st.p.k?` ${st.p.k}/${st.sets}`:''));set(`iv-left-${i}`,mmss(st.left));
    set(`iv-note-${i}`,st.p.note||'');set(`iv-next-${i}`,st.next?`다음: ${st.next.n}${st.next.note?' · '+st.next.note:''}`:'마지막 구간');
    const b=document.getElementById(`iv-bar-${i}`);if(b)b.style.width=(st.el/st.total*100)+'%';
    const box=document.getElementById(`iv-box-${i}`);if(box)box.className='timer '+st.p.t;
    mini=`${e.name} · ${st.p.n}${st.p.k?` ${st.p.k}/${st.sets}`:''} · ${mmss(st.left)}${e.run.pausedAt?' (일시정지)':''}`;
  });
  const sm=document.getElementById('sb-iv');if(sm){sm.textContent=mini;sm.hidden=!mini}
  const bar=document.querySelector('.sbar'),sp=document.getElementById('sb-space');if(bar&&sp){lastBarH=bar.offsetHeight;sp.style.height=lastBarH+'px'}
}

/* ===== 부위별 꾸준함: 오늘 기준 최근 28일 ===== */
function areaStats(){
  const t0=new Date(ymd(new Date())+'T00:00');const dd=d=>Math.round((t0-new Date(d+'T00:00'))/864e5);
  const cur={};(D.blocks||[]).forEach(b=>(b.items||[]).forEach(p=>{if(p.id)cur[p.id]=p}));
  // 지금 설정된 부위·이름을 우선(이름을 바꿔도 같은 항목으로 집계), 부위가 없으면 동작 이름
  const keysOf=pt=>{const c=pt.pid&&cur[pt.pid];const ids=(c&&c.areas&&c.areas.length?c.areas:pt.areas)||[];
    const ns=ids.map(areaName).filter(Boolean);if(ns.length)return ns;if(pt.area&&!c)return [pt.area];const n=((c&&c.name)||pt.name||'').trim();return n?[n]:[]};
  const M={};const get=k=>M[k]=M[k]||{days:new Set(),last:null};
  Object.values(cur).forEach(p=>keysOf({pid:p.id}).forEach(get));
  D.logs.forEach(l=>{const d=dd(l.date);if(d<0)return;l.items.forEach(e=>{if(e.kind!=='block')return;e.parts.forEach(pt=>{if(pt.done===false)return;keysOf(pt).forEach(k=>{
    const m=get(k);if(d<28)m.days.add(d);if(m.last==null||d<m.last)m.last=d})})})});
  return Object.entries(M).map(([k,m])=>({k,days:m.days,last:m.last})).sort((a,b)=>(b.last??1e9)-(a.last??1e9)||a.k.localeCompare(b.k));
}
const agoLabel=n=>n==null?'기록 없음':n===0?'오늘':n===1?'어제':`${n}일 전`;
function areaCard(){
  const st=areaStats();if(!st.length)return '';
  return `<div class="card"><div class="row between"><h2>부위별 꾸준함</h2><span class="sub">오늘 기준 최근 4주</span></div>
   <p class="sub">한 줄이 7일, 오른쪽 아래 칸이 오늘입니다. 7일 넘게 안 한 부위는 빨갛게 표시돼요.</p>
   <div>${st.map(a=>`<div class="arow"><div><strong>${esc(a.k)}</strong><div class="sub num ${a.last!=null&&a.last>=7?'warn':''}">${a.days.size}회 · ${agoLabel(a.last)}${a.last!=null&&a.last>=7?' ⚠':''}</div></div>
     <div class="heat" aria-label="${esc(a.k)} 최근 4주 ${a.days.size}일">${Array.from({length:28},(_,c)=>{const d=27-c;return `<i class="${a.days.has(d)?'on':''} ${d===0?'td':''}"></i>`}).join('')}</div></div>`).join('')}</div></div>`;
}
function staleCard(){
  const st=areaStats().filter(a=>a.last!=null&&a.last>=7);if(!st.length)return '';
  return `<div class="card"><h2>7일 넘게 안 한 부위</h2><div class="chips">${st.map(a=>`<span class="chip">${esc(a.k)} · ${a.last}일</span>`).join('')}</div>

function sessionProgress(s){let tot=0,done=0;
  s.items.forEach(e=>{if(e.parts){tot+=e.parts.length;done+=e.parts.filter(p=>p.done).length;return}if(e.sets){tot+=e.sets.length;done+=e.sets.filter(x=>x.done).length}else{tot++;done+=e.done?1:0}});return [done,tot]}

    <div class="field"><label for="sdur">운동 시간 (분, 모르면 비워 두기)</label><input class="inp n" id="sdur" inputmode="numeric" value="${s.dur??''}" data-in="sdur"></div></div></div>`:''}
  ${(()=>{const keys=[...new Set(s.items.map(e=>secKey(e,s)))];const multi=keys.length>1;const prog={};
    s.items.forEach(e=>{const k=secKey(e,s),[d,t]=entryProg(e);prog[k]=prog[k]||[0,0];prog[k][0]+=d;prog[k][1]+=t});
    UI.sec=UI.sec||{};let out='',cur=null,closed=false;

      if(multi&&k!==cur){cur=k;const [d,t]=prog[k],full=t&&d===t;closed=UI.sec[k]==='closed'||(UI.sec[k]!=='open'&&full);const r=getR(k);
        const nm=k==='_warm'?'워밍업':k==='_cool'?'정리운동':k==='_extra'?'추가한 종목':k==='_blk'?'묶음':(r?r.name:'');
        out+=`<button class="sec-head" data-a="secTog" data-k="${esc(k)}" data-c="${closed?1:0}" aria-expanded="${!closed}"><span>${closed?'▸':'▾'}</span><span class="swatch" style="background:${r?r.color:'#7A8494'}"></span>${esc(nm)} <span class="sub num">${d}/${t}${full?' · 완료':''}</span></button>`}
      if(multi&&closed)return;
      out+=e.kind==='block'?blockCard(e,i):e.mode==='interval'?intervalCard(e,i):setsCard(e,i)});return out})()}
  <div class="grid two"><button class="btn" data-a="appendSheet">+ 루틴 이어 붙이기</button><button class="btn" data-a="sessAddSheet">+ 종목 추가</button></div>

    <textarea id="memo" class="inp" data-in="memo" placeholder="컨디션, 자극 부위 등">${esc(s.memo||'')}</textarea></div>
  <div class="sticky-foot"><button class="btn primary block" data-a="finish">${s.editLogId?'수정 내용 저장':s.past?'이 날짜에 기록 저장':'운동 완료하고 저장'}</button></div>
  <button class="btn ghost" data-a="askCancel">${s.editLogId?'수정 취소':s.past?'입력 취소':'운동 중단'}</button>`;

function nextStep(e){for(let k=0;k<e.parts.length;k++){const p=e.parts[k];if(p.done)continue;if(p.sides){const j=p.sides.findIndex(x=>!x.done);if(j>=0)return {k,j}}return {k,j:-1}}return null}
const syncDone=p=>{if(p.sides)p.done=p.sides.every(x=>x.done)};
function blockCard(e,i){
  const done=e.parts.filter(p=>p.done).length,all=e.parts.length&&done===e.parts.length,open=!!UI.open[e.uid],bt=e.bt;
  const nx=nextStep(e);
  let body='';
  if(bt){const p=e.parts[bt.k];body=`<div class="timer work" id="bt-box-${i}"><div class="ph">${esc(p.name)}${bt.j>=0?' · '+SIDE[p.sides[bt.j].s]:''}</div><div class="left" id="bt-left-${i}">${mmss(bt.work)}</div>
    <div class="progress"><i id="bt-bar-${i}"></i></div><div class="nx">${bt.k+1}/${e.parts.length} · 끝나면 자동 체크</div></div>

      :`<button class="btn primary block" data-a="bStart" data-i="${i}" data-k="${nx.k}" data-j="${nx.j}" ${v?'':'disabled'}>▶ ${lab} ${v}초 시작</button>`}

    <span class="nm">${esc(p.name)}${tagBadges((partItem(p.pid)||{}).tags)}${(p.areas||[]).length?` <span class="sub">· ${esc(p.areas.map(areaName).filter(Boolean).join(', '))}</span>`:''}

    ${p.unit==='reps'||D.session.past?'<span></span>':`<button class="btn small soft" data-a="bStart" data-i="${i}" data-k="${k}" data-j="${p.sides?(nj<0?0:nj):-1}" ${!bt&&(p.sides?true:p.sec)?'':'disabled'} aria-label="${esc(p.name)} 타이머">▶</button>`}</div>`}).join('');
  return `<div class="card ${all?'done':''}"><div class="row between">

function homework(tid){
  const t0=new Date(ymd(new Date())+'T00:00');const dd=d=>Math.round((t0-new Date(d+'T00:00'))/864e5);
  const items=[];
  D.ex.filter(e=>(e.tags||[]).includes(tid)).forEach(e=>items.push({key:'ex:'+e.id,name:e.name,sub:'종목',hit:en=>en.exId===e.id&&en.kind!=='block'}));
  const seen=new Set();(D.blocks||[]).forEach(b=>b.items.forEach(p=>{if((p.tags||[]).includes(tid)&&!seen.has(p.id)){seen.add(p.id);
    items.push({key:'bp:'+p.id,name:p.name||'(이름 없음)',sub:b.name,hit:en=>en.parts&&en.parts.some(pt=>pt.pid===p.id&&pt.done!==false)})}}));
  return items.map(it=>{const days=new Set();let last=null;D.logs.forEach(l=>{const d=dd(l.date);if(d<0)return;if(l.items.some(it.hit)){if(d<28)days.add(d);if(last==null||d<last)last=d}});

function poseInit(){const p=UI.pose;const c=document.getElementById('posec');if(!c)return;
  loadImg(p.src,im=>{POSE.img=im;POSE.c=c;const ar=im.naturalWidth/im.naturalHeight;p.ar=ar;const maxW=Math.min(innerWidth-32,720),maxH=Math.max(260,innerHeight-340);const cw=Math.min(maxW,maxH*ar),ch=cw/ar,dpr=Math.min(window.devicePixelRatio||1,2);
    c.style.width=cw+'px';c.style.height=ch+'px';c.width=Math.round(cw*dpr);c.height=Math.round(ch*dpr);poseDraw(false);poseText()})}
const poseXY=(e,c)=>{const r=c.getBoundingClientRect();return {x:Math.min(Math.max((e.clientX-r.left)*c.width/r.width,0),c.width),y:Math.min(Math.max((e.clientY-r.top)*c.height/r.height,0),c.height)}};
function poseSet(k,pt){const c=POSE.c;UI.pose.pts[k]={x:pt.x/c.width,y:pt.y/c.height};POSE.at=pt;poseDraw(true)}
document.addEventListener('pointerdown',e=>{if(e.target.id!=='posec'||!UI.pose||!POSE.img)return;e.preventDefault();const c=e.target;POSE.c=c;const pt=poseXY(e,c),u=c.width/360;
  let k=null,best=26*u;KEYS.forEach(q=>{const p=UI.pose.pts[q];if(p){const d=Math.hypot(p.x*c.width-pt.x,p.y*c.height-pt.y);if(d<best){best=d;k=q}}});
  if(!k)k=KEYS.find(q=>!UI.pose.pts[q]);if(!k)return;POSE.drag=k;try{c.setPointerCapture(e.pointerId)}catch(_){}poseSet(k,pt)});
document.addEventListener('pointermove',e=>{if(!POSE.drag||!POSE.c)return;e.preventDefault();poseSet(POSE.drag,poseXY(e,POSE.c))});
const poseEnd=()=>{if(!POSE.drag)return;POSE.drag=null;POSE.at=null;poseDraw(false);poseText()};
document.addEventListener('pointerup',poseEnd);document.addEventListener('pointercancel',poseEnd);
async function poseStart(file){toast('사진 준비 중…');try{

  else{const u=await shrink(file,900,'url');UI.pose={id:null,date:ymd(new Date()),url:u,src:u,pts:{},mirror:true,ar:null}}
  render();scrollTo(0,0)}catch(e){toast(photoErr(e))}}

// CSV: 세트 1개 = 1줄. 무게는 원래 단위와 kg 환산값을 함께
function exportCsv(){
  const cols=['날짜','루틴','종목','단계','세트','횟수','무게','무게단위','무게(kg)','보조','보조(kg)','실부하(kg)','체중(kg)','초','분','속도(km/h)','경사도(%)','강도','RPM','거리(km)','칼로리','심박','운동시간(분)','메모'];
  const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[cols];
  [...D.logs].sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>l.items.forEach(e=>{
    const lv=e.levelName?e.levelName:'';
    if(e.kind==='block'){let k=0;e.parts.forEach(pt=>(pt.sides?pt.sides.filter(x=>x.done).map(x=>({nm:`${pt.name} (${SIDE[x.s]})`,v:x.v})):[{nm:pt.name,v:pt.unit==='reps'?pt.reps:pt.sec}]).forEach(r=>rows.push([l.date,l.name,e.name,r.nm,++k,pt.unit==='reps'?r.v:'','','','','','','',l.bw,pt.unit==='reps'?'':r.v,'','','','','','','','','',(pt.areas||[]).length?'부위: '+pt.areas.map(areaName).filter(Boolean).join(', '):''])));return}
    if(e.mode==='interval'){rows.push([l.date,l.name,e.name,lv,'인터벌','','','','','','','',l.bw,'',ivTotal(e.iv),'','','','','','','',l.dur,ivDesc(e.iv)]);return}
    (e.sets||[]).filter(s=>s.done).forEach((s,k)=>{const v=s.vals,wu=e.wunit||'kg';
      rows.push([l.date,l.name,e.name,lv,k+1,v.reps,v.kg,v.kg!=null&&v.kg!==''?wu:(v.assist!=null&&v.assist!==''?wu:''),v.kg!=null&&v.kg!==''?toKg(v.kg,wu):'',
        v.assist,v.assist!=null&&v.assist!==''?toKg(v.assist,wu):'',v.assist!=null&&v.assist!==''&&l.bw?realLoad(l.bw,v.assist,wu):'',l.bw,
        v.sec,v.min,v.speed,v.incline,v.level,v.rpm,v.dist,v.kcal,v.hr,k===0?l.dur:'',k===0?l.memo:''])});
  }));
  return '﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n');
}
async function exportPhotos(){
  const ls=D.logs.filter(l=>l.photo).sort((a,b)=>a.date.localeCompare(b.date));
  if(!ls.length){toast('저장된 오운완 사진이 없어요');return}
  if(!window.JSZip){toast('압축 도구를 불러오지 못했어요. 새로고침 후 다시 시도해 주세요.');return}
  const zip=new JSZip();const seen={};let n=0;
  for(const l of ls){UI.busy=`사진 모으는 중… ${++n}/${ls.length}`;render();
    try{let src=photoSrc(l.photo);if(src===PH_WAIT){src=await pdb.get(l.photo);if(!src)continue}const r=await fetch(src);if(!r.ok)continue;const b=await r.blob();
      let name=`${l.date}_${l.name.replace(/[\\/:*?"<>|]/g,'')}`;seen[name]=(seen[name]||0)+1;if(seen[name]>1)name+=`_${seen[name]}`;zip.file(name+'.jpg',b)}catch(e){}}
  UI.busy='압축하는 중…';render();
  const blob=await zip.generateAsync({type:'blob'});UI.busy='';render();
  await saveFile(`오운완사진_${stamp()}.zip`,blob);
}
function askImport(text){
  let o;try{o=JSON.parse(text)}catch(e){toast('JSON 파일을 읽을 수 없어요.');return}
  if(!o||!['cats','ex','routines','logs'].every(k=>Array.isArray(o[k]))){toast('이 앱에서 내보낸 JSON 파일이 아니에요.');return}
  UI.pendingImport=o;UI.sheet={kind:'confirm',text:`불러온 파일(기록 ${o.logs.length}개)로 지금 데이터를 바꿀까요? 지금 기록 ${D.logs.length}개는 이 파일 내용으로 대체됩니다.`,ok:'importOk',okLabel:'바꾸기'};render();
}

// match: 'level' = 같은 종목·같은 단계만, 'ex' = 같은 종목 전체(단계 변경 시)
function openProp(exId,levelId,match,patch,fromRid){
  const others=D.routines.filter(r=>r.id!==fromRid&&r.items.some(i=>i.exId===exId&&(match==='ex'||i.levelId===levelId)));

document.addEventListener('pointerdown',e=>{const g=e.target.closest('.grab');if(!g)return;const row=g.closest('.ritem');if(!row||row.classList.contains('fixed'))return;
  const list=row.parentElement;e.preventDefault();row.classList.add('dragging');try{g.setPointerCapture(e.pointerId)}catch(x){}
  const move=ev=>{const y=ev.clientY;let before=null;for(const r of list.querySelectorAll('.ritem:not(.dragging)')){const b=r.getBoundingClientRect();if(y<b.top+b.height/2){before=r;break}}
    if(before!==row.nextElementSibling)list.insertBefore(row,before)};
  const up=()=>{row.classList.remove('dragging');g.removeEventListener('pointermove',move);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);
    if(UI.sheet&&UI.sheet.kind==='reorder'){UI.sheet.order=[...list.querySelectorAll('.ritem')].map(r=>r.dataset.k);render()}};
  g.addEventListener('pointermove',move);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up);
});
document.addEventListener('click',e=>{
  if(e.target.closest('label'))return;
  const t=e.target.closest('[data-a]');if(!t||t.disabled)return;
  const f=A[t.dataset.a];if(!f)return;
  if(f({...t.dataset})===false)return;render();
});
document.addEventListener('input',e=>{
  const t=e.target,b=t.dataset.in;if(!b)return;const p=b.split(':'),v=t.value;
  if(p[0]==='set')D.session.items[p[1]].sets[p[2]].vals[p[3]]=num(v);
  else if(p[0]==='cv')D.session.items[p[1]].vals[p[2]]=num(v);
  else if(p[0]==='memo')D.session.memo=v;
  else if(p[0]==='sbw')D.session.bw=num(v);
  else if(p[0]==='sdur')D.session.dur=num(v);
  else if(p[0]==='sdate'){if(v&&v<=ymd(new Date()))D.session.date=v;else return}
  else if(p[0]==='exprep')getEx(p[1]||UI.editEx).prep=num(v);
  else if(p[0]==='bw')D.body.kg=num(v);
  else if(p[0]==='rname')getR(UI.editR).name=v;
  else if(p[0]==='rv'){const it=getR(UI.editR).items[p[1]];(it.vals=it.vals||{})[p[2]]=num(v)}
  else if(p[0]==='iv'){const it=getR(UI.editR).items[p[1]];it.iv[p[2]]=/Note$/.test(p[2])?v:num(v);const el=document.getElementById('ivtot-'+p[1]);if(el)el.innerHTML=ivBreak(it.iv)}
  else if(p[0]==='bname')getBlock(UI.editB).name=v;
  else if(p[0]==='bpn')getBlock(UI.editB).items[p[1]].name=v;
  else if(p[0]==='newarea'){UI.newArea=v;return}
  else if(p[0]==='bpv'){const it=getBlock(UI.editB).items[p[1]];it[it.unit==='reps'?'reps':'sec']=num(v)}
  else if(p[0]==='bpvr'){const it=getBlock(UI.editB).items[p[1]];it[it.unit==='reps'?'repsR':'secR']=num(v)}
  else if(p[0]==='exname')getEx(UI.editEx).name=v;
  else if(p[0]==='lvname')getEx(UI.editEx).levels[p[1]].name=v;
  else if(p[0]==='sv'){if(p[1]==='sets')UI.sheet.sets=v;else UI.sheet.vals[p[1]]=v;return}
  else if(p[0]==='catname'){UI.catName=v;return}
  else if(p[0]==='newtag'){UI.newTag=v;return}
  else if(p[0]==='newm'){UI.newMetric=v;return}
  else if(p[0]==='tagname'){const t=D.tags.find(x=>x.id===p[1]);if(t&&v.trim())t.name=v.trim()}
  else if(p[0]==='mname'){const m=(curTag().metrics||[]).find(x=>x.id===p[1]);if(m)m.name=v}
  else if(p[0]==='ckdate'){if(v&&v<=ymd(new Date()))UI.ck.date=v;return}
  else if(p[0]==='ckv'){const x=ckTgt(p[1],p[2]);x.v=v===''?'':Math.max(0,Math.min(10,+v||0));return}
  else if(p[0]==='pdate'){if(v&&v<=ymd(new Date()))UI.pose.date=v;return}
  else if(p[0]==='ckmemo'){UI.ck.memo=v;return}
  else if(p[0]==='ndate'){if(v&&v<=ymd(new Date()))UI.noteDraft.date=v;return}
  else if(p[0]==='ntext'){UI.noteDraft.text=v;return}
  else if(p[0]==='npt'){const key=p[1]+':'+p[2];const d=UI.noteDraft;d.pts=d.pts||{};(d.pts[key]=d.pts[key]||{n:'',t:''}).t=v;return}
  else if(p[0]==='sname'){const sc=(curTag().scales||[]).find(x=>x.id===p[1]);if(sc)sc.name=v}
  else if(p[0]==='slv'){const sc=(curTag().scales||[]).find(x=>x.id===p[1]);if(sc)sc.levels[+p[2]]=v}
  else if(p[0]==='newsc'){UI.newSc=v;return}
  else if(p[0]==='rq'){UI.rq=v;const el=document.getElementById('rlistToday');if(el)el.innerHTML=todayList();return}
  else if(p[0]==='q'){UI.q=v;document.getElementById('exlist').innerHTML=exListHTML(UI.q,UI.cat,'editEx');return}
  else if(p[0]==='addq'){UI.addQ=v;document.getElementById('addlist').innerHTML=exListHTML(UI.addQ,'all',UI.addAct||'addItem');return}
  save();
});

  if(t.dataset.pose!==undefined&&t.files&&t.files[0]){const f=t.files[0];t.value='';poseStart(f);return}
  if(t.dataset.photo&&t.files&&t.files[0]){const l=D.logs.find(x=>x.id===t.dataset.photo);if(!l)return;const f=t.files[0];t.value='';
    toast('사진 저장 중…');
    storePhoto(f).then(p=>{const old=l.photo;l.photo=p;save();render();toast('오운완 사진을 기록에 붙였어요');dropPhoto(old,p)}).catch(e=>toast(photoErr(e)));return}
  if(t.dataset.wkenv!==undefined){const v=t.value==='prod'?'prod':'test';(async()=>{
    if(dirty)await flush();
    if(v==='prod'&&CONN.env==='test'){ // 테스트 → 실사용: 실사용에 운동 기록이 없으면 테스트 기록을 그대로 옮김
      toast('테스트 기록을 실사용 시트로 옮기는 중…');
      try{const mine=(cols,col)=>((cols||{})[col]||[]).filter(r=>!r.deleted&&(col!=='meta'||String(r.id).startsWith('wk_')));
        const [T,P]=await Promise.all([api('GET',{action:'listAll',env:'test'}),api('GET',{action:'listAll',env:'prod'})]);
        const C=['workout_routines','workouts','meta'],has=C.some(c=>mine(P.cols,c).some(r=>!(c==='workouts'&&r.id==='session')));
        if(has)toast('실사용 시트에 이미 운동 기록이 있어 옮기지 않고 실사용으로 바꿨어요.');
        else{const at=new Date().toISOString();for(const c of C){const rs=mine(T.cols,c).map(r=>({id:r.id,updatedAt:at,deleted:false,data:r.data}));for(let i=0;i<rs.length;i+=200)await api('POST',{action:'upsert',col:c,records:rs.slice(i,i+200),env:'prod'})}
          try{localStorage.removeItem('wk_cache_prod')}catch(e){}toast('테스트 기록을 실사용으로 옮겼어요.')}
      }catch(e){toast('옮기지 못했어요. 연결을 확인하고 다시 시도해 주세요.');render();return}
      await new Promise(r=>setTimeout(r,1200))}
    try{localStorage.setItem('wk_env',v)}catch(e){}location.reload()})();return}
  if(t.dataset.importfile&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=()=>askImport(fr.result);fr.readAsText(t.files[0]);t.value='';return}
  if(t.dataset.bulk&&t.files&&t.files.length){bulkPhotos([...t.files]);}
});
// 사진: 긴 변 1600px JPEG로 줄여서 저장(클로드 저장소면 파일로, 이 기기 모드면 브라우저에)
function shrink(file,M,as){return new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=no;fr.onload=()=>{const img=new Image();img.onerror=()=>no({code:'decode'});img.onload=()=>{
  const sc=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');
  c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  if(as==='url')ok(c.toDataURL('image/jpeg',.78));else c.toBlob(b=>b?ok(b):no({code:'decode'}),'image/jpeg',.85)};img.src=fr.result};fr.readAsDataURL(file)})}
/* 사진 보관: 오운완 사진은 기념용이라 이 기기에만(dev_), 몸 상태 정렬 사진은 드라이브 '사진' 폴더(g_) */
const PH={},phLoading=new Set();
const PH_WAIT='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><rect width="10" height="10" fill="#e3e6eb"/></svg>');
const pdb=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('wk-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=async(m,f)=>{try{const d=await open();return await new Promise(res=>{const q=f(d.transaction('p',m).objectStore('p'));q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null)})}catch(e){return null}};
  return {get:k=>tx('readonly',s=>s.get(k)),put:(k,v)=>tx('readwrite',s=>s.put(v,k)),del:k=>tx('readwrite',s=>s.delete(k))}})();
async function storePhoto(file){const u=await shrink(file,1200,'url');if(MODE!=='db')return u;
  const id='dev_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);PH[id]=u;await pdb.put(id,u);return id}
function photoSrc(p){if(!p)return '';p=String(p);if(p.startsWith('data:'))return p;if(PH[p])return PH[p];
  if(!phLoading.has(p)&&(p.startsWith('dev_')||p.startsWith('g_'))){phLoading.add(p);
    (async()=>{let v=await pdb.get(p);if(!v&&p.startsWith('g_')&&CONN){try{const r=await api('GET',{action:'photoGet',id:p.slice(2)},60000);v=`data:${r.mime||'image/jpeg'};base64,${r.b64}`;pdb.put(p,v)}catch(e){}}
      if(v){PH[p]=v;rerender()}})()}
  return p.startsWith('dev_')||p.startsWith('g_')?PH_WAIT:''}
async function dropPhoto(old,keep){if(!old||old===keep||D.logs.some(l=>l.photo===old)||(D.checks||[]).some(c=>c.pic&&c.pic.a===old))return;old=String(old);
  if(old.startsWith('dev_'))pdb.del(old);else if(old.startsWith('g_')&&CONN)api('POST',{action:'photoDel',id:old.slice(2)}).catch(()=>{})}
function photoErr(e){const c=e&&e.code;
  return c==='decode'?'이 사진은 읽을 수 없어요. JPG나 PNG로 시도해 주세요.':c==='too_large'?'사진이 너무 커요.':c==='quota_or_state'?'사진 저장 공간이 가득 찼어요. 사진 ZIP으로 백업한 뒤 정리해 주세요.':
    c==='no_assets'?'사진을 저장하려면 저장소 연결이 필요해요.':c==='rate_limited'?'잠시 후 다시 시도해 주세요.':'사진을 저장하지 못했어요. 다시 시도해 주세요.'}
async function bulkPhotos(files){
  toast('사진 저장 중…');let hit=0,miss=0;files.sort((a,b)=>a.lastModified-b.lastModified);
  for(const f of files){const day=ymd(new Date(f.lastModified));const l=D.logs.filter(x=>x.date===day).sort((a,b)=>!!a.photo-!!b.photo)[0];
    if(!l){miss++;continue}try{const old=l.photo;l.photo=await storePhoto(f);hit++;dropPhoto(old,l.photo)}catch(e){miss++}}
  save();render();toast(`${hit}장을 날짜에 맞춰 붙였어요${miss?` · ${miss}장은 그날 운동 기록이 없어요`:''}`);
}
boot();
</script>
