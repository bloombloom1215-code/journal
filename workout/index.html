      const nx=nextStep(e);toast(nx?`${lab} 끝. 자세 잡고 ${e.parts[nx.k].name}${nx.j>=0?' '+SIDE[e.parts[nx.k].sides[nx.j].s]:''} 시작을 누르세요`:`${e.name} 완료`);return}
    const m=tickMem['b'+i]||(tickMem['b'+i]={sec:-1});const sc=Math.ceil(left);if(sc!==m.sec&&sc<=3&&sc>=1)beep(880,.12);m.sec=sc;
    setTxt(`bt-left-${i}`,mmss(left));const b=document.getElementById(`bt-bar-${i}`);if(b)b.style.width=((1-left/t.work)*100)+'%';
    mini=`${e.name} · ${lab} ${mmss(left)}`;
  });
  // 세트별 버티기 타이머: 준비 n초 → (예고음) → 본운동 n초 → 종료음
  s.items.forEach((e,i)=>{const h=e.ht;if(!h||h.finished)return;
    const el=(Date.now()-h.start)/1000,tot=h.prep+h.work;let ph,left;
    if(el<h.prep){ph='prep';left=h.prep-el}else if(el<tot){ph='work';left=tot-el}
    else{h.finished=true;phaseSound('end');keepAwake(false);save();render();toast(`${h.j+1}세트 끝! 체크해 주세요`);return}
    const m=tickMem['h'+i]||(tickMem['h'+i]={ph:'',sec:-1});
    if(m.ph!==ph){if(ph==='work'&&m.ph)phaseSound('work');m.ph=ph}
    const sec=Math.ceil(left);if(sec!==m.sec&&sec<=3&&sec>=1)beep(880,.12);m.sec=sec;
    setTxt(`ht-ph-${i}`,ph==='prep'?'준비':'버티기');setTxt(`ht-left-${i}`,mmss(left));
    setTxt(`ht-nx-${i}`,ph==='prep'?`곧 ${h.work}초 본운동 시작`:`${h.j+1}세트 진행 중`);
    const b=document.getElementById(`ht-bar-${i}`);if(b)b.style.width=(el/tot*100)+'%';
    const box=document.getElementById(`ht-box-${i}`);if(box)box.className='timer '+(ph==='prep'?'rest':'work');
    mini=`${e.name} ${h.j+1}세트 · ${ph==='prep'?'준비':'버티기'} ${mmss(left)}`;
  });
  s.items.forEach((e,i)=>{if(e.mode!=='interval'||!e.run)return;const st=ivState(e);
    if(st.done){if(!e.done){e.done=true;e.run.finished=true;phaseSound('end');keepAwake(false);save();render();toast(`${e.name} 인터벌 완료`)}return}
    const m=tickMem[i]||(tickMem[i]={idx:-1,sec:-1});
    if(m.idx!==st.i){if(m.idx!==-1)phaseSound(st.p.t);m.idx=st.i}
    const sec=Math.ceil(st.left);if(sec!==m.sec&&sec<=3&&sec>=1&&!e.run.pausedAt){beep(880,.12)}m.sec=sec;
    const set=(id,v)=>{const x=document.getElementById(id);if(x)x.textContent=v};
    set(`iv-ph-${i}`,st.p.n+(st.p.k?` ${st.p.k}/${st.sets}`:''));set(`iv-left-${i}`,mmss(st.left));
    set(`iv-note-${i}`,st.p.note||'');set(`iv-next-${i}`,st.next?`다음: ${st.next.n}${st.next.note?' · '+st.next.note:''}`:'마지막 구간');
    const b=document.getElementById(`iv-bar-${i}`);if(b)b.style.width=(st.el/st.total*100)+'%';
    const box=document.getElementById(`iv-box-${i}`);if(box)box.className='timer '+st.p.t;
    mini=`${e.name} · ${st.p.n}${st.p.k?` ${st.p.k}/${st.sets}`:''} · ${mmss(st.left)}${e.run.pausedAt?' (일시정지)':''}`;
  });
  const sm=document.getElementById('sb-iv');if(sm){sm.textContent=mini;sm.hidden=!mini}
  const bar=document.querySelector('.sbar'),sp=document.getElementById('sb-space');if(bar&&sp){lastBarH=bar.offsetHeight;sp.style.height=lastBarH+'px'}
}

 today:'<path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/>',

// 오운완 사진: 루틴 설정에서 끈 루틴만으로 된 기록은 사진을 기다리지 않음
const wantsPhoto=l=>logRoutines(l).some(r=>{const x=getR(r.id);return !x||x.photo!==false});
// 루틴을 마지막으로 한 날로부터 며칠(오늘 기준). 오늘 한 건 빼고 셈 → 완료 전 판단용
// 렌더 한 번 동안 쓰는 기록 색인: 루틴id → 날짜 목록, 종목id → 날짜 목록 (D.logs가 바뀌면 다시 만듦)
let LI=null,LIk=null;
function logIdx(){const k=D.logs.length+'|'+(D.logs[D.logs.length-1]||{}).id;if(LI&&LIk===k&&LI.src===D.logs)return LI;
  const r={},e={};D.logs.forEach(l=>{logRoutines(l).forEach(x=>(r[x.id]=r[x.id]||[]).push(l.date));l.items.forEach(x=>{if(x.exId)(e[x.exId]=e[x.exId]||[]).push(l.date)})});
  LI={r,e,src:D.logs};LIk=k;return LI}
function sinceLast(rid,excludeToday){const t=today();let last='';(logIdx().r[rid]||[]).forEach(d=>{if(excludeToday&&d>=t)return;if(d>last)last=d});
  if(!last)return '<span class="since new">처음</span>';const n=Math.round((new Date(t+'T00:00')-new Date(last+'T00:00'))/864e5);
  return `<span class="since ${n>=7?'old':''}">${n===0?'오늘':n===1?'어제':n+'일 전'}</span>`}
/* 단계형 종목: 다음 단계로 넘어가는 기준(단계마다)
   goal: 한 번의 운동에서 sets세트 이상이 f ≥ v / count: 그 단계로 n번(per:'day' 하루 1번 / 'each' 할 때마다) */
function critCheck(ex,l){const c=l.crit;if(!c||!c.type)return null;
  const ls=D.logs.filter(g=>g.items.some(e=>e.exId===ex.id&&e.levelId===l.id));
  if(c.type==='goal'){const f=c.f||l.fields[0],v=+c.v||0,need=c.sets===''||c.sets==null?3:(+c.sets||1);let best=0;
    ls.forEach(g=>g.items.filter(e=>e.exId===ex.id&&e.levelId===l.id).forEach(e=>{const k=(e.sets||[]).filter(x=>x.done!==false&&+((x.vals||{})[f])>=v).length;if(k>best)best=k}));
    return {ok:v>0&&best>=need,text:`${need}세트 × ${FIELDS[f]?FIELDS[f][0]:f} ${v}${FIELDS[f]?FIELDS[f][1]:''} 이상`,prog:`가장 좋았던 날 ${Math.min(best,need)}/${need}세트`}}
  const n=c.per==='each'?ls.length:new Set(ls.map(g=>g.date)).size,need=+c.n||1;
  return {ok:n>=need,text:`이 단계로 ${need}번${c.per==='each'?' (할 때마다 셈)':' (하루 1번만 셈)'}`,prog:`${Math.min(n,need)}/${need}번`}}
// 방금 저장한 기록으로 기준을 넘은 단계 찾기(이미 다음 단계를 쓰는 종목은 제외)
function levelUps(log){const out=[];
  log.items.forEach(e=>{if(!e.exId||out.some(x=>x.exId===e.exId))return;const ex=getEx(e.exId);if(!ex||ex.levels.length<2)return;
    const k=ex.levels.findIndex(l=>l.id===e.levelId);if(k<0||k>=ex.levels.length-1)return;const r=critCheck(ex,ex.levels[k]);
    if(r&&r.ok&&D.routines.some(rt=>rt.items.some(i=>i.exId===ex.id&&i.levelId===e.levelId)))out.push({exId:ex.id,from:e.levelId,to:ex.levels[k+1].id,why:r.text})});
  return out}
// 루틴 누적 횟수 = 이 앱 쓰기 전 횟수(루틴 편집에서 입력) + 앱 기록 수
const routineTotal=rid=>{const r=getR(rid);return (r&&+r.base||0)+(logIdx().r[rid]||[]).length};

/* ===== 부위·존·주간 목표 =====
   종목: ex.areas(부위 여러 개). D.wgoal={list:[{kind:'area'|'cat',ref,n,unit:'set'|'min'}]} · 옛 형식: {:분}} */
const areaList=()=>(D.areas||[]).filter(a=>!a.hidden);

const exAreas=ex=>ex.areas||(ex.area?[ex.area]:[]);
const wgoal=()=>{const g=D.wgoal=D.wgoal&&Array.isArray(D.wgoal.list)?D.wgoal:{list:[]};return g};
const goalName=x=>x.kind==='cat'?((D.cats.find(c=>c.id===x.ref)||{}).name||'(지운 카테고리)'):(areaName(x.ref)||'(지운 부위)');
const flatItems=r=>{const out=[];(r?r.items:[]).forEach(i=>{if(i.subRid){const sr=getR(i.subRid);if(sr)sr.items.filter(x=>!x.subRid&&x.exId).forEach(x=>out.push(x))}else if(i.exId)out.push(i)});return out};
// 이번 주 배치(계획)만으로 목표별 양 계산: 세트 = 세트 수, 분 = 시간 항목(인터벌은 전체 시간)
function planLoad(mon,x){let n=0;weekPlan(mon).forEach(p=>flatItems(getR(p.rid)).forEach(it=>{const ex=getEx(it.exId);if(!ex)return;
    if(x.kind==='cat'?ex.cat!==x.ref:!exAreas(ex).includes(x.ref))return;const lv=getLv(ex,it.levelId),k=+it.sets||1;
    if(x.unit==='min')n+=it.mode==='interval'?ivTotal(it.iv||{}):(lv.fields.includes('min')?(+((it.vals||{}).min)||0)*k:0);else n+=it.mode==='interval'?1:k}));return n}
function goalCard(mon){const g=wgoal(),ed=UI.gEdit;
  const view=g.list.map(x=>{const p=planLoad(mon,x),ok=p>=+x.n;return `<span class="gch ${ok?'ok':'lack'}">${esc(goalName(x))} <b class="num">${p}/${x.n}</b>${x.unit==='min'?'분':'세트'}</span>`}).join('');

      <input class="n" inputmode="numeric" value="${x.n}" data-in="wgl:${x.id}" aria-label="목표 값"><button class="btn small soft" data-a="gUnit" data-id="${x.id}">${x.unit==='min'?'분':'세트'}</button><button class="btn small ghost" data-a="gDel" data-id="${x.id}" aria-label="목표 빼기">×</button></div>`).join('')}
    <div class="gpick"><span class="sub">부위 · 눌러서 목표 추가</span>

      <span class="sub">카테고리 · 눌러서 목표 추가</span>
      <div class="chips">${D.cats.map(c=>`<button class="chip ${g.list.some(x=>x.kind==='cat'&&x.ref===c.id)?'on':''}" data-a="gAdd" data-k="cat" data-id="${c.id}">${esc(c.name)}</button>`).join('')}</div></div></div>`:'';
  return `<div class="card goalc"><div class="row between"><h2>주간 목표</h2><button class="btn small ghost" data-a="gEdit">${ed?'완료':g.list.length?'편집':'+ 목표 정하기'}</button></div>
   ${g.list.length?`<div class="gchips">${view}</div>`:(ed?'':'<p class="sub" style="margin:0">부위·카테고리별 최소 세트나 시간을 정하면, 이번 주 배치가 채우는지 바로 보여요.</p>')}${edit}</div>`}
const quickLog=(rid,date)=>{const r=getR(rid);D.logs.push({id:uid(),date,rid:r.id,name:r.name,color:r.color,routines:[{id:r.id,name:r.name,color:r.color}],dur:null,memo:'',photo:null,items:[],bw:D.body.kg,quick:true})};

/* 카테고리·부위 칩: 종목/루틴 편집 화면에서만 만들고 고침. kind: 'cat'(종목 카테고리) | 'area'(부위) | 'rcat'(루틴 카테고리) */
const tagSrc=k=>k==='cat'?D.cats:k==='rcat'?(D.rcats=D.rcats||[]):(D.areas=D.areas||[]);
const tagUsers=(k,id)=>k==='cat'?D.ex.filter(e=>e.cat===id):k==='rcat'?D.routines.filter(r=>r.cat===id):D.ex.filter(e=>exAreas(e).includes(id));
const TAGN={cat:'카테고리',area:'부위',rcat:'카테고리'};
function tagField(k,label,sel,act,multi){const ed=UI.tagEd===k,list=tagSrc(k).filter(x=>!x.hidden);
  return `<div class="field"><label>${label}${multi?' <span class="unit">여러 개 고를 수 있어요</span>':''}</label><div class="chips">

    ${list.map(x=>ed?`<button class="chip edit" data-a="tagEdit" data-k="${k}" data-id="${x.id}">${esc(x.name)} ✎</button>`:`<button class="chip ${sel.includes(x.id)?'on':''}" data-a="${act}" data-id="${x.id}">${esc(x.name)}</button>`).join('')}

    <button class="chip add" data-a="tagEdMode" data-k="${k}">${ed?'완료':'✎ 고치기'}</button></div></div>`}
/* ===== 운동 계획: 기본 주간 계획(매주 반복되는 틀) + 주별로 옮기기 =====
   D.plan={tpl:[{id,rid,wd,type}], weeks:{'그 주 월요일':[{id,rid,date,type,tpl}]}}
   wd 0=월…6=일 / type 'A'=고정, 'B'=바뀔 수 있음(실외 달리기 등). 한 주는 월요일 시작.
   틀은 그 주를 처음 열거나 고칠 때 그 주의 계획으로 '찍혀' 고정됨 → 틀을 바꿔도 지난 주·이번 주는 그대로 */
const WDK=['월','화','수','목','금','토','일'];
const addDay=(k,n)=>{const d=new Date(k+'T00:00');d.setDate(d.getDate()+n);return ymd(d)};
const monOf=k=>{const d=new Date(k+'T00:00');return addDay(k,-((d.getDay()+6)%7))};
const wdOf=k=>(new Date(k+'T00:00').getDay()+6)%7;
const md=k=>`${+k.slice(5,7)}/${+k.slice(8)}`;
function planOf(){if(!D.plan)D.plan={tpl:[],weeks:{}};D.plan.tpl=D.plan.tpl||[];D.plan.weeks=D.plan.weeks||{};return D.plan}
function weekPlan(mon,make){const P=planOf();if(P.weeks[mon])return P.weeks[mon];
  const list=P.tpl.filter(t=>getR(t.rid)).map(t=>({id:'t'+t.id+mon.replace(/-/g,''),rid:t.rid,date:addDay(mon,t.wd),type:t.type,tpl:t.id}));
  if(make)P.weeks[mon]=list;return list}
// 계획과 실제 기록 짝짓기: 같은 날 같은 루틴 먼저, 남으면 그 주의 다른 날 기록과
function weekStatus(mon){const end=addDay(mon,6),items=weekPlan(mon).map(p=>({...p,done:null})),pool=[];
  D.logs.filter(l=>l.date>=mon&&l.date<=end).forEach(l=>logRoutines(l).forEach(r=>pool.push({rid:r.id,date:l.date,used:false,lid:l.id})));
  items.forEach(p=>{const m=pool.find(x=>!x.used&&x.rid===p.rid&&x.date===p.date);if(m){m.used=true;p.done=m.date;p.lid=m.lid}});
  items.forEach(p=>{if(p.done)return;const m=pool.find(x=>!x.used&&x.rid===p.rid);if(m){m.used=true;p.done=m.date;p.lid=m.lid}});
  return {items,extra:pool.filter(x=>!x.used)}}
const ensureWeek=mon=>{if(!planOf().weeks[mon]){weekPlan(mon,true);save()}return planOf().weeks[mon]};
const findPlan=(mon,id)=>ensureWeek(mon).find(p=>p.id===id);
function chipHtml(p,t,drag){const r=getR(p.rid)||{name:'(지운 루틴)',color:'#7A8494'};const miss=!p.done&&p.date<t;
  return `<button class="pchip ${p.done?'done':''} ${miss?'miss':''}" style="--c:${r.color}" data-a="pChip" data-id="${p.id}" data-mon="${monOf(p.date)}" ${drag&&!p.done?`data-pdrag="${p.id}"`:''}>
    ${p.done?'✓ ':''}${esc(r.name)}${p.done&&p.done!==p.date?` <small>${WDK[wdOf(p.done)]}에 함</small>`:''}${miss?' <small>미완료</small>':''}</button>`}
function viewPlan(){const t=today(),cur=monOf(t);if(!UI.pw)UI.pw=cur;const mon=UI.pw;if(mon===cur)ensureWeek(cur);
  const {items,extra}=weekStatus(mon),by={};items.forEach(p=>{const b=by[p.rid]=by[p.rid]||{n:0,d:0};b.n++;if(p.done)b.d++});
  const done=items.filter(p=>p.done).length;
  const pills=Object.entries(by).map(([rid,v])=>{const r=getR(rid)||{name:'?',color:'#7A8494'};return `<span class="ppill ${v.d>=v.n?'full':''}"><span class="swatch" style="background:${r.color}"></span>${esc(r.name)} <b class="num">${v.d}/${v.n}</b></span>`}).join('');
  const days=WDK.map((w,i)=>{const k=addDay(mon,i);return `<div class="pday ${k===t?'today':''} ${k<t?'past':''}" data-pday="${k}"><div class="pdl"><b>${w}</b><span class="num">${+k.slice(8)}</span></div>
    <div class="pchips">${items.filter(p=>p.date===k).map(p=>chipHtml(p,t,true)).join('')}</div><button class="padd" data-a="pAdd" data-date="${k}" aria-label="${w}요일에 루틴 추가">＋</button></div>`}).join('');
  const noTpl=!planOf().tpl.length;
  return `<div class="head"><span class="eyebrow">계획</span><h1>주간 운동 계획</h1></div>
  <div class="pnav"><button class="btn small ghost" data-a="pWeek" data-d="-1" aria-label="지난주">‹</button><strong>${md(mon)} – ${md(addDay(mon,6))}</strong>
    ${mon===cur?'<span class="sub">이번 주</span>':`<button class="btn small soft" data-a="pWeek" data-d="0">이번 주로</button>`}<button class="btn small ghost" data-a="pWeek" data-d="1" aria-label="다음 주">›</button></div>
  ${noTpl?`<div class="card"><h2>기본 주간 계획부터 만들어요</h2><p class="sub">요일마다 할 루틴을 한 번 정해 두면 매주 월요일에 그대로 깔려요.</p><button class="btn primary block" data-a="pTplOpen">기본 주간 계획 만들기</button></div>`:''}
  ${goalCard(mon)}
  <div class="pweek">${days}</div>
  ${noTpl?'':`<button class="btn soft block" data-a="pTplOpen">기본 주간 계획 편집</button>`}`}
// 오늘 탭: 오늘 계획한 루틴만
function planToday(){const t=today(),cur=monOf(t);ensureWeek(cur);
  const ws=weekStatus(cur),its=ws.items.filter(p=>p.date===t);

// 꾹 눌러 끌기(휴대폰·마우스 공통): 0.35초 누르면 들림 → 요일 칸 위에 놓기
let pDragEnd=0;
(()=>{let st=null;
  const end=(drop)=>{if(!st)return;clearTimeout(st.tm);const s=st;st=null;document.querySelectorAll('.pday.drop').forEach(x=>x.classList.remove('drop'));
    if(s.g)s.g.remove();if(s.el)s.el.classList.remove('lift');if(!s.on)return;pDragEnd=Date.now();
    document.querySelectorAll('.pchip.ins-b,.pchip.ins-a').forEach(x=>x.classList.remove('ins-b','ins-a'));
    if(drop&&s.over){const w=ensureWeek(s.mon),k=w.findIndex(x=>x.id===s.id);if(k<0){render();return}const p=w[k],from=p.date;
      w.splice(k,1);p.date=s.over;let at=-1;
      if(s.near){at=w.findIndex(x=>x.id===s.near.id);if(at>=0&&s.near.after)at++}
      if(at<0){at=w.length;for(let i=w.length-1;i>=0;i--){if(w[i].date===s.over){at=i+1;break}}}
      w.splice(at,0,p);save();if(from!==s.over)toast(`${(getR(p.rid)||{}).name}: ${WDK[wdOf(s.over)]}요일로 옮겼어요`)}
    render()};
  const start=(el,x,y)=>{st={id:el.dataset.pdrag,mon:el.dataset.mon,el,x,y,on:false,over:null,near:null,g:null};
    st.tm=setTimeout(()=>{if(!st)return;st.on=true;el.classList.add('lift');if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
      const g=el.cloneNode(true);g.classList.remove('lift');g.classList.add('pghost');g.style.left=x+'px';g.style.top=y+'px';document.body.appendChild(g);st.g=g},350)};
  const move=(x,y,ev)=>{if(!st)return;if(!st.on){if(Math.hypot(x-st.x,y-st.y)>8){clearTimeout(st.tm);st=null}return}
    if(ev&&ev.cancelable)ev.preventDefault();st.g.style.left=x+'px';st.g.style.top=y+'px';
    const day=document.elementFromPoint(x,y);const d=day&&day.closest('.pday');document.querySelectorAll('.pday.drop').forEach(z=>{if(z!==d)z.classList.remove('drop')});
    if(d){d.classList.add('drop');st.over=d.dataset.pday}else st.over=null;
    document.querySelectorAll('.pchip.ins-b,.pchip.ins-a').forEach(x=>x.classList.remove('ins-b','ins-a'));st.near=null;
    const ch=day&&day.closest('.pday .pchip');if(ch&&ch.dataset.id!==st.id){const r=ch.getBoundingClientRect(),after=x>r.left+r.width/2;ch.classList.add(after?'ins-a':'ins-b');st.near={id:ch.dataset.id,after}}
    if(y<60)scrollBy(0,-12);else if(y>innerHeight-90)scrollBy(0,12)};
  document.addEventListener('touchstart',e=>{const el=e.target.closest('[data-pdrag]');if(el&&e.touches.length===1)start(el,e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
  document.addEventListener('touchmove',e=>{if(st)move(e.touches[0].clientX,e.touches[0].clientY,e)},{passive:false});
  document.addEventListener('touchend',()=>end(true));document.addEventListener('touchcancel',()=>end(false));
  document.addEventListener('mousedown',e=>{const el=e.target.closest('[data-pdrag]');if(el&&e.button===0)start(el,e.clientX,e.clientY)});
  document.addEventListener('mousemove',e=>{if(st)move(e.clientX,e.clientY,e)});document.addEventListener('mouseup',()=>end(true));
  document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-pdrag]'))e.preventDefault()});
})();

/* ===== 여러 루틴 함께 하기 ===== */
const logRoutines=l=>l.routines&&l.routines.length?l.routines:[{id:l.rid,name:l.name,color:l.color}];
const swatches=l=>logRoutines(l).map(r=>`<span class="swatch" style="background:${r.color}"></span>`).join('');
// 루틴 항목을 세션 항목으로(꼬리표 순서대로). 이미 세션에 있는 같은 묶음(예: 공통 워밍업)은 한 번만
// 루틴 항목을 세션 항목으로. 루틴 안에 넣은 다른 루틴(예: 워밍업 루틴)은 그 루틴의 종목으로 펼침(한 단계만, 함께 하기에서 같은 루틴은 한 번만)
function routineEntries(r,s){s._subs=s._subs||[];const out=[];
  ordered(r.items).forEach(i=>{if(i.blockId)return;
    if(i.subRid){const sr=getR(i.subRid);if(!sr||s._subs.includes(sr.id))return;s._subs.push(sr.id);sr.items.filter(x=>!x.subRid&&!x.blockId).forEach(x=>out.push(x));return}
    out.push(i)});
  return out.map(i=>{const e=toEntry(i);e.rid=r.id;return e})}
// 함께 하기: 세션 전체에서 워밍업 묶음은 맨 앞, 정리운동 묶음은 맨 끝(같은 묶음은 한 번만)
const eRank=e=>e.kind==='block'?(e.tag==='warmup'?0:e.tag==='cooldown'?2:1):1;
function sortSession(s){s.items=s.items.map((e,i)=>[e,i]).sort((a,b)=>eRank(a[0])-eRank(b[0])||a[1]-b[1]).map(x=>x[0]);for(const k in tickMem)delete tickMem[k]}
const secKey=(e,s)=>{const r=eRank(e);return r===0?'_warm':r===2?'_cool':(e.rid||s.rid||'_none')};
function entryProg(e){if(e.parts)return [e.parts.filter(p=>p.done).length,e.parts.length];if(e.sets)return [e.sets.filter(x=>x.done).length,e.sets.length];return [e.done?1:0,1]}
function startSession(ids,opt={}){const rs=ids.map(getR).filter(Boolean);if(!rs.length&&!opt.past)return;
  const s={rid:rs[0]?rs[0].id:null,rids:[],name:'',color:rs[0]?rs[0].color:'#7A8494',bw:D.body.kg,date:opt.date||today(),start:opt.past?null:Date.now(),past:!!opt.past,dur:'',memo:'',items:[]};
  rs.forEach(r=>{s.items.push(...routineEntries(r,s));s.rids.push(r.id)});sortSession(s);s.name=rs.map(r=>r.name).join(' + ')||'직접 기록';
  D.session=s;UI.pick=[];if(opt.past)UI.view='today';save();scrollTo(0,0)}
// 저장된 기록을 운동 화면으로 열기: 수정(editLogId) 또는 다른 날짜로 복사

/* ===== 부위별 꾸준함: 오늘 기준 최근 28일 ===== */
/* ===== 오늘 탭 루틴 목록: 한 줄씩, 최근에 한 루틴이 위로 ===== */
function sessionProgress(s){let tot=0,done=0;
  s.items.forEach(e=>{if(e.parts){tot+=e.parts.length;done+=e.parts.filter(p=>p.done).length;return}if(e.sets){tot+=e.sets.length;done+=e.sets.filter(x=>x.done).length}else{tot++;done+=e.done?1:0}});return [done,tot]}

  const s=D.session;const [done,tot]=sessionProgress(s);

  ${(()=>{const keys=[...new Set(s.items.map(e=>secKey(e,s)))];const multi=keys.length>1;const prog={};
    s.items.forEach(e=>{const k=secKey(e,s),[d,t]=entryProg(e);prog[k]=prog[k]||[0,0];prog[k][0]+=d;prog[k][1]+=t});

    s.items.forEach((e,i)=>{const k=secKey(e,s);
      if(multi&&k!==cur){cur=k;const [d,t]=prog[k],full=t&&d===t;closed=UI.sec[k]==='closed'||(UI.sec[k]!=='open'&&full);const r=getR(k);

// 다음에 할 것: 첫 미완료 항목, 좌우 항목이면 그 안의 첫 미완료 쪽
function nextStep(e){for(let k=0;k<e.parts.length;k++){const p=e.parts[k];if(p.done)continue;if(p.sides){const j=p.sides.findIndex(x=>!x.done);if(j>=0)return {k,j}}return {k,j:-1}}return null}
const syncDone=p=>{if(p.sides)p.done=p.sides.every(x=>x.done)};
function blockCard(e,i){
  const done=e.parts.filter(p=>p.done).length,all=e.parts.length&&done===e.parts.length,open=!!UI.open[e.uid],bt=e.bt;

      :`<button class="btn primary block" data-a="bStart" data-i="${i}" data-k="${nx.k}" data-j="${nx.j}" ${v?'':'disabled'}>▶ ${lab} ${v}초 시작</button>`}
  if(open)body+=e.parts.map((p,k)=>{const nj=p.sides?p.sides.findIndex(x=>!x.done):-1;

/* 리포트 · 꾸준함: 했는지만 칸으로. 월별 = 그 달의 날짜 칸, 연별 = 그 해의 주 칸(월요일 시작) */
function viewHistory(){const kind=UI.rk||'r',per=UI.rp==='y'?'y':'m',t=today();
  if(!UI.rm){UI.rm=t.slice(0,7)}if(!UI.ry){UI.ry=+t.slice(0,4)}
  let cols=[],title='';
  if(per==='m'){const [y,m]=UI.rm.split('-').map(Number),n=new Date(y,m,0).getDate();title=`${y}년 ${m}월`;
    for(let d=1;d<=n;d++){const k=`${y}-${pad(m)}-${pad(d)}`;cols.push({s:k,e:k,l:d,fut:k>t,cur:k===t})}}
  else{const y=UI.ry;title=`${y}년`;let s0=monOf(`${y}-01-01`);if(s0<`${y}-01-01`)s0=addDay(s0,7);let w=1;
    while(s0.slice(0,4)==String(y)){cols.push({s:s0,e:addDay(s0,6),l:w,fut:s0>t,cur:s0===monOf(t)});s0=addDay(s0,7);w++}}
  const src=kind==='r'?D.routines.map(r=>({id:r.id,name:r.name,color:r.color,has:l=>logRoutines(l).some(x=>x.id===r.id)}))
    :D.ex.map(e=>({id:e.id,name:e.name,color:'var(--accent)',has:l=>l.items.some(x=>x.exId===e.id)}));
  const LX=logIdx();
  const rows=src.map(it=>{const ds=new Set((kind==='r'?LX.r:LX.e)[it.id]||[]);const on=cols.map(c=>{for(const d of ds)if(d>=c.s&&d<=c.e)return true;return false});
    return {...it,on,n:on.filter(Boolean).length,any:ds.size}}).filter(r=>kind==='r'||r.any);
  const unit=per==='m'?'일':'주';
  // 월별: 월~일 7칸 달력(날짜 칸) / 연별: 12줄(월) × 그 달 주(월요일 기준) 칸
  const lead=per==='m'?(wdOf(cols[0].s)):0;
  const box=r=>{if(per==='m')return `<div class="mcal">${WDK.map(w=>`<b>${w}</b>`).join('')}${'<i class="nil"></i>'.repeat(lead)}${cols.map((c,k)=>`<i class="${r.on[k]?'on':''} ${c.fut?'fut':''} ${c.cur?'cur':''}" style="${r.on[k]?`background:${r.color}`:''}"></i>`).join('')}</div>`;
    const byM=Array.from({length:12},()=>[]);cols.forEach((c,k)=>byM[+c.s.slice(5,7)-1].push(k));

// 한 종목의 날짜별 가장 좋은 세트(무게 > 횟수 > 시간 순으로 대표 항목 선택). 단계형이면 단계 바뀐 곳 표시
/* 성장 그래프
   - 무게(kg)와 횟수를 함께 기록하는 종목: 그날 볼륨(무게×횟수 합) — 무게는 천천히 오르니 횟수까지 함께 봄
   - 그 밖: 세트 중 가장 좋은 값(횟수 > 시간 순)
   - 단계형: 다음 단계 첫 기록을 앞 단계 마지막 높이에서 이어 그림(단계가 오르며 값이 내려가 보이는 것 방지). 실제 값은 점 옆 숫자로 */
// 단계마다 그래프 기준: 무게+횟수면 볼륨, 아니면 횟수 > 시간 > 거리 순
const gMetric=fl=>{const vol=fl.includes('kg')&&fl.includes('reps');return {vol,f:vol?'kg':['reps','sec','min','dist','kg'].find(x=>fl.includes(x))||fl[0]}};
function growthChart(ex){const multi=ex.levels.length>1;
  const pts=[];[...D.logs].sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>l.items.filter(e=>e.exId===ex.id).forEach(e=>{const ds=(e.sets||[]).filter(s=>s.done);if(!ds.length)return;
    const lv=lvIdx(ex,e.levelId),{vol,f}=gMetric(e.fields&&e.fields.length?e.fields:getLv(ex,e.levelId).fields);if(!f)return;
    const wu=e.wunit||'kg',bw=l.bw,v=vol?Math.round(ds.reduce((a,s)=>a+setLoad(s.vals||{},bw,wu)*(+((s.vals||{}).reps)||0),0)):Math.max(...ds.map(s=>+((s.vals||{})[f])||0));
    if(v>0)pts.push({d:l.date,v,lv,vol,f,u:vol?'kg':(FIELDS[f]?FIELDS[f][1]:''),best:ds.reduce((b,s)=>{const x=s.vals||{};return (+x[f]||0)>(+b[f]||0)?x:b},{}),n:ds.length})}));
  if(!pts.length)return '<p class="empty">아직 기록이 없어요.</p>';
  // 단계 이어 그리기: 단계마다 단위가 달라도(횟수→볼륨) 비교되게 '그 단계 첫 기록 대비 성장률(%)'로 쌓아 올림
  let base=0,first=null,prevY=0;pts.forEach((p,i)=>{if(multi&&(i===0||p.lv!==pts[i-1].lv)){base=i===0?0:prevY;first=p.v}p.y=multi?base+(p.v-first)/first*100:p.v;prevY=p.y});
  const lo=Math.min(0,...pts.map(p=>p.y)),hi=Math.max(...pts.map(p=>p.y));
  const W=320,H=160,px=multi?10:30,py=18,t0=new Date(pts[0].d).getTime(),t1=Math.max(t0+864e5,new Date(pts[pts.length-1].d).getTime());
  const X=p=>px+(W-px-14)*(new Date(p.d).getTime()-t0)/(t1-t0),Y=y=>H-py-(H-py*2)*(y-lo)/((hi-lo)*1.12||1);const LC=['#7A8494','#2F8FB3','#E9A23B','#D9412A','#8A5CD0','#3FA36B'];
  const col=p=>multi?LC[p.lv%6]:'var(--accent)';let marks='',segs='',labs='';
  pts.forEach((p,i)=>{const first=multi&&(i===0||p.lv!==pts[i-1].lv),last=multi&&(i===pts.length-1||p.lv!==pts[i+1].lv);
    if(first)marks+=`<line x1="${X(p)}" y1="${py-6}" x2="${X(p)}" y2="${H-py}" stroke="${col(p)}" stroke-dasharray="3 3"/><text x="${X(p)+3}" y="${py+2}" font-size="10" fill="${col(p)}">${p.lv+1}단계</text>`;
    if(i)segs+=`<line x1="${X(pts[i-1])}" y1="${Y(pts[i-1].y)}" x2="${X(p)}" y2="${Y(p.y)}" stroke="${col(p)}" stroke-width="2"/>`;
    if(first||last){const xx=X(p),an=xx>W-40?'end':xx<px+20?'start':'middle';labs+=`<text x="${xx}" y="${first&&i?Y(p.y)+15:Y(p.y)-7}" font-size="9" fill="${col(p)}" text-anchor="${an}">${p.v.toLocaleString()}${p.u}</text>`}});
  const fst=pts[0],lst=pts[pts.length-1],ln=p=>multi?`${p.lv+1}단계 ${ex.levels[p.lv].name} `:'';
  const bestTxt=p=>p.vol?` (최고 세트 ${p.best.kg||0}kg×${p.best.reps||0})`:'',anyVol=pts.some(p=>p.vol),anyRaw=pts.some(p=>!p.vol);
  return `<svg viewBox="0 0 ${W} ${H}" class="gchart" role="img" aria-label="${esc(ex.name)} 성장 그래프">
    <line x1="${px}" y1="${H-py}" x2="${W-8}" y2="${H-py}" stroke="var(--line)"/>
    ${multi?'':`<text x="2" y="${Y(hi)+4}" font-size="10" fill="var(--muted)">${Math.round(hi).toLocaleString()}</text>`}
    ${marks}${segs}${labs}${pts.map(p=>`<circle cx="${X(p)}" cy="${Y(p.y)}" r="3.5" fill="${col(p)}"/>`).join('')}
    <text x="${px}" y="${H-3}" font-size="10" fill="var(--muted)">${md(fst.d)}</text><text x="${W-8}" y="${H-3}" font-size="10" fill="var(--muted)" text-anchor="end">${md(lst.d)}</text></svg>
   <p class="sub" style="margin:0">${[anyRaw?`세트 중 가장 좋은 ${esc((FIELDS[(pts.find(p=>!p.vol)||{}).f]||['값'])[0])}`:'',anyVol?'그날 볼륨(무게 × 횟수 합)':''].filter(Boolean).join(' / ')} 기준${multi?' · 높이는 단계마다 처음 대비 성장률을 이어 쌓은 것 (점 옆 숫자는 실제 값)':''} · 기록 ${pts.length}번</p>
   <div class="gsum"><span>처음 <b>${ln(fst)}${fst.v.toLocaleString()}${fst.u}</b>${bestTxt(fst)}</span><span>→</span><span>지금 <b>${ln(lst)}${lst.v.toLocaleString()}${lst.u}</b>${bestTxt(lst)}${!lst.vol&&lst.n>1?` × ${lst.n}세트`:''}</span></div>`}

// CSV: 세트 1개 = 1줄. 무게는 원래 단위와 kg 환산값을 함께
function exportCsv(){
  const cols=['날짜','루틴','종목','단계','세트','횟수','무게','무게단위','무게(kg)','보조','보조(kg)','실부하(kg)','체중(kg)','초','분','속도(km/h)','경사도(%)','강도','RPM','거리(km)','칼로리','심박','운동시간(분)','메모'];
  const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[cols];
  [...D.logs].sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>l.items.forEach(e=>{
    const lv=e.levelName?e.levelName:'';
    if(e.kind==='block'){let k=0;e.parts.forEach(pt=>(pt.sides?pt.sides.filter(x=>x.done).map(x=>({nm:`${pt.name} (${SIDE[x.s]})`,v:x.v})):[{nm:pt.name,v:pt.unit==='reps'?pt.reps:pt.sec}]).forEach(r=>rows.push([l.date,l.name,e.name,r.nm,++k,pt.unit==='reps'?r.v:'','','','','','','',l.bw,pt.unit==='reps'?'':r.v,'','','','','','','','','',(pt.areas||[]).length?'부위: '+pt.areas.map(areaName).filter(Boolean).join(', '):''])));return}
    if(e.mode==='interval'){rows.push([l.date,l.name,e.name,lv,'인터벌','','','','','','','',l.bw,'',ivTotal(e.iv),'','','','','','','',l.dur,ivDesc(e.iv)]);return}
    (e.sets||[]).filter(s=>s.done).forEach((s,k)=>{const v=s.vals,wu=e.wunit||'kg';
      rows.push([l.date,l.name,e.name,lv,k+1,v.reps,v.kg,v.kg!=null&&v.kg!==''?wu:(v.assist!=null&&v.assist!==''?wu:''),v.kg!=null&&v.kg!==''?toKg(v.kg,wu):'',
        v.assist,v.assist!=null&&v.assist!==''?toKg(v.assist,wu):'',v.assist!=null&&v.assist!==''&&l.bw?realLoad(l.bw,v.assist,wu):'',l.bw,
        v.sec,v.min,v.speed,v.incline,v.level,v.rpm,v.dist,v.kcal,v.hr,k===0?l.dur:'',k===0?l.memo:''])});
  }));
  return '﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n');
}
async function exportPhotos(){
  const ls=D.logs.filter(l=>l.photo).sort((a,b)=>a.date.localeCompare(b.date));
  if(!ls.length){toast('저장된 오운완 사진이 없어요');return}
  if(!window.JSZip){toast('압축 도구를 불러오지 못했어요. 새로고침 후 다시 시도해 주세요.');return}
  const zip=new JSZip();const seen={};let n=0;
  for(const l of ls){UI.busy=`사진 모으는 중… ${++n}/${ls.length}`;render();
    try{let src=photoSrc(l.photo);if(src===PH_WAIT){src=await pdb.get(l.photo);if(!src)continue}const r=await fetch(src);if(!r.ok)continue;const b=await r.blob();
      let name=`${l.date}_${l.name.replace(/[\\/:*?"<>|]/g,'')}`;seen[name]=(seen[name]||0)+1;if(seen[name]>1)name+=`_${seen[name]}`;zip.file(name+'.jpg',b)}catch(e){}}
  UI.busy='압축하는 중…';render();
  const blob=await zip.generateAsync({type:'blob'});UI.busy='';render();
  await saveFile(`오운완사진_${stamp()}.zip`,blob);
}

  if(c){const p=c.split(':');
    if(p[0]==='cardsel')UI.cardLog=t.value;
    else if(p[0]==='excat'){getEx(UI.editEx).cat=t.value;save()}
    else if(p[0]==='lvl'){const r=getR(UI.editR),it=r.items[p[1]],ex=getEx(it.exId),lv=getLv(ex,t.value);
      it.levelId=lv.id;const nv=blankVals(lv);Object.keys(nv).forEach(f=>{if(it.vals&&it.vals[f]!=null&&it.vals[f]!=='')nv[f]=it.vals[f]});it.vals=nv;it.sets=it.sets||3;
      if(!lv.fields.includes('min'))it.mode='steady';
      save();openProp(it.exId,lv.id,'ex',{levelId:lv.id,vals:{...it.vals},sets:it.sets},r.id);}
    render();return}
  if(t.dataset.photo&&t.files&&t.files[0]){const l=D.logs.find(x=>x.id===t.dataset.photo);if(!l)return;const f=t.files[0];t.value='';
    toast('사진 저장 중…');
    storePhoto(f).then(p=>{const old=l.photo;l.photo=p;save();render();toast('오운완 사진을 기록에 붙였어요');dropPhoto(old,p)}).catch(e=>toast(photoErr(e)));return}
  if(t.dataset.wkenv!==undefined){const v=t.value==='prod'?'prod':'test';(async()=>{
    if(dirty)await flush();
    if(v==='prod'&&CONN.env==='test'){ // 테스트 → 실사용: 실사용에 운동 기록이 없으면 테스트 기록을 그대로 옮김
      toast('테스트 기록을 실사용 시트로 옮기는 중…');
      try{const mine=(cols,col)=>((cols||{})[col]||[]).filter(r=>!r.deleted&&(col!=='meta'||String(r.id).startsWith('wk_')));
        const [T,P]=await Promise.all([api('GET',{action:'listAll',env:'test'}),api('GET',{action:'listAll',env:'prod'})]);
        const C=['workout_routines','workouts','meta'],has=C.some(c=>mine(P.cols,c).some(r=>!(c==='workouts'&&r.id==='session')));
        if(has)toast('실사용 시트에 이미 운동 기록이 있어 옮기지 않고 실사용으로 바꿨어요.');
        else{const at='t'+new Date().toISOString();for(const c of C){const rs=mine(T.cols,c).map(r=>({id:r.id,updatedAt:at,deleted:false,data:r.data}));for(let i=0;i<rs.length;i+=200)await api('POST',{action:'upsert',col:c,records:rs.slice(i,i+200),env:'prod'})}
          try{localStorage.removeItem('wk_cache_prod')}catch(e){}toast('테스트 기록을 실사용으로 옮겼어요.')}
      }catch(e){toast('옮기지 못했어요. 연결을 확인하고 다시 시도해 주세요.');render();return}
      await new Promise(r=>setTimeout(r,1200))}
    try{localStorage.setItem('wk_env',v)}catch(e){}location.reload()})();return}
  if(t.dataset.importfile&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=()=>askImport(fr.result);fr.readAsText(t.files[0]);t.value='';return}
  if(t.dataset.bulk&&t.files&&t.files.length){bulkPhotos([...t.files]);}
});
// 사진: 긴 변 1600px JPEG로 줄여서 저장(클로드 저장소면 파일로, 이 기기 모드면 브라우저에)
function shrink(file,M,as){return new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=no;fr.onload=()=>{const img=new Image();img.onerror=()=>no({code:'decode'});img.onload=()=>{
  const sc=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');
  c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  if(as==='url')ok(c.toDataURL('image/jpeg',.78));else c.toBlob(b=>b?ok(b):no({code:'decode'}),'image/jpeg',.85)};img.src=fr.result};fr.readAsDataURL(file)})}
/* 사진 보관: 오운완 사진은 기념용이라 이 기기에만(dev_), 몸 상태 정렬 사진은 드라이브 '사진' 폴더(g_) */
const PH={},phLoading=new Set();
const PH_WAIT='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><rect width="10" height="10" fill="#e3e6eb"/></svg>');
const pdb=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('wk-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=async(m,f)=>{try{const d=await open();return await new Promise(res=>{const q=f(d.transaction('p',m).objectStore('p'));q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null)})}catch(e){return null}};
  return {get:k=>tx('readonly',s=>s.get(k)),put:(k,v)=>tx('readwrite',s=>s.put(v,k)),del:k=>tx('readwrite',s=>s.delete(k))}})();
async function storePhoto(file){const u=await shrink(file,1200,'url');if(MODE!=='db')return u;
  const id='dev_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);PH[id]=u;await pdb.put(id,u);return id}
function photoSrc(p){if(!p)return '';p=String(p);if(p.startsWith('data:'))return p;if(PH[p])return PH[p];
  if(!phLoading.has(p)&&(p.startsWith('dev_')||p.startsWith('g_'))){phLoading.add(p);
    (async()=>{let v=await pdb.get(p);if(!v&&p.startsWith('g_')&&CONN){try{const r=await api('GET',{action:'photoGet',id:p.slice(2)},60000);v=`data:${r.mime||'image/jpeg'};base64,${r.b64}`;pdb.put(p,v)}catch(e){}}
      if(v){PH[p]=v;rerender()}})()}
  return p.startsWith('dev_')||p.startsWith('g_')?PH_WAIT:''}
async function dropPhoto(old,keep){if(!old||old===keep||D.logs.some(l=>l.photo===old)||(D.checks||[]).some(c=>c.pic&&c.pic.a===old))return;old=String(old);
  if(old.startsWith('dev_'))pdb.del(old);else if(old.startsWith('g_')&&CONN)api('POST',{action:'photoDel',id:old.slice(2)}).catch(()=>{})}
function photoErr(e){const c=e&&e.code;
  return c==='decode'?'이 사진은 읽을 수 없어요. JPG나 PNG로 시도해 주세요.':c==='too_large'?'사진이 너무 커요.':c==='quota_or_state'?'사진 저장 공간이 가득 찼어요. 사진 ZIP으로 백업한 뒤 정리해 주세요.':
    c==='no_assets'?'사진을 저장하려면 저장소 연결이 필요해요.':c==='rate_limited'?'잠시 후 다시 시도해 주세요.':'사진을 저장하지 못했어요. 다시 시도해 주세요.'}
async function bulkPhotos(files){
  toast('사진 저장 중…');let hit=0,miss=0;files.sort((a,b)=>a.lastModified-b.lastModified);
  for(const f of files){const day=ymd(new Date(f.lastModified));const l=D.logs.filter(x=>x.date===day).sort((a,b)=>!!a.photo-!!b.photo)[0];
    if(!l){miss++;continue}try{const old=l.photo;l.photo=await storePhoto(f);hit++;dropPhoto(old,l.photo)}catch(e){miss++}}
  save();render();toast(`${hit}장을 날짜에 맞춰 붙였어요${miss?` · ${miss}장은 그날 운동 기록이 없어요`:''}`);
}
boot();
</script>
