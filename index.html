<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>저널 연결 확인</title>
<style>body{font:16px -apple-system,sans-serif;max-width:560px;margin:24px auto;padding:0 16px;color:#1c2320;background:#f3f5f2}
input,button{font:inherit;width:100%;box-sizing:border-box;padding:10px;margin:6px 0;border:1px solid #d8ded7;border-radius:10px}
button{background:#2f6f5e;color:#fff;border:0}pre{background:#fff;padding:12px;border-radius:10px;white-space:pre-wrap;word-break:break-all}</style></head><body>
<h1>저널 연결 확인</h1>
<p>웹 앱 주소와 TOKEN은 이 기기에만 저장됩니다(코드에는 들어가지 않음).</p>
<input id="url" placeholder="웹 앱 URL (…/exec)"><input id="token" placeholder="TOKEN">
<button id="save">이 기기에 저장</button>
<button id="read">① 읽기 확인 (테스트 시트 meta)</button>
<button id="write">② 저장 확인 (테스트 시트 meta에 한 줄)</button>
<pre id="out">결과가 여기에 표시됩니다.</pre>
<script>
const $ = id => document.getElementById(id), out = t => $('out').textContent = t;
const get = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
$('url').value = get('jnl_url'); $('token').value = get('jnl_token');
$('save').onclick = () => {
  try { localStorage.setItem('jnl_url', $('url').value.trim()); localStorage.setItem('jnl_token', $('token').value.trim()); out('저장했습니다.'); }
  catch (e) { out('이 브라우저에서는 저장이 안 됩니다: ' + e); }
};
async function call(params, body) {
  const url = $('url').value.trim(), token = $('token').value.trim();
  if (!/\/exec$/.test(url)) return out('웹 앱 URL은 /exec 로 끝나야 합니다.');
  if (!token) return out('TOKEN을 입력하세요.');
  out('요청 중…');
  try {
    const res = body
      ? await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, token }) })
      : await fetch(url + '?' + new URLSearchParams({ ...params, token }));
    const j = await res.json();
    out((j.ok ? '✅ 성공\n' : '❌ 실패\n') + JSON.stringify(j, null, 2));
  } catch (e) {
    out('❌ 연결 오류: ' + e.message + '\n(주소가 맞는지, 배포의 액세스 권한이 "모든 사용자"인지 확인)');
  }
}
$('read').onclick = () => call({ action: 'list', col: 'meta', env: 'test' });
$('write').onclick = () => call(null, { action: 'upsert', col: 'meta', env: 'test',
  records: [{ id: 'from_pages', updatedAt: new Date().toISOString(), data: { msg: 'GitHub Pages에서 저장' } }] });
</script></body></html>
