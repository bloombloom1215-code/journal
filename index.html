<style>
/* Layout: tablet (≥768×600) = full-height calendar with text chips + day drawer; phone = daily / weekly to-do agenda + bottom tabs */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#eaeee9; --line:#d8ded7;
  --fg:#1c2320; --muted:#5f6b65; --accent:#2f6f5e; --accent-fg:#ffffff; --accent-soft:#d8ebe3;
  --pay:#b8640f; --expire:#c2364a; --care:#6a4fbd; --event:#2b66ad; --ok:#2c7a4b; --warn:#a96d12; --bad:#c2364a;
  --sun:#c2364a; --sat:#2b66ad; --sleep:#5d6b8f;
  --shadow:0 10px 30px rgba(20,30,25,.16);
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --f-display:"Gowun Batang","AppleMyungjo","Noto Serif KR",serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --surface:#1a211e; --surface-2:#222b27; --line:#313c37;
  --fg:#e5ebe7; --muted:#9aa7a0; --accent:#6cc0a6; --accent-fg:#0d1311; --accent-soft:#1e3830;
  --pay:#e6a35c; --expire:#ee7d8e; --care:#ab98ef; --event:#7eaae6; --ok:#6cc58f; --warn:#e0b45a; --bad:#ee7d8e;
  --sun:#ee7d8e; --sat:#7eaae6; --sleep:#9aa6c8; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1a211e; --surface-2:#222b27; --line:#313c37;
  --fg:#e5ebe7; --muted:#9aa7a0; --accent:#6cc0a6; --accent-fg:#0d1311; --accent-soft:#1e3830;
  --pay:#e6a35c; --expire:#ee7d8e; --care:#ab98ef; --event:#7eaae6; --ok:#6cc58f; --warn:#e0b45a; --bad:#ee7d8e;
  --sun:#ee7d8e; --sat:#7eaae6; --sleep:#9aa6c8; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + var(--sab))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 입력칸 초록 테두리는 칸 안쪽에 그림 → 스크롤 칸 가장자리에서 잘리지 않음 */
input:focus,input:focus-visible,textarea:focus,textarea:focus-visible,select:focus,select:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;width:100%}

/* ===== Header + tabs ===== */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 14px;flex-wrap:wrap}
.top h1{font-family:var(--f-display);font-weight:700;font-size:1.5rem;margin:0;line-height:1.2;text-wrap:balance}
.top .sub{color:var(--muted);font-size:.85rem}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.warn i{background:var(--warn)}
.topright{display:flex;align-items:center;gap:14px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + var(--sab)) max(10px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tabs button{border:0;background:none;padding:6px 0;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted)}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}

@media (min-width:768px) and (min-height:600px){
  body{padding-block:0 max(12px,var(--sab))}
  .wrap{max-width:none}
  .top{align-items:center;padding-block:10px 10px}
  .top h1{font-size:1.15rem}
  .top .ttl{display:flex;align-items:baseline;gap:12px}
  .tabs{position:static;padding:0;border:0;background:none}
  .tabs .in{display:flex;gap:4px;max-width:none;margin:0}
  .tabs button{flex-direction:row;gap:6px;padding:6px 12px;font-size:.88rem}
  .tabs button svg{width:18px;height:18px}
  .tabs button[aria-current="page"]{background:var(--accent-soft)}
  body.fill{height:100%;display:flex;flex-direction:column;overflow:hidden}
  body.fill main{flex:1;min-height:0;display:flex;flex-direction:column}
}

.notice{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.82rem;color:var(--muted);margin-bottom:10px}

/* ===== Generic ===== */
.grid{display:grid;gap:16px}
@media (min-width:820px){.grid.two{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h2 .link{letter-spacing:0;text-transform:none;font-size:.85rem;color:var(--accent);background:none;border:0;padding:0;font-weight:500}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.ev{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .mark{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c)}
.ev .mark.hollow{background:transparent;border:2px solid var(--c)}
.ev .t{flex:1;min-width:0;overflow-wrap:anywhere}
.ev .t small{display:block;color:var(--muted);font-size:.78rem}
.ev .amt{font-size:.85rem;white-space:nowrap}
.empty{color:var(--muted);font-size:.9rem;padding:4px 0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;
  color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent)}
.p-ok{--pc:var(--ok)} .p-warn{--pc:var(--warn)} .p-bad{--pc:var(--bad)} .p-muted{--pc:var(--muted)}
.tag{font-size:.72rem;color:var(--c,var(--muted));border:1px solid currentColor;border-radius:6px;padding:0 6px;white-space:nowrap}
.stat{display:flex;flex-wrap:wrap;gap:18px 28px}
.stat b{display:block;font-size:1.35rem;font-weight:500}
.stat span{font-size:.8rem;color:var(--muted)}
.care{display:grid;gap:10px}
@media (min-width:560px){.care{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ccard{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ccard .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ccard .name{font-weight:600;overflow-wrap:anywhere}
.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--pc);border-radius:99px}
.ccard .meta{font-size:.8rem;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:.88rem;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.05rem;flex:none}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:8px;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hint{font-size:.76rem;color:var(--muted)}

/* ===== Calendar head ===== */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:8px;flex-wrap:wrap}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.calhead .title{font-family:var(--f-display);font-size:1.3rem;font-weight:700;padding:0 4px;min-width:0}
.spend{font-size:.82rem;color:var(--muted);white-space:nowrap}
.spend b{color:var(--fg);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:.72rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:2px;background:color-mix(in srgb,var(--c) 22%,transparent);border-left:3px solid var(--c)}
.legend i.hollow{background:transparent;border:1px dashed var(--c);border-left:3px solid var(--c)}

/* ===== Calendar body ===== */
.calwrap{display:flex;flex-direction:column;min-height:0}
body.fill .calwrap{flex:1}
.calbody{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:auto repeat(var(--weeks),minmax(var(--rowmin,96px),1fr));min-height:100%}
.month .dow{font-size:.72rem;text-align:center;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:1}
.month .dow.sun{color:var(--sun)} .month .dow.sat{color:var(--sat)}
.cell{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);padding:4px 4px 3px;
  display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;min-height:0;overflow:hidden;position:relative}
.cell:nth-child(7n+7){border-right:0}
.cell:hover{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.cell.out{background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
.cell.out .chead,.cell.out .items{opacity:.5}
div.cell{text-align:left;cursor:pointer;display:flex;flex-direction:column;min-width:0;font:inherit;color:inherit}
div.cell:hover{background:color-mix(in srgb,var(--accent) 4%,var(--surface))}
div.cell:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cell .dn{cursor:pointer}.cell .dn:hover{box-shadow:0 0 0 1.5px var(--accent) inset}
.cell .ci[data-act]{cursor:pointer}.cell .ci[data-act]:hover{filter:brightness(.95);box-shadow:0 0 0 1px var(--c) inset}
.cell .more[data-act]{cursor:pointer;text-decoration:underline}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.chead{display:flex;align-items:center;gap:4px;min-height:24px}
.dn{font-size:.85rem;font-weight:500;min-width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cell.sun .dn{color:var(--sun)} .cell.sat .dn{color:var(--sat)}
.cell.today .dn{background:var(--accent);color:var(--accent-fg)!important}
.badges{margin-left:auto;display:flex;gap:4px;align-items:center;color:var(--muted);font-size:.68rem}
.badges svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8}
.items{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:2px;position:relative}
.more{font-size:.68rem;color:var(--muted);padding-left:4px;line-height:1.2}

.ci{display:block;font-size:.74rem;line-height:1.4;padding:0 5px;border-radius:4px;border-left:3px solid var(--c);
  background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;min-width:0;text-align:left;color:var(--fg)}
.ci em{font-style:normal;font-family:var(--f-num);font-size:.92em;color:var(--muted);margin-left:3px}
.ci.hollow{background:transparent;border:1px dashed var(--c);border-left:3px solid var(--c)}
.ci.plan{display:block;--c:var(--muted);background:var(--surface-2);border-left-width:0;padding-left:4px}
.ci.plan.done{color:var(--muted);text-decoration:line-through}
.ci.flag{--c:var(--accent)}
@media (min-width:1000px){.ci{font-size:.8rem}}
@media (max-width:767px),(max-height:599px){
  .month{--rowmin:70px}
  .ci{font-size:.64rem;padding:0 3px;border-left-width:2px}
  .ci em{display:none}
  .dn{font-size:.78rem;min-width:22px;height:22px}
  .badges{display:none}
}

/* Wide week */
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:100%}
.wcol{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
.wcol:last-child{border-right:0}
.wcol.today{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.wh{border:0;border-bottom:1px solid var(--line);background:none;padding:8px 8px;display:flex;align-items:baseline;gap:6px;text-align:left}
.wh span{font-size:.78rem;color:var(--muted)}
.wh b{font-size:1.2rem;font-weight:500}
.wcol.today .wh b{color:var(--accent)}
.wcol.sel .wh{box-shadow:inset 0 -2px 0 var(--accent)}
.wbody{flex:1;overflow:auto;padding:8px 6px;display:flex;flex-direction:column;gap:4px}
.wbody .ci{white-space:normal;line-height:1.35;padding:3px 6px;cursor:pointer;border-top:0;border-right:0;border-bottom:0}
.wbody .ci.hollow{border:1px dashed var(--c);border-left:3px solid var(--c)}
.wbody .ci em{display:block;margin-left:0}
.mini-plan{display:flex;gap:6px;align-items:flex-start;font-size:.8rem;padding:2px 2px}
.mini-plan input{width:16px;height:16px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.mini-plan.done span{color:var(--muted);text-decoration:line-through}
.addmini{border:1px dashed var(--line);background:none;border-radius:8px;font-size:.78rem;color:var(--muted);padding:4px;margin-top:4px}

/* ===== Drawer ===== */
.dscrim{position:fixed;inset:0;z-index:30;background:rgba(10,15,12,.28)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:31;background:var(--surface);box-shadow:var(--shadow);overflow:auto;
  padding:calc(14px + var(--safet)) max(18px,env(safe-area-inset-right,0px)) calc(24px + var(--sab)) 18px}
.drawer .dtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
@media (prefers-reduced-motion:no-preference){.drawer.enter{animation:slide .22s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.5}}}

/* ===== Day content ===== */
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.dayhead h3{font-family:var(--f-display);font-size:1.25rem;margin:0}
.mode{font-size:.75rem;letter-spacing:.06em;color:var(--accent);font-weight:600}
.sublabel{font-size:.78rem;color:var(--muted);font-weight:600;margin:14px 0 6px;letter-spacing:.04em}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.plan li{display:flex;align-items:center;gap:8px;min-height:34px}
.plan li label{flex:1;display:flex;gap:10px;align-items:center;min-width:0;overflow-wrap:anywhere}
.plan li.done label span{color:var(--muted);text-decoration:line-through}
.plan input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.x{border:0;background:none;color:var(--muted);font-size:1.1rem;padding:0 6px}
.addrow{display:flex;gap:6px;margin-top:6px}
.field,.addrow input,textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;min-width:0}
textarea.diary{min-height:130px;resize:vertical;font-family:var(--f-display);font-size:1rem;line-height:1.75}
.cond{display:flex;gap:6px}
.cond button{width:40px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.cond button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.85rem;background:var(--surface)}
.toggle[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg);font-weight:600}

/* ===== Phone agenda ===== */
.agtop{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.agnav{display:flex;align-items:center;gap:8px}
.agnav .title{flex:1;text-align:center;font-family:var(--f-display);font-size:1.15rem;font-weight:700;border:0;background:none;padding:4px}
.agnav .title small{display:block;font-family:var(--f-body);font-size:.75rem;font-weight:500;color:var(--accent)}
.alerts .ev{padding:6px 0}
.wsum{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-bottom:10px}
.wsum b{color:var(--fg);font-weight:500}
.dcard{padding:12px 14px}
.dcard.today{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.dcard.quiet{padding:8px 14px;background:transparent}
.dch{display:flex;align-items:baseline;gap:8px;width:100%;border:0;background:none;padding:0 0 4px;text-align:left}
.dch b{font-size:1.05rem;font-weight:600}
.dch span{font-size:.8rem;color:var(--muted)}
.dch .go{margin-left:auto;color:var(--muted);font-size:.8rem}
.dcard .plan li{min-height:30px}

/* ===== Weekly timetable ===== */
.calbody.ttmode{display:flex;flex-direction:column;overflow:hidden;--gut:46px}

/* ========= 기본 도구 ========= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; };
const dayDiff = (a,b) => Math.round((parse(a) - parse(b)) / 86400000);
const DOW = ['일','월','화','수','목','금','토'];
const won = n => (Number(n)||0).toLocaleString('ko-KR') + '원';
const comma = n => (Number(n)||0).toLocaleString('ko-KR');
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g,'').slice(0,20);
/* 하루 시작 기준: 이 시각 전(예: 새벽 2시)은 전날로 봄. 설정에서 바꿈. 같은 기기의 운동 앱 등도 jnl_daycut 으로 같은 기준 사용 */
const dayCut = () => { let v; try{ v = S.dayCut; }catch(e){} if (v == null){ const l = parseInt(localStorage.getItem('jnl_daycut'), 10); v = isNaN(l) ? 300 : l; } return v; };
const logicalNow = () => new Date(Date.now() - dayCut() * 60000);
const todayStr = () => ymd(logicalNow());
function syncDayCut(){ try{ localStorage.setItem('jnl_daycut', String(dayCut())); }catch(e){} }
const fmtDay = k => { const d = parse(k); return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`; };
const weekStart = k => { const d = parse(k); return addDays(d, -((d.getDay()+6)%7)); }; // 월요일 시작
const hm = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;

const TYPES = {

  sleep:{label:'수면', c:'var(--sleep)'}, meal:{label:'식사', c:'var(--pay)'}, work:{label:'일·프로젝트', c:'var(--event)'},

const chains = {};
function enqueue(path, fn){

    if (e && e.code === 'quota_exceeded') toast('저장 공간이 가득 찼습니다. 오래된 기록을 정리해 주세요.');
    else if (e && e.code === 'invalid_argument') toast('저장 권한이 없어 저장하지 못했습니다.');
    else toast('저장하지 못했습니다. 잠시 후 다시 시도해 주세요.');
    setSync('warn','저장 실패');

/* 컬렉션 ↔ 화면 상태 연결 */
const OBJ_COLS = ['items','logs','days','blocks','series','mtasks','projects','templates'];
const colGet = col => {
  if (OBJ_COLS.includes(col)) return S[col] || {};
  if (col === 'todos') return Object.fromEntries((S.todos||[]).map(t => [t.id, t]));
  if (col === 'exceptions') return Object.fromEntries((S.exPeriods||[]).map(p => [p.id, p]));
  if (col === 'ephotos') return Object.fromEntries(Object.entries(S.ePhotos||{}).map(([k, v]) => [k, { ids:(v||[]).filter(x => !isTmpPhoto(x)) }]));

};
const colSet = (col, id, v) => {
  if (OBJ_COLS.includes(col)){ S[col] = { ...(S[col]||{}), [id]: v }; return; }
  if (col === 'todos'){ const a = (S.todos||[]).filter(t => t.id !== id); a.push({ ...v, id }); S.todos = a; return; }
  if (col === 'exceptions'){ const a = (S.exPeriods||[]).filter(p => p.id !== id); a.push({ ...v, id }); S.exPeriods = a; return; }
  if (col === 'ephotos'){ S.ePhotos = { ...(S.ePhotos||{}), [id]: (v && v.ids) || [] }; return; }

const colDel = (col, id) => {
  if (OBJ_COLS.includes(col)){ const n = { ...(S[col]||{}) }; delete n[id]; S[col] = n; return; }
  if (col === 'todos') S.todos = (S.todos||[]).filter(t => t.id !== id);
  if (col === 'exceptions') S.exPeriods = (S.exPeriods||[]).filter(p => p.id !== id);
  if (col === 'ephotos'){ const n = { ...(S.ePhotos||{}) }; delete n[id]; S.ePhotos = n; }
};
function snapshotAll(){ const out = {}; SYNC_COLS.forEach(c => { out[c] = {}; Object.entries(colGet(c)).forEach(([id, v]) => { out[c][id] = JSON.stringify(v); }); }); return out; }

    SYNC_COLS.forEach(c => Object.entries(j.snap[c] || {}).forEach(([id, str]) => { try { colSet(c, id, JSON.parse(str)); } catch(e){} }));
    SAVED = {}; SYNC_COLS.forEach(c => SAVED[c] = (j.saved && j.saved[c]) || {}); lastSync = j.lastSync || null; return true;
  } catch(e){ return false; }
}
async function api(method, payload, timeoutMs = 45000){
  if (!CONN) throw new Error('연결 안 됨');
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const body = { ...payload, token:CONN.token, env:CONN.env };
    const res = method === 'GET'
      ? await fetch(CONN.url + '?' + new URLSearchParams({ ...body, _t:Date.now() }), { signal:ctl.signal, cache:'no-store' }) // 일부 브라우저(삼성인터넷 등)가 예전 응답을 재사용하지 않도록
      : await fetch(CONN.url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(body), signal:ctl.signal });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || '요청 실패');
    return j;
  } finally { clearTimeout(tm); }
}
function syncLabel(){
  if (!CONN) return setSync('warn', '이 기기에만 저장');
  if (syncErr) return setSync('warn', navigator.onLine === false ? '오프라인 · 연결되면 저장' : '저장 실패 · 다시 시도 중');
  if (pushing || pulling) return setSync('', pushing ? '저장 중…' : '불러오는 중…');
  const dirty = hasDirty();
  setSync(dirty ? '' : 'ok', dirty ? '저장 대기' : (CONN.env === 'test' ? '저장됨 · 테스트' : '저장됨'));
}
function hasDirty(snap){ snap = snap || snapshotAll(); return SYNC_COLS.some(c => Object.keys(snap[c]).some(id => snap[c][id] !== SAVED[c][id]) || Object.keys(SAVED[c]).some(id => !(id in snap[c]))); }

/* 구글 시트가 '2026-11-18'(날짜 id)·시각 글자를 날짜 서식으로 바꿔 버리는 문제 대비:
   시트에는 날짜 id를 'd:2026-11-18', 시각을 't2026-…'로 저장(글자로 시작해서 시트가 바꾸지 않음) */
const sheetId = (c, id) => c === 'days' ? 'd:' + id : id;
function normDay(id){ id = String(id); if (/^\d{4}-\d{2}-\d{2}$/.test(id)) return id; const t = Date.parse(id); return isNaN(t) ? null : ymd(new Date(t)); }
const tOf = v => { const t = Date.parse(String(v || '').replace(/^t/, '')); return isNaN(t) ? 0 : t; };
function fixDaysRows(rows){ // 'd:' 줄이 우선, 없으면 예전 줄(날짜로 바뀐 것 포함) 중 가장 최신
  const dmap = {}, legacy = {};
  (rows || []).forEach(r => { const id = String(r.id);
    if (id.startsWith('d:')) dmap[id.slice(2)] = { ...r, id:id.slice(2) };
    else { const k = normDay(id); if (k && (!legacy[k] || tOf(legacy[k].updatedAt) <= tOf(r.updatedAt))) legacy[k] = { ...r, id:k }; } });
  return { rows: Object.keys({ ...legacy, ...dmap }).map(k => dmap[k] || legacy[k]), has: dmap };
}
async function pushNow(){
  const snap = snapshotAll(); writeCache(snap);
  if (!CONN || pushing || !S.loaded) { syncLabel(); return; }
  const now = new Date().toISOString(), batches = {};
  SYNC_COLS.forEach(c => {
    Object.keys(snap[c]).forEach(id => { if (snap[c][id] !== SAVED[c][id]) (batches[c] = batches[c] || []).push({ id, updatedAt:now, deleted:false, data:JSON.parse(snap[c][id]), _s:snap[c][id] }); });
    Object.keys(SAVED[c]).forEach(id => { if (!(id in snap[c])) (batches[c] = batches[c] || []).push({ id, updatedAt:now, deleted:true, data:{}, _s:null }); });
  });
  const cols = Object.keys(batches); if (!cols.length){ syncErr = null; syncLabel(); return; }
  pushing = true; syncLabel();
  try {
    for (const c of cols){
      for (let i = 0; i < batches[c].length; i += 200){ // 너무 큰 요청 방지
        const part = batches[c].slice(i, i + 200);
        await api('POST', { action:'upsert', col:c, records:part.map(({ _s, ...r }) => ({ ...r, id:sheetId(c, r.id), updatedAt:'t' + r.updatedAt })) });
        part.forEach(r => { if (r.deleted) delete SAVED[c][r.id]; else SAVED[c][r.id] = r._s; });
      }
    }
    syncErr = null; lastSync = now; writeCache();

}
async function pullAll(quiet){
  if (!CONN || pulling) return false;
  pulling = true; if (!quiet) syncLabel();
  try {
    const j = await api('GET', { action:'listAll' });
    const snap = snapshotAll(); let changed = false, hasSettings = false;
    const fd = fixDaysRows(j.cols.days); j.cols.days = fd.rows;
    SYNC_COLS.forEach(c => (j.cols[c] || []).forEach(r => {
      if (c === 'meta' && r.id !== 'settings') return;
      if (c === 'meta') hasSettings = !r.deleted;
      const inLocal = r.id in snap[c], firstSettings = c === 'meta' && SAVED.meta.settings === undefined;
      if (!firstSettings){
        if (inLocal && snap[c][r.id] !== SAVED[c][r.id]) return; // 이 기기에서 아직 안 올린 변경 → 내 쪽 유지 (올라가면 서버가 더 최신인지 판단)
        if (!inLocal && SAVED[c][r.id] !== undefined && !r.deleted) return; // 이 기기에서 지운 뒤 아직 안 올림 → 지운 상태 유지
      }
      if (r.deleted){ if (r.id in snap[c]){ colDel(c, r.id); changed = true; } delete SAVED[c][r.id]; return; }
      const str = JSON.stringify(r.data);
      if (snap[c][r.id] !== str){ colSet(c, r.id, r.data); changed = true; }
      SAVED[c][r.id] = JSON.stringify(colGet(c)[r.id]);
    }));
    Object.keys(S.days).forEach(k => { if (!/^\d{4}-\d{2}-\d{2}$/.test(k)){ delete S.days[k]; delete SAVED.days[k]; } });
    Object.keys(S.days).forEach(k => { if (!fd.has[k]) delete SAVED.days[k]; }); // 아직 새 형식('d:')으로 시트에 없는 날 → 올림
    if (!hasSettings) delete SAVED.meta.settings; // 시트에 설정이 없으면 이 기기 설정을 올림
    try { wkLoad(j.cols); wkCache(); if (wkSync()) changed = true; } catch(e){ console.error('운동 앱 연동', e); }
    syncErr = null; lastSync = new Date().toISOString(); writeCache();

  } catch(e){ syncErr = e; return false; }

}
const store = {
  set(col, id, data){
    if (col === 'blocks' && String(id).startsWith('wk:')) wkOnSet(id, data);
    clearAutoCache();
    const body = { ...data, updatedAt:new Date().toISOString() };
    S[col] = { ...S[col], [id]: body };
    schedulePush(); return Promise.resolve();
  },
  del(col, id){
    if (col === 'blocks' && String(id).startsWith('wk:')) wkOnDel(id);
    clearAutoCache();
    const next = { ...S[col] }; delete next[id]; S[col] = next;
    schedulePush(); return Promise.resolve();
  }
};
/* 사진: 드라이브 '사진' 폴더에 저장, 화면에는 이 기기 캐시(IndexedDB)에서 보여 줌 */
const PHOTO = {}, photoLoading = new Set();
const PH_PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><rect width="10" height="10" fill="#e3e8e4"/></svg>');

  return { get: async k => { try { const db = await open(); return await new Promise(res => { const q = db.transaction('p').objectStore('p').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch(e){ return null; } },

function photoSrc(pid){
  if (PHOTO[pid]) return PHOTO[pid];
  if (!photoLoading.has(pid) && !isTmpPhoto(pid)){ photoLoading.add(pid);
    (async () => { let v = await pdb.get(pid);
      if (!v && CONN){ try { const r = await api('GET', { action:'photoGet', id:pid }, 60000); v = `data:${r.mime || 'image/jpeg'};base64,${r.b64}`; pdb.put(pid, v); } catch(e){} }
      if (v){ PHOTO[pid] = v; render(); } else photoLoading.delete(pid); })(); }

/* ========= 계산 ========= */
const activeItems = () => Object.entries(S.items).map(([id,v])=>({...v,id})).filter(i=>!i.archived);
function careStat(it){
  const today = todayStr();
  const dates = Object.values(S.logs).filter(l=>l.itemId===it.id && l.date).map(l=>l.date).sort();
  const target = Number(it.targetDays)||0, last = dates[dates.length-1] || null;
  let next = null, left = null, since = null, avg = null;
  if (last){ since = dayDiff(today, last); if (target){ next = ymd(addDays(parse(last), target)); left = dayDiff(next, today); } }
  if (dates.length >= 2){ let sum = 0; for (let i=1;i<dates.length;i++) sum += dayDiff(dates[i], dates[i-1]); avg = Math.round(sum/(dates.length-1)); }
  return { last, next, left, since, avg, count:dates.length, target };
}
function careState(st){
  if (!st.last) return { cls:'p-muted', text:'기록 없음' };
  if (st.left === null) return { cls:'p-muted', text:`${st.since}일 전 방문` };
  if (st.left < 0) return { cls:'p-bad', text:`${-st.left}일 지남` };
  if (st.left <= 7) return { cls:'p-warn', text: st.left===0 ? '오늘 권장' : `${st.left}일 남음` };
  return { cls:'p-ok', text:`${st.left}일 남음` };
}
function occurrences(startK, endK, opts={}){
  const map = {}; const push = (k,e)=>{ (map[k]=map[k]||[]).push(e); };
  const items = activeItems();
  for (let d = parse(startK); ymd(d) <= endK; d = addDays(d,1)){
    const k = ymd(d), dim = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    for (const it of items){
      if (it.type === 'recurring'){
        if (it.startDate && k < it.startDate) continue;
        if (it.endDate && k > it.endDate) continue;
        const day = Math.min(Number(it.day)||1, dim);
        let hit = false;
        if (it.freq === 'weekly') hit = d.getDay() === Number(it.weekday||0);
        else if (it.freq === 'yearly') hit = (d.getMonth()+1) === Number(it.month||1) && d.getDate() === day;
        else hit = d.getDate() === day;
        if (hit) push(k, {kind:'pay', it, amount:Number(it.amount)||0});
      } else if (it.type === 'deadline' && it.due === k) push(k, {kind:'expire', it});
      else if (it.type === 'event' && it.date === k) push(k, {kind:'event', it});
    }
  }
  for (const it of items.filter(i=>i.type==='interval')){
    const st = careStat(it);
    if (st.next && st.next >= startK && st.next <= endK) push(st.next, {kind:'care', it});
  }
  if (!opts.noVisits){
    for (const [id,l] of Object.entries(S.logs)){
      const it = S.items[l.itemId]; if (!it || !l.date) continue;
      if (l.date >= startK && l.date <= endK) push(l.date, {kind:'visit', it:{...it,id:l.itemId}, log:{...l,id}, amount:Number(l.amount)||0});
    }
  }

  Object.values(map).forEach(a=>a.sort((x,y)=> (order[x.kind]-order[y.kind]) || String(x.it.time||'').localeCompare(String(y.it.time||''))));
  return map;
}
function spendBetween(s, e){ let total = 0, n = 0; Object.values(occurrences(s, e, {noVisits:true})).flat().forEach(ev=>{ if(ev.kind==='pay'){ total += ev.amount; n++; } }); return {total, n}; }

  const banner = !CONN ? `<div class="notice">구글 시트 저장소가 아직 연결되지 않았어요. 지금 입력한 내용은 이 기기에만 저장돼요. <button class="btn sm" data-act="go-conn">설정에서 연결하기</button></div>` : (CONN.env === 'test' ? `<div class="notice">테스트 시트에 연결되어 있어요. 실제로 쓰려면 설정에서 '실사용'으로 바꾸세요.</div>` : '');
  const tts = $('#ttscroll'); if (tts && !S.ttFit) S.ttScroll = tts.scrollTop;
  const view = S.tab==='home' ? (wide ? viewWide() : viewPhone()) : S.tab==='archive' ? viewArchive() : viewSettings();
  main.innerHTML = banner + view + (wide ? '' : wpSheet()); // 운동 계획 창: 태블릿은 각 보기 안에서, 휴대폰은 여기서
  window.scrollTo(0, scroll);
  const tt2 = $('#ttscroll');
  if (tt2 && S.ttFit && !isWide()){ tt2.closest('.calbody').style.height = Math.max(320, window.innerHeight - 92) + 'px'; }
  if (tt2 && S.ttFit){ const want = Math.max(10, Math.floor((tt2.clientHeight - 4) / HRS())); tt2.scrollTop = 0;
    if (want !== S.fitHp && !S.fitting){ S.fitHp = want; S.fitting = true; doRender(); S.fitting = false; } }
  else if (tt2) tt2.scrollTop = S.ttScroll ?? 0;
  const dpan = $('.dayw-tt'), dtt = dpan && dpan.querySelector('.dtt');
  if (dtt && !S.fitting){ const cs = getComputedStyle(dpan), other = [...dpan.children].filter(c => c !== dtt).reduce((h, c) => h + c.offsetHeight + parseFloat(getComputedStyle(c).marginTop||0) + parseFloat(getComputedStyle(c).marginBottom||0), 0) + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    const want = Math.max(20, Math.floor((dpan.clientHeight - other - 2 - 20) / HRS()));
    if (want !== S.dayFitHp){ S.dayFitHp = want; S.fitting = true; doRender(); S.fitting = false; } }
  const dr = $('.drawer'); if (dr && !S.drawerEnter) dr.scrollTop = dScroll;
  S.drawerEnter = false;
  requestAnimationFrame(fitCells);
}

/* 칸에 다 안 들어가는 항목은 숨기고 +N 표시 */
function fitCells(){
  /* 읽기·쓰기를 단계별로 모아서 레이아웃 계산을 2번만 하도록 (칸마다 반복 계산하면 아이패드에서 느려짐) */
  const cells = [...document.querySelectorAll('.cell')].map(cell => ({ box:cell.querySelector('.items'), more:cell.querySelector('.more') })).filter(c => c.box && c.more);
  cells.forEach(c => { c.kids = [...c.box.children]; c.kids.forEach(k => k.hidden = false); c.more.hidden = true; });
  const over = c => { const H = c.box.clientHeight; return c.kids.filter(k => k.offsetTop + k.offsetHeight > H + 1); };
  const first = cells.map(c => ({ c, o:over(c) })).filter(x => x.o.length);
  first.forEach(({ c }) => { c.more.hidden = false; });
  const second = first.map(({ c }) => ({ c, o:over(c) }));
  second.forEach(({ c, o }) => { o.forEach(k => k.hidden = true); if (o.length) c.more.textContent = `+${o.length}개 더`; else c.more.hidden = true; });
}
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.tab==='home' && (S.ttFit || (isWide() && S.vw==='day'))) doRender(); fitCells(); }, 120); });
WIDE.addEventListener ? WIDE.addEventListener('change', () => doRender()) : WIDE.addListener(() => doRender());

/* 캘린더 칸 안의 내용 (점 대신 글자) */
function chipList(k, evs, day, interactive){
  const tagName = interactive ? 'button' : 'span';
  const out = evs.map(ev => {
    const it = ev.it, k2 = KIND[ev.kind];
    let text = esc(it.title).replace(/^\(예시\)\s*/, '');
    if (ev.kind==='care') text = '권장 · ' + text;
    if (ev.kind==='visit') text = text + ' 방문';
    if (ev.kind==='expire') text = '만료 · ' + text;
    if (ev.kind==='event' && it.time) text = `<em style="margin:0 3px 0 0">${esc(it.time)}</em>` + text;
    const amt = (ev.kind==='pay' || (ev.kind==='visit' && ev.amount)) ? `<em>${comma(ev.amount)}</em>` : '';
    const act = interactive ? ` type="button" data-act="edit" data-id="${it.id}"` : ` role="button" data-act="edit" data-id="${it.id}"`;
    return `<${tagName} class="ci ${k2.hollow?'hollow':''}" style="--c:${k2.color}"${act} title="${esc(it.title)}">${text}${amt}</${tagName}>`;
  });
  if (day.workout && !blocksOn(k).some(b => b.planId && b.done)) out.push(`<span class="ci flag" role="button" data-act="open-day" data-date="${k}">운동 ✓</span>`);
  if (day.face) out.push(`<span class="ci flag" role="button" data-act="open-day" data-date="${k}">얼굴관리 ✓</span>`);
  if (!interactive) wpOn(k).forEach(w => out.push(wpChip(w, true)));
  if (!interactive) blocksOn(k).filter(b=>showOf(b)==='month').forEach(b =>
    out.push(b.routineId ? `<span class="ci wpr" role="button" data-act="wp-open" data-id="${b.id}" title="운동 앱 계획">${esc(dispTitle(b))}</span>`
      : `<span class="ci ${b.done?'plan done':''}" role="button" data-act="blk-open" data-id="${b.id}" style="--c:${(CAT[b.cat]||CAT.etc).c}"><em style="margin:0 3px 0 0">${hm(b.start)}</em>${esc(dispTitle(b))}</span>`));
  return out.join('');
}
const penIcon = `<svg viewBox="0 0 24 24" aria-label="다이어리"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>`;

function monthGrid(){
  const c = S.cursor, y = c.getFullYear(), m = c.getMonth();
  const first = new Date(y, m, 1), start = addDays(first, -((first.getDay()+6)%7));
  const last = new Date(y, m+1, 0), end = addDays(last, 6-((last.getDay()+6)%7));
  const weeks = Math.round((end - start)/86400000/7 + 1/7);
  const map = occurrences(ymd(start), ymd(end));
  let h = `<div class="month" style="--weeks:${weeks}">` + ['월','화','수','목','금','토','일'].map((d,i)=>`<div class="dow ${i===6?'sun':i===5?'sat':''}">${d}</div>`).join('');
  for (let d = start; ymd(d) <= ymd(end); d = addDays(d,1)){
    const k = ymd(d), day = gdv(k), evs = map[k]||[];
    const sel = isWide() ? S.drawer===k : false;
    const exP = exOn(k), exT = exP && exType(exP.type);
    const cls = ['cell', exP?'exd':'', d.getMonth()!==m?'out':'', k===ymd(new Date())?'today':'', sel?'sel':'', d.getDay()===0?'sun':'', d.getDay()===6?'sat':''].join(' ');
    const badges = (exT?`<span class="exb" title="${esc(exT.label)}">${esc(exT.emoji)}</span>`:'') + (day.diary?penIcon:'') + (day.cond.length?`<span class="cemo">${condEmojis(day.cond, 3)}</span>`:'');
    h += `<div class="${cls}" role="button" tabindex="0" data-act="month-cell" data-date="${k}" aria-label="${fmtDay(k)} · 빈 곳을 누르면 일정 추가">
      <span class="chead"><span class="dn num" role="button" data-act="open-day" data-date="${k}" title="${fmtDay(k)} 일간 보기">${d.getDate()}</span><span class="badges">${badges}</span></span>
      <span class="items">${chipList(k, evs, day, false)}</span><span class="more" data-act="open-day" data-date="${k}" hidden></span></div>`;
  }
  return h + '</div>';
}

function calHead(views){
  const wide = isWide();
  let title, spend;
  const v = wide ? S.vw : S.vn;
  if (v === 'year'){ const y0 = ymAdd(thisYM(), -1 + (S.yOff||0)); title = `${ymLabel(y0, true)} – ${ymLabel(ymAdd(y0, 11), true)}`; spend = spendBetween(y0+'-01', ymAdd(y0,1)+'-01'); }
  else if (v === 'day'){
    title = `${fmtDay(S.sel)}${S.sel===todayStr()?' · 오늘':''}`; spend = spendBetween(S.sel, S.sel);
  } else if (v === 'month'){
    const y = S.cursor.getFullYear(), m = S.cursor.getMonth();
    title = `${y}년 ${m+1}월`; spend = spendBetween(ymd(new Date(y,m,1)), ymd(new Date(y,m+1,0)));
  } else {
    const s = weekStart(S.sel), e = addDays(s,6);
    title = `${s.getMonth()+1}월 ${s.getDate()}일 – ${e.getMonth()===s.getMonth()?'':(e.getMonth()+1)+'월 '}${e.getDate()}일`;
    spend = spendBetween(ymd(s), ymd(e));
  }
  const seg = `<div class="seg" role="group" aria-label="보기">${views.map(([k,l])=>`<button data-act="view" data-v="${k}" aria-pressed="${v===k}">${l}</button>`).join('')}</div>`;
  const legend = v==='week' ? `<div class="legend">${Object.values(CAT).map(c=>`<span><i style="--c:${c.c}"></i>${c.label}</span>`).join('')}</div><button class="btn sm" data-act="range" title="시간표에 보일 시간대">일과 ${hm(DS())}–${hm(DE())}${outCount() ? ` · 밖 ${outCount()}개` : ''}</button><div class="seg fitseg" role="group" aria-label="시간표 보기"><button data-act="ttfit" data-v="0" aria-pressed="${!S.ttFit}" title="칸이 커서 입력하기 편함">입력용</button><button data-act="ttfit" data-v="1" aria-pressed="${!!S.ttFit}" title="24시간이 한 화면에">한눈에</button></div><button class="btn sm" data-act="wset-open">${WKIC}운동 자리</button><button class="btn sm" data-act="tpl-save">템플릿 저장</button><button class="btn sm" data-act="tpl-load">템플릿 불러오기</button>`
    : `<div class="legend">${['expire','event','pay','care'].map(k=>`<span><i class="${KIND[k].hollow?'hollow':''}" style="--c:${KIND[k].color}"></i>${KIND[k].label}</span>`).join('')}<span><i style="--c:var(--accent)"></i>운동·얼굴</span><span><i style="--c:var(--wkapp)"></i>운동 앱</span></div>`;
  const ADD = { day:['+ 할 일','add-day'], week:['+ 계획','add-week'], month:['+ 이달 할 일','add-month'], year:['+ 프로젝트','pj-new'] }[v];
  const spendHtml = v === 'year' ? '' : `<span class="spend">고정지출 <b class="num">${won(spend.total)}</b> · ${spend.n}건</span>`;
  if (!wide) return `<div class="calhead">
    <div class="nav"><button class="iconbtn" data-act="prev" aria-label="이전">‹</button><span class="title">${title}</span><button class="iconbtn" data-act="next" aria-label="다음">›</button>
      <button class="btn sm" data-act="goto-today">오늘</button></div>
    <div class="nav">${spendHtml}${seg}</div></div>`;
  // 아이패드: 첫 줄 = 이동 · 제목 | 보기 전환 · 추가(항상 오른쪽 끝), 둘째 줄 = 보기별 도구
  return `<div class="calhead wide">
    <div class="nav"><button class="iconbtn" data-act="prev" aria-label="이전">‹</button><span class="title">${title}</span><button class="iconbtn" data-act="next" aria-label="다음">›</button>
      <button class="btn sm" data-act="goto-today">오늘</button></div>
    <div class="nav headright">${seg}<button class="btn pri sm addbtn" data-act="${ADD[1]}">${ADD[0]}</button></div>
  </div>
  ${v === 'year' || v === 'day' ? '' : `<div class="toolrow">${legend}<span class="toolspacer"></span>${spendHtml}</div>`}`;
}

/* 오늘 챙길 것: 권장일 임박·지남, 만료 알림 */
function alertRows(){
  const t = todayStr(), rows = [];
  activeItems().forEach(it => {
    if (it.type==='interval'){ const st = careStat(it), s2 = careState(st);
      if (st.left !== null && st.left <= 3) rows.push(`<div class="ev"><span class="mark hollow" style="--c:var(--care)"></span><button class="t" data-act="edit" data-id="${it.id}" style="all:unset;flex:1;min-width:0;cursor:pointer">${esc(it.title)}<small>권장 주기 ${it.targetDays}일</small></button><span class="pill ${s2.cls}">${s2.text}</span><button class="btn sm" data-act="visit" data-id="${it.id}">방문함</button></div>`); }
    if (it.type==='deadline' && it.due){ const dd = dayDiff(it.due, t);
      if (dd > 0 && dd <= (Number(it.remindDays)||7)) rows.push(`<div class="ev"><span class="mark" style="--c:var(--expire)"></span><button class="t" data-act="edit" data-id="${it.id}" style="all:unset;flex:1;min-width:0;cursor:pointer">${esc(it.title)}<small>${fmtDay(it.due)} 만료</small></button><span class="pill p-warn">${dd}일 남음</span></div>`); }
  });
  // 3일 안에 빠져나갈 결제
  const occ = occurrences(ymd(addDays(parse(t),1)), ymd(addDays(parse(t),3)), {noVisits:true});
  Object.entries(occ).forEach(([dk, evs]) => evs.filter(ev => ev.kind==='pay').forEach(ev => { const dd = dayDiff(dk, t);
    rows.push(`<div class="ev"><span class="mark" style="--c:var(--pay)"></span><button class="t" data-act="edit" data-id="${ev.it.id}" style="all:unset;flex:1;min-width:0;cursor:pointer">${esc(ev.it.title)}<small>${dd===1?'내일':dd+'일 후'} 결제 · ${esc(ev.it.category||'')}</small></button><span class="amt num">${won(ev.amount)}</span></div>`); }));
  return rows;
}

function evRow(ev){
  const k = KIND[ev.kind], it = ev.it;
  let sub = k.label;
  if (ev.kind==='pay') sub = `${esc(it.category || '지출')}${it.payMethod ? ' · '+esc(it.payMethod) : ''}`;
  if (ev.kind==='expire') sub = `만료${it.autoRenew ? ' · 자동 갱신' : ''}`;
  if (ev.kind==='care') sub = `권장일 · 주기 ${it.targetDays}일`;
  if (ev.kind==='visit') sub = `방문 기록${ev.log && ev.log.memo ? ' · '+esc(ev.log.memo) : ''}`;
  if (ev.kind==='event') sub = `${esc(it.category || '일정')}${it.time ? ' · '+esc(it.time) : ''}`;
  const amt = (ev.kind==='pay' || (ev.kind==='visit' && ev.amount)) ? `<span class="amt num">${won(ev.amount)}</span>` : '';
  const act = ev.kind==='care' ? `<button class="btn sm" data-act="visit" data-id="${it.id}">방문함</button>` : '';
  return `<div class="ev"><span class="mark ${k.hollow?'hollow':''}" style="--c:${k.color}"></span>
    <button class="t" data-act="edit" data-id="${it.id}" style="all:unset;flex:1;min-width:0;cursor:pointer;overflow-wrap:anywhere">${esc(it.title)}${it.example?' <span class="tag">예시</span>':''}<small>${sub}</small></button>${amt}${act}</div>`;
}

function condEmojis(ids, max){ const tags = S.condTags || [], out = ids.map(id => tags.find(t => t.id === id)).filter(Boolean).map(t => esc(t.emoji));

    <form class="cerow2" data-form="check"><input id="ckNewName" placeholder="새 체크 항목 (예: 스트레스)" autocomplete="off"><button class="btn sm" type="submit">추가</button></form>

    <div class="sllab" style="margin:8px 0 4px">증상 <span style="font-weight:400">있었던 것만</span></div>

/* ===== 운동 앱 연동 =====
   원본: 운동 앱이 같은 시트에 쓰는 줄을 그대로 읽음
     workout_routines 탭(루틴) · meta 탭 wk_ex:*(종목·단계·기준) · wk_plantpl(기본 주간 계획)
     workouts 탭 plan:<그 주 월요일>({items:[{id,rid,date,type,tpl}]}) · log:<id>(기록)
   저널 쪽: 계획 하나 = 저널 블록 하나(id 'wk:'+계획 id). 블록에는 '시간'만 저널 것(운동 자리에서 자동, 직접 끌어 바꿀 수 있음).
     날짜·루틴은 운동 앱 계획이 원본 → 저널에서 날짜를 옮기거나 지우면 그 주의 plan 줄을 고쳐 운동 앱에도 반영.
     완료(✓)는 운동 앱 기록과 짝지어 자동 표시(운동 앱 '계획' 탭과 같은 규칙). 저널에서 직접 체크하지 않음. */
let WK = { loaded:false, routines:[], ex:[], tpl:[], weeks:{}, logs:[] };
let WK_SAVED = {};            // 'plan:<월요일>' → 시트에 있는 내용(JSON 글자). 다르면 저널이 올림
const WK_AHEAD = 8;           // 기본 주간 계획을 저널 캘린더에 미리 펼쳐 두는 주 수(이번 주 포함 +8주)
/* 운동 앱 아이콘(아령, icons/workout.svg와 같은 그림) — 그림 파일을 따로 불러오지 않고 CSS에 한 번만 넣어 둠 */
const WKIC = '<i class="wkic" aria-hidden="true"></i>';
const wkMon = k => ymd(weekStart(k));
const wkR = id => WK.routines.find(r => r.id === id);
const wkE = id => WK.ex.find(e => e.id === id);
const wkLogRts = l => l.routines && l.routines.length ? l.routines : [{ id:l.rid }];
function wkLoad(cols){ // listAll 결과 → WK (이 기기에서 아직 안 올린 계획 줄은 유지)
  const live = c => (cols[c] || []).filter(r => !r.deleted);
  const ord = a => a.sort((x,y) => (x._o ?? 0) - (y._o ?? 0));
  const meta = live('meta'), wks = live('workouts');
  const dirty = Object.keys(WK.weeks).filter(m => JSON.stringify({ items:WK.weeks[m] }) !== WK_SAVED['plan:'+m]);
  const keep = Object.fromEntries(dirty.map(m => [m, WK.weeks[m]]));
  WK.routines = ord(live('workout_routines').map(r => r.data));
  WK.ex = ord(meta.filter(r => String(r.id).startsWith('wk_ex:')).map(r => r.data));
  WK.tpl = ((meta.find(r => r.id === 'wk_plantpl') || {}).data || {}).tpl || [];
  WK.weeks = {}; WK_SAVED = {};
  wks.forEach(r => { const id = String(r.id); if (id.startsWith('plan:')){ WK.weeks[id.slice(5)] = (r.data && r.data.items) || []; WK_SAVED[id] = JSON.stringify({ items:WK.weeks[id.slice(5)] }); } });
  Object.assign(WK.weeks, keep);
  WK.logs = wks.filter(r => String(r.id).startsWith('log:')).map(r => r.data).filter(l => l && l.date);
  WK.loaded = true;
}
/* 운동 앱 weekPlan과 같은 규칙: 그 주 줄이 있으면 그것, 없으면 기본 주간 계획으로 만든 목록(id도 같음) */
function wkWeek(mon){ if (WK.weeks[mon]) return WK.weeks[mon];
  return WK.tpl.filter(t => wkR(t.rid)).map(t => ({ id:'t' + t.id + mon.replace(/-/g,''), rid:t.rid, date:dk(mon, t.wd), type:t.type, tpl:t.id })); }
function wkStamp(mon){ if (!WK.weeks[mon]) WK.weeks[mon] = wkWeek(mon).map(p => ({ ...p })); return WK.weeks[mon]; }
function wkStatus(mon){ // 계획 id → 실제로 한 날짜 (같은 날 같은 루틴 먼저, 남으면 그 주 다른 날)
  const end = dk(mon, 6), items = wkWeek(mon), pool = [], out = {};
  WK.logs.filter(l => l.date >= mon && l.date <= end).forEach(l => wkLogRts(l).forEach(r => pool.push({ rid:r.id, date:l.date, used:false })));
  items.forEach(p => { const m = pool.find(x => !x.used && x.rid === p.rid && x.date === p.date); if (m){ m.used = true; out[p.id] = m.date; } });
  items.forEach(p => { if (out[p.id]) return; const m = pool.find(x => !x.used && x.rid === p.rid); if (m){ m.used = true; out[p.id] = m.date; } });
  return out;
}
function wkItems(r){ if (!r) return [];
  return (r.items || []).map(it => { if (it.subRid){ const s = wkR(it.subRid); return s ? s.name + ' 루틴' : ''; }
    const e = wkE(it.exId); if (!e) return ''; const i = (e.levels||[]).findIndex(l => l.id === it.levelId);
    return e.levels.length > 1 && i >= 0 ? `${e.name} ${i+1}단계` : e.name; }).filter(Boolean); }
function wkMons(){ const cur = wkMon(todayStr()), s = new Set(Object.keys(WK.weeks)); for (let i = 0; i <= WK_AHEAD; i++) s.add(dk(cur, 7*i)); return [...s]; }
/* 운동 앱 계획 → 저널 블록 맞추기. 시간은 저널 것 유지, 날짜가 바뀌면 새 날짜의 운동 자리로 */
function wkSync(){
  if (!WK.loaded) return false;
  const want = {};
  wkMons().forEach(mon => { const st = wkStatus(mon); wkWeek(mon).forEach(p => { if (wkR(p.rid)) want['wk:' + p.id] = { p, done:st[p.id] || null }; }); });
  const next = { ...S.blocks }; let ch = false;
  Object.entries(want).forEach(([bid, { p, done }]) => {
    const r = wkR(p.rid), b = next[bid], { updatedAt, ...cmp } = b || {};
    let nb = b ? { ...cmp } : (() => { const tm = wpTime(p.date, p.rid); return { date:p.date, start:tm.start, end:tm.end, cat:'exercise', show:'month', bg:false, subs:[], memo:'' }; })();
    if (b && b.date !== p.date && !b.status){ const tm = wpTime(p.date, p.rid); nb.start = tm.start; nb.end = tm.end; }
    Object.assign(nb, { date:p.date, title:r.name, items:wkItems(r), routineId:p.rid, planId:p.id, src:'workout', done:!!done, doneOn:done || null });
    if (!b || JSON.stringify(cmp) !== JSON.stringify(nb)){ next[bid] = { ...nb, updatedAt:new Date().toISOString() }; ch = true; }
  });
  Object.keys(next).forEach(id => { if (id.startsWith('wk:') && !want[id]){ delete next[id]; ch = true; } });
  if (ch){ S.blocks = next; clearAutoCache(); schedulePush(); }
  if (wkStageSync()) ch = true;
  return ch;
}
function wkFind(pid, nearK){ // 계획 찾기: 그 주 줄 → 주변 주 → 펼친 모든 주
  const mons = [wkMon(nearK), ...wkMons()];
  for (const mon of mons){ const p = wkWeek(mon).find(x => x.id === pid); if (p) return { mon, p }; }
  return null;
}
/* 저널에서 날짜를 옮김 → 운동 앱 계획도 옮김(다른 주로 가면 그 주 줄로 이동) */
function wkMove(pid, fromK, toK){
  const f = wkFind(pid, fromK); if (!f) return;
  const A = wkStamp(f.mon), i = A.findIndex(x => x.id === pid); if (i < 0) return;
  const to = wkMon(toK);
  if (to === f.mon) A[i] = { ...A[i], date:toK };
  else { const it = A.splice(i, 1)[0]; wkStamp(to).push({ ...it, date:toK }); }
  wkPush();
}
function wkRemove(pid, nearK){ const f = wkFind(pid, nearK); if (!f) return; const A = wkStamp(f.mon), i = A.findIndex(x => x.id === pid); if (i >= 0){ A.splice(i, 1); wkPush(); } }
function wkAdd(rid, k){ wkStamp(wkMon(k)).push({ id:'j' + newId().slice(0,10), rid, date:k, type:'B' }); wkPush(); wkSync(); }
let wkPushT = null;
function wkPush(){ try { wkCache(); } catch(e){} clearTimeout(wkPushT); wkPushT = setTimeout(wkPushNow, 800); }
async function wkPushNow(){
  const now = new Date().toISOString(), recs = [];
  Object.entries(WK.weeks).forEach(([mon, items]) => { const id = 'plan:' + mon, str = JSON.stringify({ items }); if (str !== WK_SAVED[id]) recs.push({ id, str }); });
  if (!recs.length) return;
  if (!CONN){ recs.forEach(r => WK_SAVED[r.id] = r.str); return; }
  try { await api('POST', { action:'upsert', col:'workouts', records:recs.map(r => ({ id:r.id, updatedAt:'t' + now, deleted:false, data:JSON.parse(r.str) })) });
    recs.forEach(r => WK_SAVED[r.id] = r.str); }
  catch(e){ setTimeout(wkPushNow, 20000); }
}
/* 블록이 바뀌거나 지워질 때(저널 쪽 조작) 운동 앱 계획에 반영 — store에서 부름 */
function wkOnSet(id, data){ const old = S.blocks[id]; if (!old || !old.planId || !data || !data.date) return; if (old.date !== data.date) wkMove(old.planId, old.date, data.date); }
function wkOnDel(id){ const old = S.blocks[id]; if (old && old.planId) wkRemove(old.planId, old.date); }

/* --- 프로젝트 연결 --- */
const WK_F = { reps:['횟수','회'], kg:['무게','kg'], sec:['시간','초'], min:['시간','분'], km:['거리','km'], dist:['거리','km'], assist:['보조','kg'] };
const wkCurLevel = e => { let k = 0; WK.routines.forEach(r => (r.items||[]).forEach(it => { if (it.exId === e.id){ const i = e.levels.findIndex(l => l.id === it.levelId); if (i > k) k = i; } })); return k; };
const wkLvLogs = (e, l) => WK.logs.filter(g => (g.items||[]).some(x => x.exId === e.id && x.levelId === l.id));
function wkCrit(e, l){ // 운동 앱 critCheck와 같은 계산
  const c = l.crit; if (!c || !c.type || c.type === 'none') return null; const ls = wkLvLogs(e, l);
  if (c.type === 'goal'){ const f = c.f || (l.fields||[])[0], v = +c.v || 0, need = c.sets === '' || c.sets == null ? 3 : (+c.sets || 1); let best = 0;
    ls.forEach(g => g.items.filter(x => x.exId === e.id && x.levelId === l.id).forEach(x => { const k = (x.sets||[]).filter(s => s.done !== false && +((s.vals||{})[f]) >= v).length; if (k > best) best = k; }));
    const F = WK_F[f] || [f, ''];
    return { ok:v > 0 && best >= need, text:`${need}세트 × ${F[0]} ${v}${F[1]} 이상`, prog:`가장 좋았던 날 ${Math.min(best, need)}/${need}세트` }; }
  const n = c.per === 'each' ? ls.length : new Set(ls.map(g => g.date)).size, need = +c.n || 1;
  return { ok:n >= need, text:`이 단계로 ${need}번${c.per === 'each' ? ' (할 때마다)' : ' (하루 1번)'}`, prog:`${Math.min(n, need)}/${need}번` };
}
const wkStageEx = () => WK.ex.filter(e => (e.levels||[]).length > 1);
/* 단계형 프로젝트 ↔ 운동 앱 단계형 종목: 단계 이름·기준·현재 단계는 운동 앱이 원본 */
function wkStageMs(e, old){
  const cur = wkCurLevel(e);
  return e.levels.map((l, i) => { const o = (old||[])[i] || {}, nx = e.levels[i+1];
    const first = nx ? wkLvLogs(e, nx).map(g => g.date).sort()[0] : null;
    return { id:o.id || newId().slice(0,8), title:l.name || `${i+1}단계`, crit:(wkCrit(e, l) || {}).text || '', target:null, unit:'', month:'', stage:true, logs:o.logs || [],
      doneAt: i < cur ? (o.doneAt || first || todayStr()) : null, wkLv:l.id }; });
}
function wkStageSync(){ let ch = false;
  Object.values(S.projects).forEach(p => { const r = p.rule; if (!r || r.mode !== 'wk' || r.kind !== 'ex' || p.type !== 'stage') return;
    const e = wkE(r.id); if (!e) return; const ms = wkStageMs(e, p.ms);

function dayContent(k, opts={}){

function careCard(it){
  const st = careStat(it), stt = careState(st);
  const pct = st.target && st.since !== null ? Math.min(100, Math.round(st.since/st.target*100)) : 0;
  const pc = stt.cls==='p-bad'?'var(--bad)':stt.cls==='p-warn'?'var(--warn)':'var(--ok)';
  return `<div class="ccard">
    <div class="row"><button style="all:unset;cursor:pointer" class="name" data-act="edit" data-id="${it.id}">${esc(it.title)}${it.example?' <span class="tag">예시</span>':''}</button><span class="pill ${stt.cls}">${stt.text}</span></div>
    <div class="meter" style="--pc:${pc}"><i style="width:${pct}%"></i></div>
    <div class="meta">${st.last ? `마지막 ${fmtDay(st.last)} · ${st.since}일 전` : '방문 기록을 남기면 다음 권장일이 계산됩니다'}<br>
      권장 ${st.target||'-'}일${st.avg ? ` · 실제 평균 <b class="num">${st.avg}</b>일 (${st.count}회)` : ''}${st.next ? ` · 다음 ${fmtDay(st.next)}` : ''}</div>
    <div class="btns"><button class="btn sm" data-act="visit" data-id="${it.id}">방문 기록</button></div></div>`;
}
function viewItems(){
  const all = Object.entries(S.items).map(([id,v])=>({...v,id})).filter(i=>S.showArchived || !i.archived);
  const group = tp => {
    const list = all.filter(i=>i.type===tp).sort((a,b)=>String(a.title).localeCompare(String(b.title),'ko'));
    const rows = list.map(it=>`<button class="irow ${it.archived?'arch':''}" data-act="edit" data-id="${it.id}">
      <span style="width:9px;height:9px;border-radius:50%;background:${TYPES[tp].color};flex:none"></span>
      <span class="t">${esc(it.title)}${it.example?' <span class="tag">예시</span>':''}${it.archived?' <span class="tag">숨김</span>':''}<small>${itemSummary(it)}</small></span>
      ${it.type==='recurring'?`<span class="num" style="font-size:.85rem">${won(it.amount)}</span>`:''}</button>`).join('');
    return `<section class="panel"><h2>${TYPES[tp].label} <button class="link" data-act="new" data-type="${tp}">+ 추가</button></h2>
      ${rows ? `<div class="ilist">${rows}</div>` : `<div class="empty">${TYPES[tp].note} 등을 추가해 보세요.</div>`}</section>`;
  };
  const care = activeItems().filter(i=>i.type==='interval');
  const careSec = care.length ? `<section class="panel"><h2>주기 관리 현황</h2><div class="care">${care.map(careCard).join('')}</div></section>` : '';
  return `<div class="btns" style="margin-bottom:12px"><button class="toggle" data-act="toggle-arch" aria-pressed="${S.showArchived}">숨긴 항목 보기</button></div>
    <div class="grid two"><div class="stack">${careSec}${group('recurring')}</div><div class="stack">${group('deadline')}${group('interval')}${group('event')}</div></div>`;
}
function itemSummary(it){
  if (it.type==='recurring'){
    const when = it.freq==='weekly' ? `매주 ${DOW[Number(it.weekday||0)]}요일` : it.freq==='yearly' ? `매년 ${it.month}월 ${it.day}일` : `매월 ${it.day}일`;
    return `${esc(it.category||'')} · ${when}${it.payMethod?' · '+esc(it.payMethod):''}`;
  }
  if (it.type==='deadline'){ const dd = it.due ? dayDiff(it.due, todayStr()) : null; return `${it.due ? fmtDay(it.due) : '날짜 없음'}${dd!==null ? (dd>=0?` · ${dd}일 남음`:` · ${-dd}일 지남`) : ''}`; }
  if (it.type==='interval'){ const st = careStat(it); return `권장 ${it.targetDays||'-'}일 · ${careState(st).text}`; }
  if (it.type==='event'){ return `${it.date ? fmtDay(it.date) : ''}${it.time?' '+esc(it.time):''}${it.category?' · '+esc(it.category):''}`; }
  return '';
}

document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.redraw && sheetState){ readDraft(); drawEditor(); } });
function readDraft(){
  const d = sheetState.draft; const v = id => { const el = document.getElementById(id); return el ? (el.type==='checkbox' ? el.checked : el.value.trim()) : undefined; };
  ['title','memo','amount','category','freq','weekday','day','month','payMethod','startDate','endDate','due','remindDays','autoRenew','targetDays','date','time','lastVisit']
    .forEach(k=>{ const x = v('f_'+k); if (x !== undefined) d[k] = x; });
  ['amount','day','month','weekday','remindDays','targetDays'].forEach(k=>{ if (d[k] !== undefined && d[k] !== '') d[k] = Number(String(d[k]).replace(/[^\d.-]/g,'')) || 0; });
  return d;
}
function saveItem(){
  const d = readDraft();
  if (!d.title){ toast('이름을 입력해 주세요.'); $('#f_title').focus({ preventScroll:true }); return; }
  if (d.type==='recurring' && d.freq!=='weekly' && !(d.day>=1 && d.day<=31)){ toast('결제일은 1~31 사이로 입력해 주세요.'); return; }
  if (d.type==='deadline' && !d.due){ toast('만료일을 골라 주세요.'); return; }

    URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .82)); };

  img.src = url; }); }

function readBlock(){

  b.title = g('b_title').value.trim(); b.date = g('b_date').value; b.start = +g('b_start').value; b.end = +g('b_end').value;
  if (g('b_link')) b.link = g('b_link').value || null;
  if (g('b_items')) b.items = g('b_items').value.split(',').map(x => x.trim()).filter(Boolean);

/* 반복: 요일 반복(이번 주 안) · 횟수 채우기(PT처럼 N회가 찰 때까지) */

function saveRepeat(b, body){

/* ===== 같은 반복 한꺼번에 고치기 =====
   - 같은 반복: 같은 주 · 같은 groupId · 같은 시간(모양)

function partnerId(id){ const b = S.blocks[id]; if (!b || !b.pairId) return null;
  const e = Object.entries(S.blocks).find(([k,x]) => k !== id && x.pairId === b.pairId); return e ? e[0] : null; }

  const [n] = nightOf(id), b = S.blocks[n]; if (!b || !b.groupId || b.seriesId) return [];
  const sh = shapeOf(n), ws = ymd(weekStart(b.date)), we = ymd(addDays(weekStart(b.date),6)), seen = new Set([n]), out = [];
  Object.keys(S.blocks).forEach(k => { const x = S.blocks[k]; if (x.groupId !== b.groupId || x.status) return;
    const [kn] = nightOf(k), xn = S.blocks[kn]; if (seen.has(kn) || xn.date < ws || xn.date > we) return;
    const s2 = shapeOf(kn); if (s2.start === sh.start && s2.end === sh.end){ seen.add(kn); out.push(kn); } });
  return out;

/* 주의 경계에 걸친 짝 없는 조각(월 새벽, 일 밤)도 같이 맞춤 */
function boundaryPieces(gid, week0, old){

  Object.entries(S.blocks).forEach(([k,x]) => { if (x.groupId !== gid || x.pairId || x.date < ws || x.date > we) return;
    if (x.start === 0 && x.end === old.end - 1440) r.morning.push(k);
    if (x.end === 1440 && x.start === old.start) r.night.push(k); });
  return r;
}

  if (b.end > 1440){ const pid = 'pp' + newId().slice(0,10);
    store.set('blocks', id, { ...b, end:1440, pairId:pid });
    store.set('blocks', newId(), { ...b, date:ymd(addDays(parse(b.date),1)), start:0, end:b.end-1440, pairId:pid, subs:[] }); }
  else store.set('blocks', id, b);

}

  let extra = {};

  sheetState = { kind:'blk', id, draft:{ rep:'none', rdays:rd, total:30, before:0, ...src, show:showOf(src), subs:(src.subs||[]).map(s=>({...s})) }, arm:false, armS:false, ...extra };

function scopeHtml(){

    <div class="daypick">${DOWM.map((d,i)=>`<button type="button" data-act="gday" data-i="${i}" aria-pressed="${!!st.gdays[i]}">${d}</button>`).join('')}</div>

function saveBlock(){
  const b = readBlock(), st = sheetState;
  if (b.end <= b.start){ toast('끝 시간이 시작보다 늦어야 합니다.'); return; }
  if (!b.title) b.title = CAT[b.cat] ? CAT[b.cat].label : '할 일';
  const { id:_d, updatedAt, lane, n, rep:_r, rdays, total, before, ...body } = b;
  body.bg = body.show === 'tt'; if (body.bg){ body.subs = []; body.done = false; }
  if (!st.id){
    if (body.bg){ const ws = weekStart(body.date);
      const dates = b.rep === 'week' ? b.rdays.map((on,i)=>on ? ymd(addDays(ws,i)) : null).filter(Boolean)
        : b.rep === 'count' ? nextDates(body.date, b.rdays, Math.max(0, (+b.total||0) - (+b.before||0))) : [body.date];
      if (shadeBlocked(dates, body.start, body.end, new Set())) return; }
    if (b.rep && b.rep !== 'none'){ if (saveRepeat(b, body)){ closeSheet(); doRender(); } return; }
    putBlock(body); closeSheet(); doRender(); toast('저장했습니다.'); return;
  }
  let targets = st.scope === 'all' ? [st.nightId, ...st.sibs] : [st.nightId];
  const week0 = weekStart(S.blocks[st.nightId].date);
  if (body.bg){
    const dates = st.scope === 'all' && st.gdays ? st.gdays.map((on,i)=>on ? ymd(addDays(week0,i)) : null).filter(Boolean)
      : targets.map(k => k === st.nightId && st.scope !== 'all' ? body.date : S.blocks[k].date);
    if (shadeBlocked(dates, body.start, body.end, exSet(st.scope === 'all' ? [st.nightId, ...st.sibs] : [st.nightId]))) return;
  }
  if (st.scope === 'all' && st.gdays){
    if (!st.gdays.some(Boolean)){ toast('요일을 하나 이상 남겨 주세요. 모두 지우려면 삭제를 누르세요.'); return; }
    if (!body.groupId) body.groupId = 'g' + newId().slice(0,10);
    const removed = targets.filter(k => !st.gdays[midx(S.blocks[k].date)]);
    removed.forEach(k => { const [nn, mm] = nightOf(k); store.del('blocks', nn); if (mm) store.del('blocks', mm); });
    targets = targets.filter(k => !removed.includes(k));

    st.gdays.forEach((on, i) => { if (on && !have.has(i)) putBlock({ ...body, date:ymd(addDays(week0, i)), done:false, subs:body.subs.map(x=>({t:x.t, d:false})), memo:body.memo }); });

  });

    bnd.morning.forEach(k => { const x = S.blocks[k]; if (body.end > 1440) store.set('blocks', k, { ...x, title:body.title, cat:body.cat, show:body.show, bg:body.bg, end:body.end-1440 }); });
    bnd.night.forEach(k => { const x = S.blocks[k]; store.set('blocks', k, { ...x, title:body.title, cat:body.cat, show:body.show, bg:body.bg, start:body.start }); });
  }
  const nAdd = st.gdays ? st.gdays.filter((v,i)=>v && !st.gdays0[i]).length : 0, nDel = st.gdays ? st.gdays.filter((v,i)=>!v && st.gdays0[i]).length : 0;
  closeSheet(); doRender(); toast(nAdd || nDel ? `반복 요일을 고쳤습니다${nAdd?` · ${nAdd}일 추가`:''}${nDel?` · ${nDel}일 삭제`:''}.` : targets.length > 1 ? `이번 주 ${targets.length}일을 함께 고쳤습니다.` : '저장했습니다.');
}

/* ===================== 연간 계획 ===================== */
const ym = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;

const thisYM = () => ym(logicalNow());
const ymLabel = (s, withYear) => `${withYear || s.slice(5)==='01' ? s.slice(2,4)+'년 ' : ''}${+s.slice(5)}월`;
const durLabel = m => m % 60 ? `${Math.floor(m/60) ? Math.floor(m/60)+'시간 ' : ''}${m%60}분` : `${m/60}시간`;
/* 지난 달에 배정 못 한 월 지정 할 일 → 이번 달로 자동 이월 */

}
const mtLive = t => !t.canceled && !(t.placedBlockId && S.blocks[t.placedBlockId]);
/* 프로젝트·이정표 */

function projOf(m){ return Object.entries(S.projects).find(([,p]) => p.ms.includes(m)) || null; }

let _autoCache = new WeakMap();
const _dayCache = new Map();
const clearAutoCache = () => { _autoCache = new WeakMap(); _dayCache.clear(); };
/* 읽기 전용 getDay: 한 번 그리는 동안 같은 날짜를 반복 계산하지 않음 (store.set·doRender 때 비움). 반환값은 고치지 말 것 */

        <button type="button" class="iconbtn" data-act="ps-up" data-i="${i}" ${i===0?'disabled':''} aria-label="위로">↑</button>
        <button type="button" class="x" data-act="ps-del" data-i="${i}" aria-label="삭제" ${d.stages.length===1?'disabled':''}>×</button><input class="field crit" id="s${i}_c" value="${esc(m.crit||'')}" placeholder="달성 기준 (예: 10초 × 3세트)"></div></div>`).join('')
      + `<button type="button" class="btn sm" data-act="ps-add">+ 단계 추가</button><div class="hint">연습 수를 채우면 '기준 달성'이 뜨고 다음 단계로 넘어가자고 알려 줍니다. 넘어가는 건 직접 누를 때만 됩니다.</div>`;
  } else {
    const m = d.goal;
    body = `<label class="f">목표<input class="field" id="gl_t" value="${esc(m.title)}" placeholder="예: 시간 관련 도서 읽기"></label>
      <div class="two"><label class="f">목표 수<input class="field num" id="gl_n" inputmode="numeric" value="${m.target || ''}" placeholder="10"></label>
        <label class="f">단위<input class="field" id="gl_u" value="${esc(m.unit||'')}" placeholder="권"></label></div>`;
  }
  $('#sheetHost').innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet wide" role="dialog" aria-modal="true" aria-label="프로젝트">
    <h3>${st.seasonOf ? '새 시즌' : st.id ? '프로젝트' : '새 프로젝트'}</h3>
    <div class="form">
      ${st.seasonOf ? `<div class="notice" style="margin:0">'${esc(d.name)}'의 새 시즌입니다. 저장하면 지난 시즌은 '완료한 프로젝트·시즌'으로 내려갑니다.</div>` : ''}
      <div class="two" style="grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)"><label class="f">프로젝트<input class="field" id="pj_name" value="${esc(d.name)}" placeholder="예: 독서, 업무, 푸시업"></label>
        <label class="f">이번 시즌 목표<input class="field" id="pj_season" value="${esc(d.season)}" placeholder="예: 시간 관련 도서"></label></div>
      <div><div class="sublabel" style="margin-top:0">분야</div>${areaPick(d.area)}</div>
      <div class="two"><label class="f">시작<select id="pj_start">${monthOpts(d.start)}</select></label>
        <label class="f">끝<select id="pj_end"><option value="">끝 미정</option>${monthOpts(d.end)}</select></label></div>
      <div><div class="sublabel" style="margin-top:0">방식</div>
        <div class="showpick">${PJ_TYPES.map(([k,l,n]) => `<button type="button" data-act="pj-type" data-v="${k}" aria-pressed="${d.type===k}"><b>${l}</b><small>${n}</small></button>`).join('')}</div></div>
      <div class="stack" style="gap:8px">${body}</div>
      ${ruleHtml(d)}
    </div>
    <div class="foot"><div class="btns">${st.id ? `<button class="btn ${st.arm?'armed':'danger'}" data-act="pj-del">${st.arm?'한 번 더 누르면 삭제':'삭제'}</button>` : ''}</div>
      <div class="btns"><button class="btn" data-act="close">취소</button><button class="btn pri" data-act="pj-save">저장</button></div></div>
  </div></div>`;
}
function readProject(){
  const d = sheetState.draft, g = id => document.getElementById(id), num = v => +String(v||'').replace(/[^\d]/g,'') || null;
  if (!g('pj_name')) return d;
  d.name = g('pj_name').value.trim(); d.season = g('pj_season').value.trim(); d.start = g('pj_start').value; d.end = g('pj_end').value;
  const rd = (m, p) => { if (!g(p+'_t')) return; m.title = g(p+'_t').value.trim(); m.target = num(g(p+'_n').value); m.unit = g(p+'_u').value.trim(); if (g(p+'_c')) m.crit = g(p+'_c').value.trim(); };
  if (g('rl_item') && d.rule) d.rule.item = g('rl_item').value.trim();
  if (g('rl_wk') && d.rule){ const v = g('rl_wk').value; d.rule.kind = v.startsWith('e:') ? 'ex' : v ? 'routine' : null; d.rule.id = v.slice(2) || null; }
  if (d.rule && d.rule.mode === 'wk') d.rule.base = !!(g('rl_base') && g('rl_base').checked);
  if (d.type === 'monthly') d.groups.forEach((gr, gi) => { if (g(`g${gi}_m`)) gr.month = g(`g${gi}_m`).value; gr.items.forEach((m, ii) => rd(m, `g${gi}_${ii}`)); });
  else if (d.type === 'stage') d.stages.forEach((m, i) => rd(m, 's'+i));
  else rd(d.goal, 'gl');
  return d;
}
function saveProject(){
  const d = readProject();
  if (!d.name){ toast('프로젝트 이름을 입력해 주세요.'); return; }
  if (d.end && d.end < d.start){ toast('끝 달이 시작보다 빠릅니다.'); return; }
  let ms;
  if (d.type === 'monthly') ms = d.groups.flatMap(gr => gr.items.filter(m => m.title).map(m => ({ ...m, month:gr.month })));
  else if (d.type === 'stage' && d.rule && d.rule.mode === 'wk'){ const e = d.rule.kind === 'ex' && wkE(d.rule.id); if (!e){ toast('연결할 단계형 종목을 골라 주세요.'); return; }
    ms = wkStageMs(e, sheetState.id ? S.projects[sheetState.id].ms : null); }
  else if (d.type === 'stage') ms = d.stages.filter(m => m.title).map(m => ({ ...m, month:'', stage:true }));
  else { if (d.rule && d.rule.mode === 'wk'){ if (!d.rule.id){ toast('셀 루틴이나 종목을 골라 주세요.'); return; } if (!d.goal.title) d.goal.title = wkTargetName(d.rule); }
    if (!d.goal.title || !d.goal.target){ toast('목표와 목표 수를 입력해 주세요.'); return; } ms = [{ ...d.goal, month:'' }]; }
  if (!ms.length){ toast(d.type === 'stage' ? '단계를 하나 이상 적어 주세요.' : '목표를 하나 이상 적어 주세요.'); return; }
  ms.forEach(m => { if (m.target){ m.doneAt = msCount(m) >= m.target ? (m.doneAt || todayStr()) : null; } });
  if (d.rule && d.rule.mode === 'item' && !d.rule.item){ toast('셀 종목 이름을 입력해 주세요.'); return; }
  const old = sheetState.id ? S.projects[sheetState.id] : {};
  S.projects[sheetState.id || 'p'+newId().slice(0,8)] = { name:d.name, area:d.area, season:d.season, start:d.start, end:d.end, type:d.type, rule: d.type === 'monthly' ? null : d.rule, ms, focus:old.focus || null, archived:old.archived || false, done:old.done || false, doneAt:old.doneAt || null };
  if (sheetState.seasonOf && S.projects[sheetState.seasonOf]){ const o = S.projects[sheetState.seasonOf]; o.done = true; o.doneAt = todayStr(); if (!o.end || o.end > thisYM()) o.end = thisYM(); }
  closeSheet(); doRender(); toast('프로젝트를 저장했습니다.');
}
function pjClick(a, el){
  const d = sheetState && sheetState.draft;
  switch (a){
    case 'pj-type': readProject(); d.type = el.dataset.v; drawProject(); return true;
    case 'rule-mode': readProject(); d.rule = { ...(d.rule||{}), mode:el.dataset.v, tag:(d.rule&&d.rule.tag)||'exercise', per:(d.rule&&d.rule.per)||'session' };
      if (el.dataset.v === 'wk' && d.type === 'stage' && !(d.rule.kind === 'ex' && wkStageEx().some(e => e.id === d.rule.id))){ const e = wkStageEx()[0]; d.rule.kind = e ? 'ex' : null; d.rule.id = e ? e.id : null; }
      drawProject(); return true;
    case 'rule-tag': readProject(); d.rule.tag = el.dataset.v; drawProject(); return true;
    case 'rule-per': readProject(); d.rule.per = el.dataset.v; drawProject(); return true;
    case 'pg-add': { readProject(); const last = d.groups[d.groups.length-1]; d.groups.push({ month: last ? ymAdd(last.month, 1) : thisYM(), items:[newMs()] }); drawProject(); return true; }
    case 'pg-del': readProject(); d.groups.splice(+el.dataset.gi, 1); drawProject(); return true;
    case 'pi-add': readProject(); d.groups[+el.dataset.gi].items.push(newMs()); drawProject(); return true;
    case 'pi-del': { readProject(); const gr = d.groups[+el.dataset.gi]; gr.items.splice(+el.dataset.ii, 1); if (!gr.items.length) gr.items.push(newMs()); drawProject(); return true; }
    case 'ps-add': readProject(); d.stages.push(newMs()); drawProject(); return true;
    case 'ps-del': readProject(); d.stages.splice(+el.dataset.i, 1); drawProject(); return true;
    case 'ps-up': { readProject(); const i = +el.dataset.i, L = d.stages; [L[i-1], L[i]] = [L[i], L[i-1]]; drawProject(); return true; }
  }
  return false;
}

/* --- 목표 기록: 언제 · 무엇(책 제목/장소) · 메모 --- */
const logHint = u => /권|책/.test(u||'') ? '책 제목' : /곳|군데/.test(u||'') ? '장소' : /회|번/.test(u||'') ? '무엇을 했나요' : '무엇을 했나요 (선택)';
const SRC_LABEL = { manual:'직접', block:'시간표', app:'앱' };
function openLog(pid, mid, i){
  const m = S.projects[pid].ms.find(x => x.id === mid), l = i != null ? m.logs[i] : null;
  const prev = sheetState && sheetState.kind === 'logs' ? sheetState : null;
  sheetState = { kind:'log', pid, mid, i: i ?? null, draft: l ? { ...l } : { date:(S.tab==='home' && (isWide() ? S.vw==='day' : S.vn==='day') && S.sel <= todayStr()) ? S.sel : todayStr(), title:'', memo:'', n:1, src:'manual' }, arm:false, back:prev };
  sheetOpenedAt = Date.now(); drawLog();
}
function drawLog(){
  const st = sheetState, p = S.projects[st.pid], m = p.ms.find(x => x.id === st.mid), d = st.draft, c = msCount(m);
  $('#sheetHost').innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="기록">
    <h3>${st.i == null ? `${esc(m.title)} · ${c + 1}번째 기록` : `${esc(m.title)} · 기록 고치기`}</h3>
    <div class="form">
      <div class="hint">${esc(p.name)} · 지금 ${c}/${m.target}${esc(m.unit||'')}</div>
      <div class="two" style="grid-template-columns:150px minmax(0,1fr)"><label class="f">날짜<input class="field" type="date" id="lg_date" value="${d.date}"></label>
        <label class="f">${logHint(m.unit)}<input class="field" id="lg_title" value="${esc(d.title||'')}" placeholder="${/권|책/.test(m.unit||'') ? '예: 모모' : /곳/.test(m.unit||'') ? '예: 리움미술관' : ''}"></label></div>

      <div class="hint">이 기록은 그날 일간 화면의 다이어리 옆에 함께 보입니다.${d.src==='block' ? ' (시간표 블록 완료로 생긴 기록)' : ''}</div>
    </div>
    <div class="foot"><div class="btns">${st.i != null ? `<button class="btn ${st.arm?'armed':'danger'}" data-act="lg-del">${st.arm?'한 번 더 누르면 삭제':'삭제'}</button>` : ''}</div>
      <div class="btns"><button class="btn" data-act="lg-back">${st.back ? '목록으로' : '취소'}</button><button class="btn pri" data-act="lg-save">${st.i == null ? '+1 기록' : '저장'}</button></div></div>
  </div></div>`;
  setTimeout(() => { const t = $('#lg_title'); if (t && st.i == null) t.focus({ preventScroll:true }); }, 60);

function saveLog(){
  const st = sheetState, m = S.projects[st.pid].ms.find(x => x.id === st.mid), g = id => document.getElementById(id);
  const rec = { ...st.draft, date: g('lg_date').value || todayStr(), title: g('lg_title').value.trim(), memo: g('lg_memo').value.trim() };
  m.logs = m.logs || [];
  if (st.i == null) m.logs.push(rec); else m.logs[st.i] = rec;
  if (!m.stage) m.doneAt = m.target && msCount(m) >= m.target ? (m.doneAt || rec.date) : (m.target ? null : m.doneAt);
  const back = st.back; if (back){ sheetState = back; drawLogs(); } else closeSheet();
  doRender(); toast(`${m.title} ${msCount(m)}/${m.target}${m.unit||''}${rec.title ? ' · ' + rec.title : ''}`);
}
function openLogs(pid, mid){ sheetState = { kind:'logs', pid, mid, arm:null }; sheetOpenedAt = Date.now(); drawLogs(); }
function drawLogs(){
  const st = sheetState, p = S.projects[st.pid], m = p.ms.find(x => x.id === st.mid), c = msCount(m);

    <span class="prog" style="display:block;margin-bottom:10px"><i style="width:${Math.min(100, c/m.target*100)}%"></i></span>

        <span class="lno num">${rows.length - k}</span><span class="ld num">${+l.date.slice(5,7)}/${+l.date.slice(8)}</span>
        <span class="lt"><b>${esc(l.title || '(내용 없음)')}</b>${l.memo ? `<small>${esc(l.memo)}</small>` : ''}</span><span class="tag">${auto ? '자동' : (SRC_LABEL[l.src]||'직접')}${l.n > 1 ? ' · ' + l.n : ''}</span></button>`).join('')
      : '<div class="empty">아직 기록이 없습니다.</div>'}</div>
    <div class="foot"><span></span><div class="btns"><button class="btn" data-act="close">닫기</button><button class="btn pri" data-act="lg-new">+1 기록</button></div></div>

function logClick(a, el){
  const st = sheetState;
  switch (a){
    case 'ms-plus': openLog(el.dataset.p, el.dataset.m, null); return true;
    case 'ms-logs': openLogs(el.dataset.p, el.dataset.m); return true;
    case 'lg-open': openLog(st.pid, st.mid, +el.dataset.i); return true;
    case 'lg-new': openLog(st.pid, st.mid, null); return true;
    case 'lg-save': saveLog(); return true;
    case 'lg-back': if (st.back){ sheetState = st.back; drawLogs(); } else closeSheet(); return true;
    case 'lg-del': { if (!st.arm){ st.arm = true; drawLog(); return true; }
      const m = S.projects[st.pid].ms.find(x => x.id === st.mid); m.logs.splice(st.i, 1); if (m.target && msCount(m) < m.target) m.doneAt = null;
      if (st.back){ sheetState = st.back; drawLogs(); } else closeSheet(); doRender(); toast('기록을 지웠습니다.'); return true; }
    case 'day-log': openLog(el.dataset.p, el.dataset.m, +el.dataset.i); return true;
  }
  return false;
}

function yearClick(a, el){
  if (pjClick(a, el)) return true;

    case 'mt-new': openMtask(null, el.dataset.m); return true;
    case 'mt-open': openMtask(el.dataset.id); return true;

      S.mtasks[sheetState.id || 'mt'+newId().slice(0,8)] = { ...t }; closeSheet(); doRender(); toast(`${ymLabel(t.month, true)} 할 일로 저장했습니다.`); return true; }
    case 'mt-cancel': readMtask(); S.mtasks[sheetState.id] = { ...sheetState.draft, canceled:true }; closeSheet(); doRender(); toast('취소했습니다. "취소한 할 일 보기"에서 다시 볼 수 있어요.'); return true;
    case 'mt-uncancel': readMtask(); S.mtasks[sheetState.id] = { ...sheetState.draft, canceled:false }; closeSheet(); doRender(); toast('되살렸습니다.'); return true;
    case 'mt-del': if (!sheetState.arm){ readMtask(); sheetState.arm = true; drawMtask(); return true; } delete S.mtasks[sheetState.id]; closeSheet(); doRender(); toast('삭제했습니다.'); return true;

}

/* ===== 일간 시간표: 당일 순서·시간 바꾸기, 취소·연기·보류 ===== */
let curDHP = 56; // 일간 1시간 높이 (아이패드 일 보기에선 화면 높이에 맞춤)
const ST_LABEL = { canceled:'취소', postponed:'연기', onhold:'보류' };
function dayTimetable(k, hp){
  const DHP = hp || 56; curDHP = DHP;
  const ppm = DHP/60, t = todayStr(), H = HRS()*DHP, h0 = DS()/60;
  const sh = shadesOn(k).filter(inRange), bl = layoutLanes(blocksOn(k).filter(inRange));
  const gut = Array.from({length:HRS()+1}, (_,i) => `<span style="top:${i*DHP}px">${pad(h0+i)}</span>`).join('');
  const now = new Date(), nm = now.getHours()*60 + now.getMinutes();
  const shades = sh.map(b => { const md = labelMode(b, bl, ppm), lbl = `${esc(b.title)}<small>${hm(b.start)}–${hm(b.end)}</small>`;
    return `<div class="dshade ${md==='bottom'?'lblbottom':''}" data-shade="${b.id}" style="top:${vTop(b,ppm)}px;height:${vH(b,ppm)}px">
      ${md === 'tab' ? '' : `<span class="shh dshh" data-did="${b.id}">${lbl}</span>`}<span class="shrz dshrz" data-did="${b.id}"></span></div>
      ${md === 'tab' ? `<span class="shh dshh shtab" data-did="${b.id}" style="top:${vTop(b,ppm)}px">${lbl}</span>` : ''}`; }).join('');
  const blocks = bl.map(b => { const c = (CAT[b.cat]||CAT.etc).c, h = vH(b,ppm), subs = b.subs || [], tall = h >= 44;
    const acts = b.seriesId ? `<button type="button" data-act="st" data-v="skip" data-id="${b.id}">건너뛰기</button>`
      : `<button type="button" data-act="st" data-v="canceled" data-id="${b.id}">취소</button><button type="button" data-act="st" data-v="onhold" data-id="${b.id}">보류</button>`;
    return `<div class="dblk ${b.done?'done':''} ${tall?'tall':''}" data-did="${b.id}" style="top:${vTop(b,ppm)}px;height:${h-2}px;left:calc(${b.lane}*100%/${b.n} + 2px);width:calc(100%/${b.n} - 4px);--c:${c}">
      <input type="checkbox" data-act="blk-done" data-id="${b.id}" ${b.done?'checked':''} aria-label="완료">
      <div class="dbody"><b>${b.routineId ? WKIC : ''}${esc(dispTitle(b))}</b><small>${hm(b.start)}–${hm(b.end)}${b.routineId ? (b.done ? ' · ✓ 운동 앱 기록' : ' · 운동 앱 루틴') : ''}${subs.length?` · 세부 ${subs.filter(x=>x.d).length}/${subs.length}`:''}</small></div>
      <div class="dacts">${acts}</div><span class="rz drz"></span></div>`; }).join('');
  const out = [...shadesOn(k), ...blocksOn(k)].filter(b => !inRange(b));
  const canceled = Object.entries(S.blocks).filter(([,b]) => b.date === k && b.status === 'canceled');
  return `<div class="hint" style="margin-bottom:6px">끌어서 시간·순서를 바꾸고, 빈 칸을 누르면 새 계획. 블록을 누르면 세부 내용.</div>

    const id = newId(); ids.push(id); const gk = it.title + '|' + it.cat; gmap[gk] = gmap[gk] || 'g' + newId().slice(0,10);
    store.set('blocks', id, { date:ymd(addDays(ws, it.dow)), start:it.start, end:it.end, title:it.title, cat:it.cat, show:it.show, bg:it.show==='tt',
      subs:(it.subs||[]).map(x=>({t:x, d:false})), items:(it.items||[]).slice(), memo:'', done:false, fromTpl:sheetState.pick, groupId:gmap[gk] }); });

let importParsed = null;
async function importCheck(){
  const out = $('#importOut'); importParsed = null;
  let text = $('#importText').value.trim();
  const file = $('#importFile').files[0];
  if (!text && file) text = await file.text();
  if (!text){ out.innerHTML = `<p class="hint" style="color:var(--bad)">파일을 고르거나 내용을 붙여넣어 주세요.</p>`; return; }
  let j; try { j = JSON.parse(text); } catch(err){ out.innerHTML = `<p class="hint" style="color:var(--bad)">JSON 형식이 아닙니다. 내보내기로 만든 파일인지 확인해 주세요.</p>`; return; }
  const ok = j && typeof j === 'object' && SYNC_COLS.some(c => j[c] && typeof j[c] === 'object');
  if (!ok){ out.innerHTML = `<p class="hint" style="color:var(--bad)">이 앱에서 내보낸 파일이 아닙니다.</p>`; return; }
  importParsed = j;
  const c = col => Object.keys(j[col]||{}).length;
  out.innerHTML = `<p class="hint" style="margin-top:10px">항목 ${c('items')} · 방문 기록 ${c('logs')} · 기록한 날 ${c('days')} · 시간 계획 ${c('blocks')}${j.exportedAt?` · ${esc(String(j.exportedAt).slice(0,10))} 백업`:''}</p>
    <button class="btn pri" data-act="import-run">가져오기 실행</button>`;
}
function importRun(){
  if (!importParsed) return;
  let n = 0;
  SYNC_COLS.forEach(col => Object.entries(importParsed[col]||{}).forEach(([id, v]) => {
    if (!v || typeof v !== 'object' || !/^[A-Za-z0-9_\-.~:@+]{1,180}$/.test(id) || id==='.' || id==='..') return;
    const { updatedAt, ...body } = v; colSet(col, id, body); n++;
  }));
  clearAutoCache(); schedulePush(0);
  importParsed = null; $('#importOut').innerHTML = ''; doRender(); toast(`${n}건을 가져왔습니다.`);
}
