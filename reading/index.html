<script>
const KEY='readlog-local-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
/* 하루 시작 기준: 저널 설정의 '다음 날로 넘어가는 시각'(같은 기기 저장값)을 따름 */
const dayCut=()=>{const v=parseInt(localStorage.getItem('jnl_daycut'),10);return isNaN(v)?300:v};
const todayStr=()=>{const d=new Date(Date.now()-dayCut()*60000);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const YEAR=String(new Date().getFullYear());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 저장: 저널 구글 시트(저널 API, 'meta' 탭의 rd_ 줄) · 연결 전에는 이 기기 ----------
   한 항목 = 시트 한 줄: id 'rd_<종류>:<항목id>', data = 항목 JSON. 저널은 meta의 settings만, 운동 앱은 wk_ 줄만 읽으므로 서로 겹치지 않음.
   바뀐 줄만 0.8초 모아 올리고, 다른 기기 변경은 열 때·화면으로 돌아올 때·2분마다 가져옴. */
const COLS=['topics','books','notes','links','expr','vocab','vgroups','marks'];
const S={};COLS.forEach(c=>S[c]=[]);
const RP='rd_';
let CONN=(()=>{try{const c=JSON.parse(localStorage.getItem('jnl_conn')||'null');if(!c||!c.url||!c.token)return null;const e=localStorage.getItem('rd_env');return{...c,env:e==='prod'?'prod':'test'}}catch(e){return null}})();
let MODE='connecting',SAVED={},lastSync=null,syncErr=null,flushT=null,retryT=null,flushing=false,pulling=false,dirtyS=false,errToast=false,booted=false,dirty=false;
const ckey=()=>'rd_cache_'+(CONN?CONN.env:'local');
function toRows(){const r={};COLS.forEach(c=>S[c].forEach(x=>{r[RP+c+':'+x.id]=JSON.stringify(x)}));return r}
function fromRows(r){COLS.forEach(c=>S[c]=[]);Object.entries(r).forEach(([k,str])=>{const m=/^rd_([a-z]+):(.+)$/.exec(k);if(!m||!S[m[1]])return;try{S[m[1]].push({...JSON.parse(str),id:m[2]})}catch(e){}})}
function writeCache(rows){try{localStorage.setItem(ckey(),JSON.stringify({rows:rows||toRows(),saved:SAVED,lastSync}))}catch(e){}}
const hasDirty=()=>{const r=toRows();return Object.keys(r).some(k=>r[k]!==SAVED[k])||Object.keys(SAVED).some(k=>!(k in r))};
async function api(method,payload,ms=45000){if(!CONN)throw new Error('연결 안 됨');const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),ms);

function goalHTML(t,big){
  const bs=booksOf(t.id),done=bs.filter(b=>b.status==='완독').sort((a,b)=>String(a.end||'').localeCompare(String(b.end||''))),
    now=bs.filter(b=>b.status==='읽는 중'||b.status==='멈춤'),g=t.goal||0;
  const edit=big&&V.goalEdit===t.id?`<form class="row" id="f-goal" data-id="${t.id}" style="gap:6px"><label class="small muted" for="goal-n">목표</label><input id="goal-n" type="number" min="1" max="200" value="${g||''}" style="width:80px" required><span class="small">권</span><button class="btn sm">저장</button>${g?`<button type="button" class="btn sm ghost" data-act="goalclear" data-id="${t.id}">목표 없애기</button>`:''}<button type="button" class="btn sm ghost" data-act="goalno">취소</button></form>`:'';
  if(!g)return big?`<div class="goal panel">${edit||`<div class="row"><span class="muted small">완독 ${done.length}권${now.length?' · 읽는 중 '+now.length+'권':''}</span><span style="flex:1"></span><button class="btn sm" data-act="goaledit" data-id="${t.id}">목표 정하기</button></div>`}</div>`:`<span class="muted small">완독 ${done.length}권</span>`;
  const pct=Math.min(100,Math.round(done.length/g*100)),left=Math.max(0,g-done.length),over=Math.max(0,done.length-g);
  const n=Math.max(g,done.length+now.length);
  const slots=n<=40?`<div class="slots ${big?'':'sm'}" style="grid-template-columns:repeat(${n},minmax(0,1fr))" role="img" aria-label="목표 ${g}권 중 ${done.length}권 완독">${Array.from({length:n},(_,i)=>{
      if(i<done.length)return`<i class="s done${i>=g?' over':''}" title="${esc(done[i].title)}"></i>`;
      if(i<done.length+now.length)return`<i class="s now" title="${esc(now[i-done.length].title)} (읽는 중)"></i>`;
      return`<i class="s"></i>`}).join('')}</div>`:`<div class="bar"><i style="width:${pct}%"></i></div>`;
  const msg=done.length>=g?`목표 달성${over?' · '+over+'권 더 읽음':''}`:`남은 ${left}권${now.length?' · 읽는 중 '+now.length+'권':''}`;
  if(!big)return`<div class="stack" style="gap:4px">${slots}<span class="muted small">완독 ${done.length} / ${g}권 · ${msg}</span></div>`;
  return`<div class="goal panel stack">
    <div class="row" style="align-items:baseline"><b class="gnum">${done.length}<span> / ${g}권</span></b><span class="gpct ${done.length>=g?'ok':''}">${pct}%</span><span style="flex:1"></span>
      ${edit?'':`<button class="btn sm ghost" data-act="goaledit" data-id="${t.id}">목표 바꾸기</button>`}</div>
    ${slots}
    <div class="row small"><span class="${done.length>=g?'gok':'muted'}">${msg}</span><span style="flex:1"></span><span class="legend"><i class="s done"></i>완독 <i class="s now"></i>읽는 중 <i class="s"></i>남은 칸</span></div>
    ${edit}</div>`}

  if(!bs.length)return`<p class="muted small" style="margin:0">${q?'찾는 책이 없어요.':k==='now'?'지금 읽는 책이 없어요. 주제 탭에서 책을 추가해 보세요.':'아직 없어요.'}</p>`;

/* ---------- 형광펜: 글 속 ==이렇게== 로 저장 → 화면에서는 형광 표시 ---------- */
const hl=s=>esc(s).replace(/==([\s\S]+?)==/g,'<mark>$1</mark>');
const marksOf=s=>[...String(s||'').matchAll(/==([\s\S]+?)==/g)].map(m=>m[1].trim()).filter(Boolean);

let lastTA=null;

function toggleHL(t){if(!t)return;const v=t.value;let a=t.selectionStart,b=t.selectionEnd;
  while(a<b&&/\s/.test(v[a]))a++;while(b>a&&/\s/.test(v[b-1]))b--;
  if(a===b){toast('칠할 문장을 먼저 드래그해 주세요');t.focus();return}
  const sel=v.slice(a,b);
  if(sel.length>=4&&sel.startsWith('==')&&sel.endsWith('=='))t.setRangeText(sel.slice(2,-2),a,b,'select');
  else if(v.slice(a-2,a)==='=='&&v.slice(b,b+2)==='==')t.setRangeText(sel,a-2,b+2,'select');
  else t.setRangeText('=='+sel.replace(/==/g,'')+'==',a,b,'select');
  t.focus();t.dispatchEvent(new Event('input',{bubbles:true}))}
document.addEventListener('pointerdown',e=>{if(e.target.closest('.hlbtn'))e.preventDefault()});  // 버튼을 눌러도 글 선택이 풀리지 않게

/* ---------- 그림: 저널 Apps Script의 사진 저장(드라이브)을 그대로 사용, 이 기기에는 사본(IndexedDB) ---------- */
const PH={},phLoading=new Set();
const pdb=(()=>{let pr;const open=()=>pr||(pr=new Promise((res,rej)=>{const r=indexedDB.open('rd-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=(m,f)=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction('p',m),q=f(t.objectStore('p'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
  return{get:k=>tx('readonly',s=>s.get(k)).catch(()=>null),put:(k,v)=>tx('readwrite',s=>s.put(v,k)).catch(()=>{}),del:k=>tx('readwrite',s=>s.delete(k)).catch(()=>{})}})();
const isTmp=x=>String(x).startsWith('tmp_');
function phSrc(id){if(PH[id])return PH[id];
  if(!isTmp(id)&&!phLoading.has(id)){phLoading.add(id);(async()=>{let v=await pdb.get(id);
    if(!v&&CONN){try{const r=await api('GET',{action:'photoGet',id},60000);v=`data:${r.mime||'image/jpeg'};base64,${r.b64}`;pdb.put(id,v)}catch(e){}}
    if(v){PH[id]=v;document.querySelectorAll('img[data-ph="'+id+'"]').forEach(im=>{im.src=v;im.classList.remove('ld')})}else phLoading.delete(id)})()}
  return''}
const imgTag=(id,cls)=>{const v=phSrc(id);return`<img data-ph="${esc(id)}" class="${cls}${v?'':' ld'}" ${v?`src="${v}"`:''} alt="첨부한 그림" data-act="lightbox" data-id="${esc(id)}">`};
const imgsHTML=n=>n.imgs&&n.imgs.length?`<div class="nimgs n${Math.min(n.imgs.length,2)}">${n.imgs.map(id=>imgTag(id,'nimg')).join('')}</div>`:'';
function shrinkImage(file){return new Promise(res=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const M=1800,k=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.88))};
  im.onerror=()=>{URL.revokeObjectURL(u);res(null)};im.src=u})}
const PEND={c:[],e:[]};   // c: 블록 추가 칸, e: 수정 칸
function pendHTML(k){return PEND[k].map((id,i)=>`<span class="pthumb">${isTmp(id)?`<img src="${PH[id]||''}" class="ld" alt="올리는 중"><i>올리는 중…</i>`:imgTag(id,'')}<button type="button" class="t" data-act="pdel" data-k="${k}" data-i="${i}" aria-label="그림 빼기">×</button></span>`).join('')}
function renderPend(k){const el=document.getElementById('pend-'+k);if(el)el.innerHTML=pendHTML(k)}
const imgZone=k=>`<div class="imgzone"><div class="row"><label class="btn sm ghost" for="img-${k}" style="cursor:pointer">그림 넣기</label><input type="file" id="img-${k}" class="imgIn" data-k="${k}" accept="image/*" multiple hidden><span class="small muted">또는 이 칸 안에서 붙여넣기(Ctrl+V)</span></div><div class="pthumbs" id="pend-${k}">${pendHTML(k)}</div></div>`;
async function addImgs(k,files){
  files=[...files].filter(f=>/^image\//.test(f.type));if(!files.length)return;
  if(!CONN){toast('그림은 구글 시트에 연결된 뒤 넣을 수 있어요');return}
  for(const f of files){const src=await shrinkImage(f);if(!src){toast('그림을 읽지 못했어요. 다른 그림으로 해 주세요');continue}
    const t='tmp_'+uid();PH[t]=src;PEND[k].push(t);renderPend(k);
    try{const r=await api('POST',{action:'photoPut',b64:src.split(',')[1],mime:'image/jpeg',name:'독서_'+todayStr()+'_'+t.slice(4)+'.jpg'},90000);
      PH[r.id]=src;pdb.put(r.id,src);const i=PEND[k].indexOf(t);if(i>=0)PEND[k][i]=r.id}
    catch(e){const i=PEND[k].indexOf(t);if(i>=0)PEND[k].splice(i,1);toast('그림을 올리지 못했어요. 연결을 확인하고 다시 넣어 주세요')}
    renderPend(k)}}
function dropPhotos(ids){(ids||[]).filter(x=>!isTmp(x)).forEach(id=>{pdb.del(id);delete PH[id];if(CONN)api('POST',{action:'photoDel',id}).catch(()=>{})})}
document.addEventListener('paste',e=>{const f=e.target.closest&&e.target.closest('#f-note,#f-nedit');if(!f)return;

  e.preventDefault();addImgs(f.id==='f-note'?'c':'e',files)});
document.addEventListener('change',e=>{if(e.target.classList&&e.target.classList.contains('imgIn')){addImgs(e.target.dataset.k,e.target.files);e.target.value=''}});

   <div class="f"><label for="ef-page">쪽</label><input id="ef-page" type="number" min="1" value="${e.page||''}" style="width:80px"></div></div>`}
function eItem(e){const b=book(e.bookId);
  if(V.editExpr===e.id)return`<form class="it stack composer" id="f-eedit" data-id="${e.id}">${eFields(e)}<div class="row"><button class="btn sm">저장</button><button type="button" class="btn sm ghost" data-act="eeditno">취소</button><span style="flex:1"></span>${V.edelArm===e.id?`<button type="button" class="btn sm" data-act="edelok" data-id="${e.id}">정말 삭제</button>`:`<button type="button" class="btn sm ghost" data-act="edel" data-id="${e.id}">삭제</button>`}</div></form>`;
  return`<div class="it stack" style="gap:6px">
    <div class="row" style="align-items:flex-start;flex-wrap:nowrap"><div style="font-family:var(--serif);font-size:17px;flex:1;min-width:0;white-space:pre-wrap">${esc(e.text)}</div><button class="t" data-act="eedit" data-id="${e.id}">수정</button></div>
    <div class="muted small">— ${esc(b?b.title:'')}${e.page?', '+e.page+'쪽':''}${e.why?' · '+esc(e.why):''}</div>
    <label class="small muted" for="mine-${e.id}">내 문장으로 써보기</label>
    <textarea id="mine-${e.id}" data-mine="${e.id}" placeholder="같은 구조로 다른 내용을 써 보세요" style="min-height:44px">${esc(e.mine)}</textarea></div>`}
function vVocab(){
  const kinds=['전체',...VKINDS];
  const ok=v=>V.vkind==='전체'||v.kind===V.vkind;
  if(V.vview==='hanja'){const idx=Object.values(hanjaIndex()).sort((a,b)=>b.words.length-a.words.length||a.c.localeCompare(b.c));
    const cur=V.hanja&&idx.find(x=>x.c===V.hanja);
    return`<div class="stack"><div class="row" style="justify-content:space-between"><h2 style="margin:0">어휘함 · 한자</h2>${vTabs()}</div>
     <p class="muted small" style="margin:0">한자 풀이를 적은 단어들이 글자별로 모여요. 같은 글자를 쓰는 단어가 늘어날수록 뜻을 짐작하기 쉬워져요.</p>
     <div class="grid2"><div class="panel hgrid">${idx.map(x=>`<button class="hcell ${cur&&cur.c===x.c?'on':''}" data-act="hanja" data-k="${esc(x.c)}"><b>${esc(x.c)}</b><span>${esc(x.m)}</span><i>${x.words.length}</i></button>`).join('')||'<p class="muted small">아직 한자 풀이를 적은 단어가 없어요.</p>'}</div>
     <aside class="panel stack">${cur?`<div class="row"><b class="vw" style="font-size:34px">${esc(cur.c)}</b><span>${esc(cur.m)}</span></div>${cur.words.map(w=>`<div><b>${esc(w.word)}</b> <span class="vh">${esc(hword(w))}</span>${w.mean?`<div class="small">${esc(w.mean)}</div>`:''}</div>`).join('')}<p class="small muted" style="margin:0">이 글자가 들어간 다른 단어를 만나면 한자 풀이와 함께 추가해 보세요.</p>`:'<p class="muted small">왼쪽에서 글자를 고르면 그 글자를 쓰는 단어가 보여요.</p>'}</aside></div></div>`}
  const gs=S.vgroups.filter(g=>g.ids.some(id=>{const w=vword(id);return w&&ok(w)}));
  const vs=S.vocab.filter(v=>ok(v)&&!(v.parent&&vword(v.parent)));
  return`<div class="stack"><div class="row" style="justify-content:space-between"><h2 style="margin:0">어휘함 <span class="muted small">${S.vocab.length}개</span></h2>${vTabs()}</div>
  <div class="row">${kinds.map(k=>`<button class="btn sm ${V.vkind===k?'':'ghost'}" data-act="vkind" data-k="${k}">${k}</button>`).join('')}<span style="flex:1"></span><button class="btn sm" data-act="vnew">새 단어·표현</button></div>
  ${V.vnew?`<form class="panel stack composer" id="f-vadd">${vFields({src:'대화·추천받음'},true)}<div class="row"><button class="btn sm">추가</button><button type="button" class="btn sm ghost" data-act="vnewno">취소</button></div></form>`:''}
  <div class="vcards">${vs.map(v=>vCard(v,false)).join('')||'<p class="muted">아직 없어요.</p>'}</div>
  <h3 style="margin:8px 0 0">비교 묶음</h3>
  <div class="stack">${gs.map(cmpHTML).join('')||'<p class="muted small">비슷한 말, 반대말, 헷갈리는 말을 묶으면 나란히 비교할 수 있어요.</p>'}</div>
  <form class="panel row" id="f-grp"><select id="g-a" required><option value="">단어 A</option>${S.vocab.map(v=>`<option value="${v.id}">${esc(v.word)}</option>`).join('')}</select>
    <select id="g-t">${VTYPES.map(t=>`<option>${t}</option>`).join('')}</select>
    <select id="g-b" required><option value="">단어 B</option>${S.vocab.map(v=>`<option value="${v.id}">${esc(v.word)}</option>`).join('')}</select>
    <button class="btn sm">묶기</button></form></div>`}
const vTabs=()=>`<div class="row">${[['list','단어'],['hanja','한자']].map(([k,l])=>`<button class="btn sm ${(V.vview||'list')===k?'':'ghost'}" data-act="vview" data-k="${k}">${l}</button>`).join('')}</div>`;

/* ---------- 이벤트 ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  if(a==='tab'){V.tab=el.dataset.k;V.q=null;V.delArm=null}
  else if(a==='gotopic'||a==='seltopic'){V.topic=id;V.tab='topic';V.q=null}
  else if(a==='gobook'){if(!id)return;touchBook(id);V.editNote=null;V.book=id;V.tab='book';V.q=null;V.stopArm=false;V.editBook=false}
  else if(a==='openq'){V.q=id}
  else if(a==='closeq'){V.q=null}
  else if(a==='ctype'){V.ctype=el.dataset.k}
  else if(a==='vkind'){V.vkind=el.dataset.k}
  else if(a==='editbook'){V.editBook=!V.editBook}
  else if(a==='finish'){const b={...book(V.book),status:'완독',end:todayStr(),stoppedAt:null};V.stopArm=false;put('books',b);toast('완독을 기록했어요. 정리를 남겨 보세요')}
  else if(a==='pause'){V.stopArm=true}
  else if(a==='resume'){put('books',{...book(V.book),status:'읽는 중',stoppedAt:null})}
  else if(a==='qstatus'){const q=note(id);const o=['열림','생각 중','답이 생김'];put('notes',{...q,status:o[(o.indexOf(q.status)+1)%3]})}
  else if(a==='delnote'){V.delArm=id}
  else if(a==='delno'){V.delArm=null}
  else if(a==='enew'){V.enew=true}
  else if(a==='enewno'){V.enew=false}
  else if(a==='eedit'){V.editExpr=id;V.edelArm=null}
  else if(a==='eeditno'){V.editExpr=null}
  else if(a==='edel'){V.edelArm=id}
  else if(a==='edelok'){V.editExpr=null;V.edelArm=null;del('expr',id);toast('삭제했어요')}
  else if(a==='goaledit'){V.goalEdit=id}
  else if(a==='goalno'){V.goalEdit=null}
  else if(a==='goalclear'){put('topics',{...topic(id),goal:null});V.goalEdit=null;toast('목표를 없앴어요')}
  else if(a==='shelf'){V.shelf=el.dataset.k;V.shelfQ=''}
  else if(a==='vview'){V.vview=el.dataset.k}
  else if(a==='hanja'){V.hanja=el.dataset.k;V.vview='hanja';V.tab='vocab'}
  else if(a==='vnew'){V.vnew=true}
  else if(a==='vnewno'){V.vnew=false}
  else if(a==='vedit'){V.editVocab=id;V.vdelArm=null}
  else if(a==='veditno'){V.editVocab=null}
  else if(a==='vchild'){V.vchildFor=id}
  else if(a==='vchildno'){V.vchildFor=null}
  else if(a==='vdel'){V.vdelArm=id}
  else if(a==='vdelok'){V.editVocab=null;V.vdelArm=null;S.vocab.filter(x=>x.parent===id).forEach(x=>put('vocab',{...x,parent:null}));
    S.vgroups.filter(g=>g.ids.includes(id)).forEach(g=>{const ids=g.ids.filter(x=>x!==id);ids.length<2?del('vgroups',g.id):put('vgroups',{...g,ids})});del('vocab',id);toast('삭제했어요')}
  else if(a==='editnote'){V.editNote=id;V.delArm=null;PEND.e=[...(note(id).imgs||[])]}
  else if(a==='editno'){const n=note(V.editNote);if(n)dropPhotos(PEND.e.filter(x=>!(n.imgs||[]).includes(x)));PEND.e=[];V.editNote=null}
  else if(a==='hl'){const f=el.closest('form'),t=lastTA&&f&&f.contains(lastTA)?lastTA:document.getElementById(el.dataset.for);toggleHL(t);return}
  else if(a==='pdel'){PEND[el.dataset.k].splice(+el.dataset.i,1);renderPend(el.dataset.k);return}
  else if(a==='lightbox'){lightbox(id);return}
  else if(a==='core'){CORE=!CORE;try{localStorage.setItem('rd_core',CORE?'1':'0')}catch(e){}}
  else if(a==='mvup'||a==='mvdn'){moveNote(id,a==='mvup'?-1:1)}
  else if(a==='delok'){V.delArm=null;dropPhotos((note(id)||{}).imgs);S.links.filter(l=>l.from===id||l.to===id).forEach(l=>del('links',l.id));del('notes',id);toast('삭제했어요')}
  else if(a==='export'){doExport();return}
  else if(a==='connect'){connect();return}
  else if(a==='goconn'){V.tab='home';render();const c=document.getElementById('conn');if(c)c.scrollIntoView({behavior:'smooth',block:'start'});return}
  else if(a==='env'){setEnv(el.dataset.k);return}
  else if(a==='syncnow'){(async()=>{if(dirtyS)await flush();await pull();toast(syncErr?'동기화하지 못했어요. 잠시 뒤 다시 해 주세요':'최신 상태예요');render()})();return}
  else if(a==='copyexp'){const t=document.getElementById('exp-text');try{navigator.clipboard.writeText(V.exportText).then(()=>toast('복사했어요'),()=>{t.select();toast('선택했어요. 복사해 주세요')})}catch(err){t.select()}return}
  else if(a==='impok'){const d=V.impArm.data;V.impArm=null;doImport(d);return}
  else if(a==='impno'){V.impArm=null}
  else return;
  render()});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='b-pick'){V.book=t.value;V.q=null;V.stopArm=false;V.editBook=false;render()}
  else if(t.dataset.gdiff){const g=S.vgroups.find(x=>x.id===t.dataset.gdiff);put('vgroups',{...g,diff:t.value});toast('저장했어요')}
  else if(t.id==='t-status'){put('topics',{...topic(t.dataset.id),status:t.value});render()}
  else if(t.dataset.mine){const x=S.expr.find(x=>x.id===t.dataset.mine);put('expr',{...x,mine:t.value});toast('저장했어요')}
  else if(t.id==='imp-file'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
      const count=COLS.reduce((n,c)=>n+(Array.isArray(d[c])?d[c].length:0),0);if(!count)throw new Error();V.impArm={data:d,count};render()}
    catch(err){toast('이 앱에서 내보낸 백업 파일이 아니에요')}};r.readAsText(t.files[0])}
});

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='book-q'){e.preventDefault();const f=document.querySelector('#book-q-res .bhit');if(f)f.click()}
  if(e.key==='Escape'&&e.target.id==='book-q'){e.target.value='';document.getElementById('book-q-res').hidden=true}});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target.id,g=id=>{const x=document.getElementById(id);return x?x.value.trim():''};
  if(f==='f-book'){const id=uid();put('books',{id,title:g('nb-title'),author:g('nb-author'),translator:g('nb-translator'),publisher:g('nb-publisher'),pages:+g('nb-pages')||null,topics:[V.topic],status:'읽는 중',start:todayStr(),end:null,stoppedAt:null});V.book=id;V.tab='book';toast('책을 추가했어요')}
  else if(f==='f-topic'){const id=uid();put('topics',{id,name:g('nt-name'),parent:g('nt-parent')||null,status:'진행 중',goal:+g('nt-goal')||null});V.topic=id;toast('주제를 만들었어요')}
  else if(f==='f-bedit'){const b=book(V.book);const nb={...b,title:g('be-title'),author:g('be-author'),translator:g('be-translator'),publisher:g('be-publisher'),pages:+g('be-pages')||null,start:g('be-start')||null,end:g('be-end')||null,topics:g('be-topic')?[g('be-topic')]:b.topics};put('books',nb);saveMarks('be',nb,g);V.editBook=false;toast('책 정보를 저장했어요')}
  else if(f==='f-stat'){const p=+g('stop-pg');if(!p)return;put('books',{...book(V.book),status:'멈춤',stoppedAt:p,stoppedOn:todayStr()});V.stopArm=false;toast('멈춤을 기록했어요. 중간 정리를 남겨 보세요')}
  else if(f==='f-nedit'){const n=note(e.target.dataset.id),type=(e.target.querySelector('[name=ne-type]:checked')||{}).value||n.type,text=g('ne-text');
    if(PEND.e.some(isTmp)){toast('그림을 올리는 중이에요. 잠시 뒤 저장해 주세요');return}
    if(!text&&!g('ne-detail')&&!PEND.e.length){toast('내용이나 그림을 넣어 주세요');return}
    dropPhotos((n.imgs||[]).filter(x=>!PEND.e.includes(x)));
    const nn={...n,type,text,imgs:[...PEND.e],detail:g('ne-detail'),page:+g('ne-page')||null,date:g('ne-date')||n.date,stage:g('ne-stage')};
    if(type==='질문'&&!nn.status)nn.status='열림';
    put('notes',nn);PEND.e=[];V.editNote=null;toast('수정했어요')}
  else if(f==='f-vadd'){const v=readVocab(g);if(!v.word)return;const vid=uid();put('vocab',{id:vid,...v,box:1});if(g('vf-cmp'))linkWords(g('vf-cmp'),vid,g('vf-vt'),g('vf-diff'));V.vnew=false;V.vchildFor=null;toast('어휘함에 담았어요')}
  else if(f==='f-vedit'){const old=vword(e.target.dataset.id),v=readVocab(g);if(!v.word)return;put('vocab',{...old,...v});V.editVocab=null;toast('수정했어요')}
  else if(f==='f-eadd'||f==='f-eedit'){const text=g('ef-text');if(!text)return;const v={text,why:g('ef-why'),bookId:g('ef-book')||null,page:+g('ef-page')||null};
    if(f==='f-eadd'){put('expr',{id:uid(),...v,tags:[],mine:'',box:1});V.enew=false;toast('표현 수집함에 담았어요')}
    else{const old=S.expr.find(x=>x.id===e.target.dataset.id);put('expr',{...old,...v});V.editExpr=null;toast('수정했어요')}}
  else if(f==='f-goal'){const n=+g('goal-n');if(!n)return;put('topics',{...topic(e.target.dataset.id),goal:n});V.goalEdit=null;toast('목표를 '+n+'권으로 정했어요')}
  else if(f==='f-grp'){if(g('g-a')===g('g-b')){toast('서로 다른 두 단어를 골라 주세요');return}linkWords(g('g-a'),g('g-b'),g('g-t'),'');toast('묶었어요')}
  else if(f==='f-note'){const b=book(V.book),T=V.ctype,text=g('c-text'),date=g('c-date')||todayStr(),page=+g('c-page')||null;if(T!=='어휘'&&T!=='표현'&&PEND.c.some(isTmp)){toast('그림을 올리는 중이에요. 잠시 뒤 추가해 주세요');return}
    if(!text&&T!=='어휘'&&!(T!=='표현'&&PEND.c.length)){toast(T==='그림'?'그림을 넣어 주세요':'내용을 넣어 주세요');return}
    if(T==='어휘'){const vid=uid(),v=readVocab(g);if(!v.word)return;put('vocab',{id:vid,...v,box:1});if(g('vf-cmp'))linkWords(g('vf-cmp'),vid,g('vf-vt'),g('vf-diff'));toast('어휘함에 담았어요')}
    else if(T==='표현'){put('expr',{id:uid(),bookId:b.id,page,text,why:g('c-why'),tags:[],mine:'',box:1});toast('표현 수집함에 담았어요')}
    else{const id=uid(),order=S.notes.filter(n=>n.bookId===b.id).length+1;
      const imgs=[...PEND.c];PEND.c=[];
      put('notes',{id,bookId:b.id,date,type:T,text,detail:g('c-detail')||'',imgs,page,order,stage:b.status==='완독'?'완독 정리':'중간 정리',...(T==='질문'?{status:'열림'}:{})});
      if(T==='생각'&&g('c-q'))put('links',{id:uid(),from:id,to:g('c-q'),rel:g('c-rel'),date});
      if(T==='인용'&&document.getElementById('c-toexpr')?.checked)put('expr',{id:uid(),bookId:b.id,page,text,why:'',tags:[],mine:'',box:1});
      toast('기록했어요')}}
  else return;
  render()});

function doExport(){
  const out={app:'주제 독서 노트',format:1,exportedAt:new Date().toISOString()};COLS.forEach(c=>out[c]=S[c]);
  const text=JSON.stringify(out,null,2),name='독서노트-백업-'+todayStr()+'.json';
  try{const u=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('백업 파일을 내려받았어요');V.exportText=''}
  catch(e){V.exportText=text;render()}}
async function doImport(d){
  let n=0;toast('합치는 중…');
  for(const c of COLS){if(!Array.isArray(d[c]))continue;
    for(const obj of d[c]){if(!obj||typeof obj.id!=='string')continue;put(c,obj);n++}}
  toast(n+'개 항목을 합쳤어요'+(MODE==='db'?'. 시트에 올리는 중…':''));render()}

render();boot();
</script>
